<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القيادة | المستشار</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #818cf8; --secondary: #c084fc; --bg: #030712; --card: #111827; --text: #f9fafb; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 1300px; margin: auto; }
        
        /* البطاقات العلوية */
        .stat-card { 
            background: var(--card); padding: 25px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s; position: relative; overflow: hidden;
        }
        .stat-card::after { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); }
        .stat-card h3 { font-size: 32px; margin: 10px 0; font-weight: 900; }
        .stat-card p { color: #9ca3af; font-size: 14px; margin: 0; }

        /* منطقة الرسوم البيانية */
        .chart-box { 
            background: var(--card); padding: 25px; border-radius: 24px; grid-column: span 2; 
            border: 1px solid rgba(255,255,255,0.05); min-height: 300px;
        }

        /* جدول النتائج الأخير */
        .recent-results { background: var(--card); padding: 25px; border-radius: 24px; grid-column: span 4; border: 1px solid rgba(255,255,255,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: right; color: var(--primary); padding: 12px; font-size: 13px; border-bottom: 2px solid #1f2937; }
        td { padding: 15px; border-bottom: 1px solid #1f2937; font-size: 14px; }
        
        .badge-pro { background: linear-gradient(45deg, var(--primary), var(--secondary)); padding: 4px 12px; border-radius: 8px; font-size: 11px; }

        @media (max-width: 900px) { .grid-container { grid-template-columns: 1fr; } .chart-box { grid-column: span 1; } .recent-results { grid-column: span 1; } }
    </style>
</head>
<body>

<div class="grid-container">
    <div style="grid-column: span 4; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h1 style="margin:0">مرحباً يا <span id="studentName" style="color: var(--primary);">بطل</span> 🔥</h1>
            <p style="color:#9ca3af">إليك ملخص أدائك الأكاديمي الحالي</p>
        </div>
        <button onclick="location.reload()" style="background:none; border:1px solid #374151; color:white; padding:10px 20px; border-radius:12px; cursor:pointer"><i class="fas fa-sync"></i> تحديث البيانات</button>
    </div>

    <div class="stat-card">
        <p>إجمالي الاختبارات</p>
        <h3 id="totalExams">0</h3>
    </div>
    <div class="stat-card">
        <p>متوسط الدرجات</p>
        <h3 id="avgScore">0%</h3>
    </div>
    <div class="stat-card">
        <p>الترتيب الحالي</p>
        <h3 id="rank">#1</h3>
    </div>
    <div class="stat-card" style="background: linear-gradient(135deg, #1e1b4b, #111827);">
        <p>النقاط المجموعة</p>
        <h3 id="totalPoints" style="color: #fbbf24;">0</h3>
    </div>

    <div class="chart-box">
        <p style="margin-top:0; font-weight:bold">📈 تحليل التقدم الزمني</p>
        <canvas id="lineChart"></canvas>
    </div>
    <div class="chart-box">
        <p style="margin-top:0; font-weight:bold">🎯 توزيع مهارات المادة</p>
        <canvas id="radarChart"></canvas>
    </div>

    <div class="recent-results">
        <p style="margin-top:0; font-weight:bold">📋 أحدث النتائج التفصيلية</p>
        <table>
            <thead>
                <tr>
                    <th>اسم الاختبار</th>
                    <th>التاريخ</th>
                    <th>الدرجة</th>
                    <th>النسبة</th>
                    <th>الوسام</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const userEmail = localStorage.getItem("userEmail");
    document.getElementById('studentName').innerText = localStorage.getItem("userName") || "حازم";

    async function fetchDashboardData() {
        const snap = await db.collection("results")
            .where("studentEmail", "==", userEmail)
            .orderBy("submittedAt", "asc").get();

        let scores = [];
        let labels = [];
        let totalPercent = 0;
        let totalPoints = 0;
        const table = document.getElementById('tableBody');

        snap.forEach(doc => {
            const d = doc.data();
            const p = (d.score / d.total) * 100;
            scores.push(p.toFixed(1));
            labels.push(d.examTitle);
            totalPercent += p;
            totalPoints += d.score;

            table.innerHTML += `
                <tr>
                    <td><b>${d.examTitle}</b></td>
                    <td>${d.submittedAt.toDate().toLocaleDateString('ar-EG')}</td>
                    <td>${d.score} / ${d.total}</td>
                    <td>%${p.toFixed(0)}</td>
                    <td><span class="badge-pro">${p > 90 ? '💎 ماسي' : '⭐ ذهبي'}</span></td>
                </tr>`;
        });

        document.getElementById('totalExams').innerText = snap.size;
        document.getElementById('avgScore').innerText = snap.size ? (totalPercent / snap.size).toFixed(0) + "%" : "0%";
        document.getElementById('totalPoints').innerText = totalPoints;

        renderCharts(labels, scores);
    }

    function renderCharts(labels, scores) {
        // Line Chart
        new Chart(document.getElementById('lineChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'مستواك',
                    data: scores,
                    borderColor: '#818cf8',
                    backgroundColor: 'rgba(129, 140, 248, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });

        // Radar Chart (Example Data)
        new Chart(document.getElementById('radarChart'), {
            type: 'radar',
            data: {
                labels: ['سرعة', 'دقة', 'تركيز', 'مقالي', 'اختياري'],
                datasets: [{
                    label: 'المهارات',
                    data: [80, 90, 70, 85, 95],
                    backgroundColor: 'rgba(192, 132, 252, 0.2)',
                    borderColor: '#c084fc'
                }]
            },
            options: { plugins: { legend: { display: false } } }
        });
    }

    fetchDashboardData();
</script>
</body>
</html>
