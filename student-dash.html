<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الأداء | المستشار</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --bg: #0b0f1a; --card: #161e2d; --accent: #10b981; --danger: #f43f5e; --warning: #f59e0b; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #f1f5f9; margin: 0; padding-bottom: 50px; }

        .navbar { background: var(--card); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d3748; }
        .btn-back { text-decoration: none; color: #fff; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 10px; font-size: 14px; transition: 0.3s; }
        .btn-back:hover { background: var(--primary); }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

        /* Statistics Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #2d3748; position: relative; overflow: hidden; }
        .stat-card i { position: absolute; left: -10px; bottom: -10px; font-size: 80px; opacity: 0.05; color: #fff; }
        .stat-val { font-size: 32px; font-weight: 900; display: block; margin: 10px 0; }
        .stat-label { color: #94a3b8; font-size: 14px; }

        /* تقدير الطالب */
        .rank-excellent { color: var(--accent); }
        .rank-good { color: var(--warning); }
        .rank-fail { color: var(--danger); }

        /* Table Style */
        .table-container { background: var(--card); border-radius: 20px; border: 1px solid #2d3748; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { background: rgba(255,255,255,0.03); padding: 15px; color: #94a3b8; font-weight: 600; border-bottom: 1px solid #2d3748; }
        td { padding: 15px; border-bottom: 1px solid #2d3748; font-size: 15px; }
        tr:last-child td { border: none; }
        
        .badge { padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .badge-success { background: rgba(16, 185, 129, 0.1); color: var(--accent); }
        .badge-danger { background: rgba(244, 63, 94, 0.1); color: var(--danger); }

        /* تحليل الخطأ */
        .error-analysis { margin-top: 40px; background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #2d3748; }
        .progress-box { background: #2d3748; height: 12px; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); transition: 1s ease-out; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate { animation: slideUp 0.6s forwards; }
    </style>
</head>
<body>

<nav class="navbar">
    <div style="font-weight: 900; font-size: 20px; color: var(--primary);">المستشار <span style="color:#fff">Analytics</span></div>
    <a href="home.html" class="btn-back"><i class="fas fa-chevron-right"></i> العودة للمنصة</a>
</nav>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card animate">
            <i class="fas fa-graduation-cap"></i>
            <span class="stat-label">إجمالي الاختبارات</span>
            <span class="stat-val" id="totalExams">0</span>
        </div>
        <div class="stat-card animate" style="animation-delay: 0.1s">
            <i class="fas fa-star"></i>
            <span class="stat-label">المعدل العام</span>
            <span class="stat-val rank-excellent" id="avgScore">0%</span>
        </div>
        <div class="stat-card animate" style="animation-delay: 0.2s">
            <i class="fas fa-award"></i>
            <span class="stat-label">التقدير الحالي</span>
            <span class="stat-val" id="studentRank">--</span>
        </div>
        <div class="stat-card animate" style="animation-delay: 0.3s">
            <i class="fas fa-times-circle"></i>
            <span class="stat-label">أسئلة تحتاج مراجعة</span>
            <span class="stat-val" id="wrongAnswersCount" style="color:var(--danger)">0</span>
        </div>
    </div>

    <div class="error-analysis animate" style="animation-delay: 0.4s">
        <h3 style="margin:0">تحليل كفاءة الإجابات</h3>
        <div class="progress-box">
            <div id="accuracyBar" class="progress-fill" style="width: 0%"></div>
        </div>
        <p style="color:#94a3b8; font-size: 14px;" id="accuracyText">لقد أجبت على 0% من الأسئلة بشكل صحيح عبر جميع الاختبارات.</p>
    </div>

    <h3 class="animate" style="margin: 30px 0 15px 0; animation-delay: 0.5s">سجل أداء الاختبارات</h3>
    <div class="table-container animate" style="animation-delay: 0.6s">
        <table>
            <thead>
                <tr>
                    <th>اسم الاختبار</th>
                    <th>التاريخ</th>
                    <th>الدرجة</th>
                    <th>النسبة</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="resultsTableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const userEmail = localStorage.getItem("userEmail") || "test@test.com";

    async function fetchPerformance() {
        const snap = await db.collection("results")
            .where("studentEmail", "==", userEmail)
            .orderBy("submittedAt", "desc")
            .get();

        if(snap.empty) {
            document.getElementById('resultsTableBody').innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px;">لم يتم العثور على سجلات سابقة.</td></tr>';
            return;
        }

        let totalScore = 0;
        let totalPossible = 0;
        let wrongAnswers = 0;
        let count = 0;

        const tableBody = document.getElementById('resultsTableBody');
        tableBody.innerHTML = "";

        snap.forEach(doc => {
            const res = doc.data();
            count++;
            
            // حسابات الأسئلة الخاطئة من داخل مصفوفة التحليل
            if(res.analysis) {
                res.analysis.forEach(a => {
                    if(!a.isCorrect) wrongAnswers++;
                    totalPossible += 1; // نفترض نقطة لكل سؤال لو مش متحدد
                    if(a.isCorrect) totalScore += 1;
                });
            }

            // حساب النسبة المئوية للامتحان الواحد
            const examPercent = ((res.score / (res.analysis ? res.analysis.length : 1)) * 100).toFixed(1);
            const date = res.submittedAt ? res.submittedAt.toDate().toLocaleDateString('ar-EG') : '---';

            tableBody.innerHTML += `
                <tr>
                    <td><strong>${res.examTitle || 'اختبار عام'}</strong></td>
                    <td style="color:#94a3b8">${date}</td>
                    <td>${res.score}</td>
                    <td>${examPercent}%</td>
                    <td><span class="badge ${examPercent >= 50 ? 'badge-success' : 'badge-danger'}">${examPercent >= 50 ? 'ناجح' : 'راسب'}</span></td>
                </tr>
            `;
        });

        // تحديث الإحصائيات العلوية
        const finalAvg = ((totalScore / totalPossible) * 100).toFixed(1);
        document.getElementById('totalExams').innerText = count;
        document.getElementById('avgScore').innerText = finalAvg + "%";
        document.getElementById('wrongAnswersCount').innerText = wrongAnswers;
        
        // شريط الكفاءة
        document.getElementById('accuracyBar').style.width = finalAvg + "%";
        document.getElementById('accuracyText').innerText = `أداؤك العام مستقر عند ${finalAvg}% مع وجود ${wrongAnswers} خطأ مسجل في قاعدة بياناتنا.`;

        // التقدير
        let rank = "مقبول";
        let rankClass = "rank-fail";
        if(finalAvg >= 90) { rank = "ممتاز 🏆"; rankClass = "rank-excellent"; }
        else if(finalAvg >= 80) { rank = "جيد جداً ⭐"; rankClass = "rank-excellent"; }
        else if(finalAvg >= 65) { rank = "جيد 👍"; rankClass = "rank-good"; }
        
        const rankEl = document.getElementById('studentRank');
        rankEl.innerText = rank;
        rankEl.className = "stat-val " + rankClass;
    }

    fetchPerformance();
</script>

</body>
</html>
