<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إنجازاتي | منصة المستشار</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        .container { max-width: 1000px; margin: auto; }
        
        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { background: var(--card); color: white; border: 1px solid var(--primary); padding: 8px 20px; border-radius: 12px; cursor: pointer; text-decoration: none; font-size: 14px; }

        /* كروت الإحصائيات */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-card i { font-size: 24px; color: var(--primary); margin-bottom: 10px; }
        .stat-card h3 { margin: 5px 0; font-size: 28px; font-weight: 800; }
        .stat-card p { margin: 0; color: #94a3b8; font-size: 13px; }

        /* جدول الدرجات */
        .results-table-container { background: var(--card); border-radius: 25px; overflow: hidden; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { background: rgba(99, 102, 241, 0.1); padding: 15px; color: var(--primary); font-weight: 800; font-size: 14px; }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        tr:last-child td { border: none; }
        
        .badge { padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; }
        .badge-success { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
        .badge-pending { background: rgba(251, 191, 36, 0.1); color: #fbbf24; }

        .no-data { text-align: center; padding: 50px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h2>لوحة درجاتي 📊</h2>
        <a href="home.html" class="back-btn"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <i class="fas fa-file-alt"></i>
            <h3 id="totalExams">0</h3>
            <p>اختبارات تم دخولها</p>
        </div>
        <div class="stat-card">
            <i class="fas fa-percentage"></i>
            <h3 id="avgScore">0%</h3>
            <p>متوسط التقييم</p>
        </div>
        <div class="stat-card">
            <i class="fas fa-trophy"></i>
            <h3 id="highestScore">0</h3>
            <p>أعلى درجة</p>
        </div>
    </div>

    <div class="results-table-container">
        <table>
            <thead>
                <tr>
                    <th>اسم الاختبار</th>
                    <th>التاريخ</th>
                    <th>الدرجة</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="resultsTable">
                </tbody>
        </table>
        <div id="loader" class="no-data">جاري جلب نتائجك من السحابة...</div>
    </div>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const userEmail = localStorage.getItem("userEmail");

    if(!userEmail) {
        alert("برجاء تسجيل الدخول أولاً");
        window.location.href = "index.html";
    }

    // جلب النتائج الخاصة بالطالب فقط بناءً على الإيميل
    db.collection("results")
      .where("studentEmail", "==", userEmail)
      .orderBy("submittedAt", "desc")
      .onSnapshot(snap => {
        const table = document.getElementById('resultsTable');
        const loader = document.getElementById('loader');
        table.innerHTML = "";
        
        if(snap.empty) {
            loader.innerHTML = "لم تقم بدخول أي اختبارات بعد. ابدأ الآن!";
            return;
        }
        loader.style.display = 'none';

        let total = 0;
        let count = 0;
        let max = 0;

        snap.forEach(doc => {
            const data = doc.data();
            const date = data.submittedAt ? data.submittedAt.toDate().toLocaleDateString('ar-EG') : '---';
            
            // حساب الإحصائيات
            count++;
            let percent = (data.score / data.total) * 100;
            total += percent;
            if(data.score > max) max = data.score;

            // تحديد لون الحالة
            const statusBadge = data.status === 'تم التصحيح' 
                ? `<span class="badge badge-success">تم التصحيح</span>`
                : `<span class="badge badge-pending">قيد المراجعة</span>`;

            table.innerHTML += `
                <tr>
                    <td><b>${data.examTitle}</b></td>
                    <td>${date}</td>
                    <td dir="ltr"><b>${data.score} / ${data.total}</b></td>
                    <td>${statusBadge}</td>
                </tr>
            `;
        });

        // تحديث كروت الإحصائيات
        document.getElementById('totalExams').innerText = count;
        document.getElementById('avgScore').innerText = Math.round(total / count) + "%";
        document.getElementById('highestScore').innerText = max;
    });
</script>

</body>
</html>
