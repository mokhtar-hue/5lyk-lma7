<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الأداء التحليلية | المستشار</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #6366f1; --bg: #0b0f1a; --card: #161e2d; --accent: #10b981; --danger: #f43f5e; --warning: #f59e0b; --info: #3b82f6; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #f1f5f9; margin: 0; padding-bottom: 50px; }
        
        .navbar { background: var(--card); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d3748; position: sticky; top: 0; z-index: 100; }
        .btn-back { text-decoration: none; color: #fff; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 10px; font-size: 14px; transition: 0.3s; display: flex; align-items: center; gap: 8px; border: none; cursor: pointer; }
        
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #2d3748; position: relative; overflow: hidden; }
        .stat-card i { position: absolute; left: -10px; bottom: -10px; font-size: 70px; opacity: 0.1; color: #fff; }
        .stat-val { font-size: 28px; font-weight: 900; display: block; margin: 10px 0; }
        .stat-label { color: #94a3b8; font-size: 14px; font-weight: bold; }

        /* Tables & Lists */
        .table-container { background: var(--card); border-radius: 20px; border: 1px solid #2d3748; overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; text-align: right; min-width: 600px; }
        th { background: rgba(255,255,255,0.03); padding: 15px; color: #94a3b8; border-bottom: 1px solid #2d3748; }
        td { padding: 15px; border-bottom: 1px solid #2d3748; }
        
        .error-item { background: rgba(244, 63, 94, 0.05); border: 1px solid rgba(244, 63, 94, 0.1); padding: 15px; border-radius: 15px; margin-bottom: 10px; border-right: 4px solid var(--danger); }
        .error-q { font-weight: bold; color: #fff; display: block; }
        .correct-ans { color: var(--accent); font-weight: bold; font-size: 14px; margin-top: 5px; display: block; }

        .progress-box { background: #1e293b; height: 12px; border-radius: 6px; margin: 15px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: 2s ease-in-out; width: 0%; }
        
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .badge-success { background: rgba(16, 185, 129, 0.1); color: var(--accent); }
        .badge-danger { background: rgba(244, 63, 94, 0.1); color: var(--danger); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate { animation: fadeIn 0.5s forwards; }

        /* Loading Screen */
        #loader { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(99, 102, 241, 0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p style="margin-top: 20px; color: var(--primary);">جاري استرجاع بياناتك...</p>
</div>

<nav class="navbar">
    <div style="font-weight: 900; font-size: 20px; color: var(--primary);"><i class="fas fa-chart-bar"></i> تحليل أداء: <span id="studentNameTop" style="color:#fff">...</span></div>
    <div style="display: flex; gap: 10px;">
        <a href="home.html" class="btn-back"><i class="fas fa-home"></i> الرئيسية</a>
        <button onclick="logout()" class="btn-back" style="background: var(--danger);"><i class="fas fa-sign-out-alt"></i> خروج</button>
    </div>
</nav>

<div class="container" id="mainContent" style="opacity: 0;">
    <div class="stats-grid">
        <div class="stat-card animate">
            <i class="fas fa-file-signature"></i>
            <span class="stat-label">اختبارات منتهية</span>
            <span class="stat-val" id="totalExams">0</span>
        </div>
        <div class="stat-card animate" style="animation-delay: 0.1s">
            <i class="fas fa-percentage"></i>
            <span class="stat-label">المعدل التراكمي</span>
            <span class="stat-val" id="avgScore" style="color: var(--accent);">0%</span>
        </div>
        <div class="stat-card animate" style="animation-delay: 0.2s">
            <i class="fas fa-award"></i>
            <span class="stat-label">التقدير العام</span>
            <span class="stat-val" id="studentRank">--</span>
        </div>
        <div class="stat-card animate" style="animation-delay: 0.3s">
            <i class="fas fa-brain"></i>
            <span class="stat-label">نقاط القوة</span>
            <span class="stat-val" id="strengthPoints" style="color: var(--info);">--</span>
        </div>
    </div>

    <div class="stat-card animate" style="animation-delay: 0.4s; margin-bottom: 30px;">
        <h3 style="margin:0; font-size: 18px;">مستوى التمكن من المنهج</h3>
        <div class="progress-box">
            <div id="accuracyBar" class="progress-fill"></div>
        </div>
        <p id="accuracyText" style="color:#94a3b8; font-size: 13px;">جاري تحليل مستواك العلمي...</p>
    </div>

    <h3 style="margin-top: 40px;"><i class="fas fa-list-check" style="color:var(--primary)"></i> سجل الدرجات الشخصي</h3>
    <div class="table-container animate">
        <table>
            <thead>
                <tr>
                    <th>الامتحان</th>
                    <th>التاريخ</th>
                    <th>الدرجة</th>
                    <th>النسبة</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="resultsTableBody"></tbody>
        </table>
    </div>

    <h3 style="margin-top: 40px; color: var(--danger);"><i class="fas fa-lightbulb"></i> بنك الأخطاء للتصحيح الذاتي</h3>
    <div id="errorsBank">
        <p style="color:#94a3b8">جاري البحث عن أخطاء سابقة لمراجعتها...</p>
    </div>
</div>

<script>
    // تهيئة Firebase بنفس بياناتك
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // جلب البيانات "أوتوماتيكياً" من المتصفح
    const userEmail = localStorage.getItem("userEmail");
    const userName = localStorage.getItem("userName");

    async function initDashboard() {
        // 1. التأكد من أن الطالب مسجل دخول بالفعل
        if (!userEmail) {
            alert("عذراً، لم نتمكن من التعرف عليك. سيتم توجيهك لصفحة الدخول.");
            window.location.href = "index.html"; // توجيه لصفحة الدخول لو البيانات مش موجودة
            return;
        }

        document.getElementById('studentNameTop').innerText = userName;
        await loadFullAnalytics();
        
        // إخفاء الـ Loader وإظهار المحتوى
        document.getElementById('loader').style.display = 'none';
        document.getElementById('mainContent').style.opacity = '1';
    }

    async function loadFullAnalytics() {
        try {
            // جلب النتائج بناءً على الإيميل المخزن تلقائياً
            const snap = await db.collection("results")
                .where("studentEmail", "==", userEmail)
                .get();

            if(snap.empty) {
                document.getElementById('resultsTableBody').innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px;">لم تخض أي اختبارات بعد. نتائجك ستظهر هنا فور انتهائك من أول امتحان.</td></tr>';
                document.getElementById('errorsBank').innerHTML = '<p style="color:#94a3b8">لا توجد أخطاء حالياً.</p>';
                return;
            }

            // ترتيب البيانات (الأحدث أولاً)
            const results = snap.docs.map(doc => doc.data())
                .sort((a, b) => (b.submittedAt?.seconds || 0) - (a.submittedAt?.seconds || 0));

            let totalPointsEarned = 0;
            let totalPointsPossible = 0;
            let errorItems = [];
            const tbody = document.getElementById('resultsTableBody');
            tbody.innerHTML = "";

            results.forEach(data => {
                let currentScore = data.score || 0;
                let currentMax = data.totalMCQPoints || 0;
                
                // جمع الأخطاء للمراجعة
                if(data.analysis) {
                    data.analysis.forEach(q => {
                        if(q.isCorrect === false) {
                            errorItems.push({ q: q.question, correct: q.correctAns, title: data.examTitle });
                        }
                    });
                }

                totalPointsEarned += currentScore;
                totalPointsPossible += currentMax;

                const percent = currentMax > 0 ? ((currentScore / currentMax) * 100).toFixed(1) : 0;
                const date = data.submittedAt ? new Date(data.submittedAt.seconds * 1000).toLocaleDateString('ar-EG') : '---';

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${data.examTitle}</strong></td>
                        <td style="color:#94a3b8">${date}</td>
                        <td style="font-weight:bold">${currentScore} / ${currentMax}</td>
                        <td style="color:${percent >= 50 ? 'var(--accent)' : 'var(--danger)'}">${percent}%</td>
                        <td>${percent >= 50 ? '<span class="badge badge-success">ناجح</span>' : '<span class="badge badge-danger">يحتاج مراجعة</span>'}</td>
                    </tr>
                `;
            });

            // حساب الإحصائيات
            const finalAvg = totalPointsPossible > 0 ? ((totalPointsEarned / totalPointsPossible) * 100).toFixed(1) : 0;
            document.getElementById('totalExams').innerText = results.length;
            document.getElementById('avgScore').innerText = finalAvg + "%";
            document.getElementById('accuracyBar').style.width = finalAvg + "%";
            
            // التقييم الذكي
            let rank = "مبتدئ"; let strength = "الإصرار";
            if(finalAvg >= 90) { rank = "مستشار عبقري 🏆"; strength = "الدقة والتركيز"; }
            else if(finalAvg >= 75) { rank = "متمكن جداً ⭐"; strength = "الفهم السريع"; }
            else if(finalAvg >= 50) { rank = "في تقدم مستمر 👍"; strength = "المحاولة الجادة"; }

            document.getElementById('studentRank').innerText = rank;
            document.getElementById('strengthPoints').innerText = strength;
            document.getElementById('accuracyText').innerText = `بناءً على ${results.length} اختبارات، حققت نسبة إتقان ${finalAvg}% للمهارات المختبرة.`;

            // عرض بنك الأخطاء
            const errBank = document.getElementById('errorsBank');
            if(errorItems.length > 0) {
                errBank.innerHTML = "";
                errorItems.slice(0, 6).forEach(err => {
                    errBank.innerHTML += `
                        <div class="error-item animate">
                            <span class="error-q">${err.q} <small style="color:var(--info)">(${err.title})</small></span>
                            <span class="correct-ans"><i class="fas fa-check-circle"></i> الحل الصحيح: ${err.correct}</span>
                        </div>
                    `;
                });
            } else {
                errBank.innerHTML = '<p style="color:var(--accent)">عمل رائع! سجلك خالٍ من الأخطاء المتكررة.</p>';
            }

        } catch (err) {
            console.error("Firebase Error:", err);
            document.getElementById('accuracyText').innerText = "حدث خطأ أثناء تحميل بيانات السحابة.";
        }
    }

    function logout() {
        if(confirm("هل تريد تسجيل الخروج؟")) {
            localStorage.clear();
            window.location.href = "index.html";
        }
    }

    // التشغيل التلقائي بمجرد فتح الصفحة
    window.onload = initDashboard;
</script>
</body>
</html>
