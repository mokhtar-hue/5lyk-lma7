<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

        منصة المستشار حـازم سالم | الدخول السحري

    <meta name="geo.region"
          content="EG">

         Firebase

    <style>

        :root {

            --primary: #6366f1;

            --bg: #0f172a;

            --card: #1e293b;

            --text: #f1f5f9;

            --input: #334155;

            --accent: #fbbf24;

            --danger: #ef4444;

            --trans:
                all 0.5s cubic-bezier(0.4, 0, 0.2, 1);

        }


        body.light-mode {

            --bg: #f8fafc;

            --card: #ffffff;

            --text: #1e293b;

            --input: #f1f5f9;

            --accent: #d97706;

        }


        * {
            box-sizing: border-box;
        }


        body {

            font-family: 'Cairo', sans-serif;

            background-color: var(--bg);

            color: var(--text);

            margin: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            overflow: hidden;

            transition: var(--trans);

        }


        /* =====================================================
           زر تغيير الوضع
        ===================================================== */

        .settings-fab {

            position: fixed;

            top: 20px;

            left: 20px;

            z-index: 10001;

            width: 45px;

            height: 45px;

            background: var(--card);

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.2);

            color: var(--accent);

            font-size: 20px;

            border:
                1px solid rgba(255,255,255,0.1);

        }


        /* =====================================================
           شاشة الدخول السحرية
        ===================================================== */

        #magicOverlay {

            position: fixed;

            inset: 0;

            background: var(--bg);

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            z-index: 10000;

            transition: 1.2s ease;

        }


        .intro-content {

            text-align: center;

            opacity: 0;

            transform: scale(0.8);

            animation:
                fadeInScale 1.5s forwards 0.5s;

        }


        .magic-scale-large {

            font-size: 150px;

            color: var(--accent);

            filter:
                drop-shadow(0 0 30px var(--accent));

            animation:
                scaleFloat 3s infinite ease-in-out;

        }


        .calligraphy-text {

            font-family: 'Reem Kufi', serif;

            font-size: 35px;

            color: var(--text);

            background:
                linear-gradient(
                    to right,
                    #fff,
                    var(--accent),
                    #fff
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            margin-top: 20px;

        }


        @keyframes fadeInScale {

            to {

                opacity: 1;

                transform: scale(1);

            }

        }


        @keyframes scaleFloat {

            0%, 100% {

                transform:
                    translateY(0)
                    rotate(-5deg);

            }

            50% {

                transform:
                    translateY(-20px)
                    rotate(5deg);

            }

        }


        /* =====================================================
           Login Card
        ===================================================== */

        .login-card {

            background: var(--card);

            padding: 50px 40px;

            border-radius: 40px;

            box-shadow:
                0 30px 60px -12px
                rgba(0, 0, 0, 0.5);

            width: 90%;

            max-width: 440px;

            text-align: center;

            border:
                1px solid rgba(255,255,255,0.05);

            display: none;

            opacity: 0;

            transform: translateY(30px);

            transition: var(--trans);

        }


        /* =====================================================
           Fields
        ===================================================== */

        .field {

            position: relative;

            margin-bottom: 20px;

            text-align: right;

        }


        .field i.main-icon {

            position: absolute;

            right: 18px;

            top: 50%;

            transform:
                translateY(-50%);

            color: var(--accent);

        }


        .field .toggle-pass {

            position: absolute;

            left: 18px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #94a3b8;

            cursor: pointer;

            transition: 0.3s;

        }


        .field .toggle-pass:hover {

            color: var(--accent);

        }


        .field input {

            width: 100%;

            padding:
                18px 55px 18px 45px;

            border-radius: 20px;

            border:
                2px solid transparent;

            background: var(--input);

            color: var(--text);

            font-family: 'Cairo';

            outline: none;

            transition: 0.3s;

            font-size: 16px;

        }


        .field input:focus {

            border-color:
                var(--primary);

        }


        /* =====================================================
           زر الدخول
        ===================================================== */

        .login-btn {

            width: 100%;

            padding: 18px;

            border: none;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #4f46e5
                );

            color: white;

            font-weight: 900;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 10px 25px
                rgba(79, 70, 229, 0.4);

        }


        .login-btn:hover {

            transform:
                translateY(-2px);

        }


        /* =====================================================
           زر الاختبارات
        ===================================================== */

        .exams-btn {

            display: block;

            width: 100%;

            padding: 16px;

            margin-top: 15px;

            border: none;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #f59e0b,
                    #d97706
                );

            color: white;

            font-family: 'Cairo';

            font-weight: 900;

            font-size: 17px;

            cursor: pointer;

            text-decoration: none;

            transition: 0.3s;

            box-shadow:
                0 10px 25px
                rgba(217,119,6,0.3);

        }


        .exams-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 14px 30px
                rgba(217,119,6,0.4);

        }


        /* =====================================================
           Error
        ===================================================== */

        .error-msg {

            background:
                rgba(239,68,68,0.1);

            color: var(--danger);

            padding: 15px;

            border-radius: 15px;

            margin-top: 20px;

            display: none;

            border:
                1px solid var(--danger);

            font-size: 14px;

            font-weight: bold;

        }


        /* =====================================================
           WhatsApp
        ===================================================== */

        .support-btn {

            display: none;

            margin-top: 15px;

            background: #128c7e;

            color: white;

            text-decoration: none;

            padding: 12px;

            border-radius: 15px;

            font-weight: 700;

            transition: 0.3s;

        }


        .support-btn:hover {

            background: #075e54;

            transform:
                scale(1.02);

        }


        /* =====================================================
           Loader
        ===================================================== */

        #loader {

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.8);

            display: none;

            justify-content: center;

            align-items: center;

            z-index: 11000;

        }


        .spinner {

            width: 50px;

            height: 50px;

            border:
                5px solid
                rgba(255,255,255,0.1);

            border-top-color:
                var(--accent);

            border-radius: 50%;

            animation:
                rot 1s linear infinite;

        }


        @keyframes rot {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =====================================================
           Mobile
        ===================================================== */

        @media (max-width: 600px) {

            .login-card {

                padding:
                    40px 25px;

                border-radius: 30px;

            }

            .magic-scale-large {

                font-size: 110px;

            }

            .calligraphy-text {

                font-size: 27px;

            }

<script>


/* =========================================================
   Firebase Configuration
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws",

    authDomain:
        "zomaapp-744fc.firebaseapp.com",

    projectId:
        "zomaapp-744fc"

};


firebase.initializeApp(firebaseConfig);


const db =
    firebase.firestore();


const auth =
    firebase.auth();



/* =========================================================
   Toggle Password
========================================================= */

function togglePass() {

    const p =
        document.getElementById('pass');

    const icon =
        document.querySelector('.toggle-pass');


    if (p.type === "password") {

        p.type = "text";

        icon.classList.replace(
            'fa-eye',
            'fa-eye-slash'
        );

    } else {

        p.type = "password";

        icon.classList.replace(
            'fa-eye-slash',
            'fa-eye'
        );

    }

}



/* =========================================================
   Theme
========================================================= */

function toggleTheme() {

    document.body.classList.toggle(
        'light-mode'
    );


    const isLight =
        document.body.classList.contains(
            'light-mode'
        );


    localStorage.setItem(
        'theme',
        isLight
            ? 'light'
            : 'dark'
    );


    document.getElementById(
        'themeIcon'
    ).className =
        isLight
            ? 'fas fa-sun'
            : 'fas fa-moon';

}


if (
    localStorage.getItem('theme')
    === 'light'
) {

    toggleTheme();

}



/* =========================================================
   إظهار واجهة الدخول
========================================================= */

function showLoginInterface() {

    const overlay =
        document.getElementById(
            'magicOverlay'
        );


    const card =
        document.getElementById(
            'loginCard'
        );


    overlay.style.opacity = '0';


    setTimeout(() => {

        overlay.style.display =
            'none';


        card.style.display =
            'block';


        setTimeout(() => {

            card.style.opacity =
                '1';


            card.style.transform =
                'translateY(0)';

        }, 50);

    }, 1000);

}



/* =========================================================
   البحث عن مستخدم في Firestore
========================================================= */

async function findFirestoreUser(
    loginValue
) {

    let snap;


    /*
     * البحث بالإيميل
     */

    if (loginValue.includes('@')) {

        snap =
            await db.collection("users")
            .where(
                "email",
                "==",
                loginValue
            )
            .limit(1)
            .get();


        if (!snap.empty) {

            return snap.docs[0];

        }

    }


    /*
     * البحث بالـ username
     */

    snap =
        await db.collection("users")
        .where(
            "username",
            "==",
            loginValue
        )
        .limit(1)
        .get();


    if (!snap.empty) {

        return snap.docs[0];

    }


    /*
     * دعم userName
     */

    snap =
        await db.collection("users")
        .where(
            "userName",
            "==",
            loginValue
        )
        .limit(1)
        .get();


    if (!snap.empty) {

        return snap.docs[0];

    }


    return null;

}



/* =========================================================
   فحص هل المستخدم موجود في Firebase Authentication
========================================================= */

async function checkFirebaseAuthentication(
    email,
    password
) {

    try {

        /*
         * محاولة تسجيل الدخول في Firebase Authentication.
         *
         * إذا نجحت:
         * الحساب موجود في Authentication.
         */

        const credential =
            await auth.signInWithEmailAndPassword(
                email,
                password
            );


        if (
            credential &&
            credential.user
        ) {

            return {

                exists: true,

                authenticated: true,

                user:
                    credential.user

            };

        }


        return {

            exists: false,

            authenticated: false,

            user: null

        };


    } catch (error) {


        /*
         * هذه الأخطاء تعني أن الحساب موجود
         * ولكن بيانات الدخول غير صحيحة.
         *
         * في هذه الحالة لا نعتبره طالباً
         * تلقائياً، لأن الحساب موجود في Authentication.
         */

        if (
            error.code ===
            'auth/wrong-password' ||

            error.code ===
            'auth/invalid-credential' ||

            error.code ===
            'auth/user-disabled' ||

            error.code ===
            'auth/too-many-requests'
        ) {

            return {

                exists: true,

                authenticated: false,

                error: error

            };

        }


        /*
         * user-not-found
         *
         * معناها أن الإيميل غير موجود
         * في Firebase Authentication.
         *
         * وبالتالي يمكن أن يكون طالباً
         * موجوداً في Firestore فقط.
         */

        if (
            error.code ===
            'auth/user-not-found'
        ) {

            return {

                exists: false,

                authenticated: false,

                user: null

            };

        }


        /*
         * invalid-email
         */

        if (
            error.code ===
            'auth/invalid-email'
        ) {

            return {

                exists: false,

                authenticated: false,

                error: error

            };

        }


        /*
         * أي خطأ آخر
         */

        return {

            exists: false,

            authenticated: false,

            error: error

        };

    }

}



/* =========================================================
   تسجيل الدخول الرئيسي
========================================================= */

async function handleLogin() {


    let loginValue =
        document.getElementById(
            'email'
        )
        .value
        .trim();


    const pass =
        document.getElementById(
            'pass'
        )
        .value
        .trim();


    const errBox =
        document.getElementById(
            'errorArea'
        );


    const supBtn =
        document.getElementById(
            'supportBtn'
        );


    errBox.style.display =
        'none';


    supBtn.style.display =
        'none';


    if (
        !loginValue ||
        !pass
    ) {

        return showError(
            "برجاء إدخال البيانات كاملة."
        );

    }


    showLoader(true);


    try {


        /* =====================================================
           1. البحث عن المستخدم في Firestore
        ===================================================== */

        const userDoc =
            await findFirestoreUser(
                loginValue
            );


        /*
         * لو غير موجود في Firestore
         * نرفض الدخول مباشرة.
         */

        if (!userDoc) {

            showLoader(false);

            return showError(
                "هذا الحساب غير موجود في قاعدة بيانات المنصة."
            );

        }


        const userData =
            userDoc.data();


        const authEmail =
            userData.email ||
            (
                loginValue.includes('@')
                    ? loginValue
                    : ''
            );


        if (!authEmail) {

            showLoader(false);

            return showError(
                "لا يوجد إيميل مرتبط بهذا الحساب."
            );

        }


        /* =====================================================
           2. فحص حالة الحساب
        ===================================================== */

        if (
            userData.status === 'inactive' ||
            userData.status === 'banned'
        ) {

            showLoader(false);


            const reason =
                userData.lockReason ||
                userData.banReason ||
                "تم تعطيل حسابك مؤقتاً.";


            showError(
                "🚫 عذراً: " + reason
            );


            supBtn.style.display =
                'block';


            const waMsg =
                `السلام عليكم مستشار حازم، واجهت مشكلة في الدخول.
السبب: ${reason}
المستخدم: ${authEmail}`;


            supBtn.href =
                `https://wa.me/201060234399?text=${encodeURIComponent(waMsg)}`;


            return;

        }



        /* =====================================================
           3. هل الحساب موجود في Authentication؟
        ===================================================== */

        const authResult =
            await checkFirebaseAuthentication(
                authEmail,
                pass
            );



        /* =====================================================
           الحالة الأولى:
           Firestore + Firebase Authentication
           = مدير / موظف
        ===================================================== */

        if (
            authResult.exists === true &&
            authResult.authenticated === true
        ) {


            const firebaseUser =
                authResult.user;


            /*
             * إنشاء Session Token
             */

            const newToken =
                "zoma_" +
                Math.random()
                .toString(36)
                .substring(2, 12);


            /*
             * تحديث بيانات المستخدم
             */

            await db
                .collection("users")
                .doc(userDoc.id)
                .update({

                    lastSessionToken:
                        newToken,

                    lastLogin:
                        firebase.firestore
                        .FieldValue
                        .serverTimestamp(),

                    uid:
                        firebaseUser.uid

                });


            /*
             * حفظ الجلسة
             */

            localStorage.setItem(
                "userEmail",
                firebaseUser.email
            );


            localStorage.setItem(
                "sessionToken",
                newToken
            );


            localStorage.setItem(
                "firebaseUID",
                firebaseUser.uid
            );


            /*
             * تحديد نوع الحساب
             */

            localStorage.setItem(
                "accountType",
                "admin"
            );


            /*
             * الانتقال إلى لوحة الإدارة
             */

            window.location.href =
                "admin2.html";


            return;

        }



        /* =====================================================
           الحالة الثانية:
           الحساب موجود في Authentication
           ولكن كلمة المرور خاطئة
        ===================================================== */

        if (
            authResult.exists === true &&
            authResult.authenticated === false
        ) {

            showLoader(false);


            if (
                authResult.error &&
                authResult.error.code ===
                'auth/user-disabled'
            ) {

                return showError(
                    "🚫 تم تعطيل هذا الحساب من Firebase Authentication."
                );

            }


            if (
                authResult.error &&
                authResult.error.code ===
                'auth/too-many-requests'
            ) {

                return showError(
                    "تم إجراء محاولات دخول كثيرة. حاول مرة أخرى بعد قليل."
                );

            }


            return showError(
                "كلمة المرور غير صحيحة."
            );

        }



        /* =====================================================
           الحالة الثالثة:
           Firestore فقط
           = طالب
        ===================================================== */

        if (
            authResult.exists === false
        ) {


            /*
             * الطالب موجود في Firestore
             * لكنه غير موجود في Authentication.
             *
             * لذلك نتحقق من كلمة المرور الموجودة
             * في Firestore إذا كانت محفوظة.
             */


            let studentPassword =
                userData.password;


            /*
             * دعم بعض أسماء الحقول
             */

            if (
                studentPassword === undefined
            ) {

                studentPassword =
                    userData.pass;

            }


            if (
                studentPassword === undefined
            ) {

                studentPassword =
                    userData.studentPassword;

            }


            /*
             * إذا كان هناك Password في Firestore
             * يجب مطابقته.
             */

            if (
                studentPassword !== undefined &&
                String(studentPassword) !== String(pass)
            ) {

                showLoader(false);

                return showError(
                    "كلمة المرور غير صحيحة."
                );

            }


            /*
             * حفظ بيانات الطالب
             */

            localStorage.setItem(
                "userEmail",
                authEmail
            );


            localStorage.setItem(
                "studentId",
                userDoc.id
            );


            localStorage.setItem(
                "accountType",
                "student"
            );


            /*
             * حفظ اسم المستخدم إن وجد
             */

            if (userData.username) {

                localStorage.setItem(
                    "username",
                    userData.username
                );

            }
            else if (userData.userName) {

                localStorage.setItem(
                    "username",
                    userData.userName
                );

            }


            /*
             * حفظ اسم الطالب
             */

            if (userData.name) {

                localStorage.setItem(
                    "studentName",
                    userData.name
                );

            }
            else if (userData.studentName) {

                localStorage.setItem(
                    "studentName",
                    userData.studentName
                );

            }


            /*
             * الدخول إلى صفحة الطلاب
             */

            window.location.href =
                "home.html";


            return;

        }


        /*
         * في حالة غير متوقعة
         */

        showLoader(false);

        return showError(
            "تعذر تحديد نوع الحساب."
        );


    }
    catch (e) {


        console.error(
            "Login Error:",
            e
        );


        showLoader(false);


        switch (e.code) {


            case 'auth/invalid-email':

                showError(
                    "صيغة الإيميل غير صحيحة."
                );

                break;


            case 'auth/wrong-password':

                showError(
                    "كلمة المرور غير صحيحة."
                );

                break;


            case 'auth/invalid-credential':

                showError(
                    "بيانات الدخول غير صحيحة."
                );

                break;


            case 'auth/user-disabled':

                showError(
                    "🚫 تم تعطيل هذا الحساب."
                );

                break;


            case 'auth/too-many-requests':

                showError(
                    "تم إجراء محاولات دخول كثيرة. حاول مرة أخرى بعد قليل."
                );

                break;


            case 'auth/network-request-failed':

                showError(
                    "تعذر الاتصال بالإنترنت."
                );

                break;


            default:

                showError(
                    "حدث خطأ أثناء تسجيل الدخول: " +
                    (
                        e.message ||
                        "خطأ غير معروف"
                    )
                );

                break;

        }

    }

}



/* =========================================================
   عرض رسالة الخطأ
========================================================= */

function showError(msg) {

    const err =
        document.getElementById(
            'errorArea'
        );


    err.innerText =
        msg;


    err.style.display =
        'block';

}



/* =========================================================
   Loader
========================================================= */

function showLoader(show) {

    document.getElementById(
        'loader'
    )
    .style
    .display =
        show
            ? 'flex'
            : 'none';

}



/* =========================================================
   فحص الجلسة عند تحميل الصفحة
========================================================= */

window.onload = async function() {


    /*
     * ننتظر قليلاً لعرض شاشة الدخول السحرية
     */

    setTimeout(async () => {


        try {


            /* =================================================
               أولاً:
               هل يوجد مستخدم Firebase Auth مسجل بالفعل؟
            ================================================= */

            const currentUser =
                auth.currentUser;


            if (currentUser) {


                /*
                 * البحث عنه في Firestore
                 */

                const snap =
                    await db
                    .collection("users")
                    .where(
                        "email",
                        "==",
                        currentUser.email
                    )
                    .limit(1)
                    .get();


                if (!snap.empty) {


                    const data =
                        snap.docs[0].data();


                    /*
                     * فحص الحالة
                     */

                    if (
                        data.status !== 'inactive' &&
                        data.status !== 'banned'
                    ) {


                        localStorage.setItem(
                            "accountType",
                            "admin"
                        );


                        /*
                         * الحساب موجود في
                         * Firestore + Authentication
                         */

                        window.location.href =
                            "admin2.html";


                        return;

                    }

                }

            }



            /* =================================================
               ثانياً:
               الجلسة القديمة
            ================================================= */

            const email =
                localStorage.getItem(
                    "userEmail"
                );


            const token =
                localStorage.getItem(
                    "sessionToken"
                );


            if (
                email &&
                token
            ) {


                const snap =
                    await db
                    .collection("users")
                    .where(
                        "email",
                        "==",
                        email
                    )
                    .limit(1)
                    .get();


                if (!snap.empty) {


                    const data =
                        snap.docs[0].data();


                    /*
                     * المدير
                     */

                    if (
                        data.lastSessionToken === token &&
                        data.status !== 'inactive' &&
                        data.status !== 'banned'
                    ) {


                        localStorage.setItem(
                            "accountType",
                            "admin"
                        );


                        window.location.href =
                            "admin2.html";


                        return;

                    }

                }

            }


        }
        catch (e) {

            console.log(
                "Silent login check failed:",
                e
            );

        }


        /*
         * لا يوجد دخول تلقائي
         */

        showLoginInterface();


    }, 2200);

};



/* =========================================================
   Firebase Auth State
========================================================= */

auth.onAuthStateChanged(
    function(user) {

        if (user) {

            console.log(
                "Firebase Authentication User:",
                user.email
            );

        }

    }
);

</script>
