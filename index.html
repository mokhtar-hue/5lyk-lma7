<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المستشار حازم سالم | VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #8b5cf6;
            --accent: #d946ef;
            --gold: #f59e0b;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --input: #334155;
            --success: #10b981;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b, #0f172a);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* اسم المنصة في الأعلى */
        .top-brand {
            position: absolute;
            top: 20px;
            text-align: center;
            width: 100%;
            z-index: 100;
        }
        .top-brand h1 {
            font-weight: 900;
            font-size: clamp(20px, 5vw, 32px);
            margin: 0;
            background: linear-gradient(to right, #fff, var(--gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }
        .top-brand p {
            color: var(--accent);
            font-weight: 700;
            margin-top: 5px;
            letter-spacing: 2px;
            font-size: 14px;
        }

        #loader {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center;
            z-index: 9999; backdrop-filter: blur(15px);
        }
        .spinner {
            width: 70px; height: 70px; border: 6px solid var(--input);
            border-top-color: var(--accent); border-radius: 50%;
            animation: rotate 0.8s infinite linear;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 0 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            animation: bounceIn 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .welcome-msg { font-size: 30px; font-weight: 900; margin-bottom: 10px; }
        .sub-msg { color: #94a3b8; margin-bottom: 30px; display: block; font-weight: 600; }

        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { display: block; margin: 0 10px 8px 0; font-weight: 700; color: var(--accent); }
        
        .field-box { position: relative; }
        input {
            width: 100%; padding: 16px 20px; border-radius: 20px; border: 2px solid transparent;
            background: var(--input); color: white; font-family: 'Cairo'; font-size: 16px;
            outline: none; transition: 0.4s; box-sizing: border-box;
        }
        input:focus { border-color: var(--accent); background: #1e293b; box-shadow: 0 0 20px rgba(217, 70, 239, 0.2); }

        .eye-btn {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; font-size: 20px; color: #64748b;
        }

        .login-btn {
            width: 100%; padding: 18px; border: none; border-radius: 22px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; font-weight: 900; font-size: 18px; cursor: pointer;
            transition: 0.4s; margin-top: 15px; box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
        }
        .login-btn:hover { transform: scale(1.03); box-shadow: 0 15px 30px rgba(217, 70, 239, 0.5); }

        /* شاشة النجاح المبهجة */
        .status-screen {
            position: fixed; inset: 0; background: radial-gradient(circle at center, #1e1b4b, #0f172a);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; transition: 0.5s; text-align: center;
        }
        .status-screen.active { opacity: 1; display: flex; }

        .success-icon {
            font-size: 80px; margin-bottom: 10px;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .joyful-greeting {
            font-size: clamp(24px, 5vw, 40px);
            font-weight: 900;
            color: var(--gold);
            margin-top: 10px;
            min-height: 60px;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }

        .wisdom-box {
            margin-top: 30px; font-size: 20px; color: var(--accent); font-weight: 700;
            max-width: 80%; text-align: center; opacity: 0;
            animation: fadeInUP 1s ease 1.5s forwards;
        }

        .gear-btn {
            position: fixed; bottom: 25px; left: 25px; width: 60px; height: 60px;
            background: linear-gradient(45deg, #334155, #1e293b);
            border-radius: 50%; border: 2px solid var(--accent);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-size: 28px; box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* رسالة الحظر */
        .ban-box { background: rgba(69, 10, 10, 0.8); border: 2px solid #ef4444; padding: 20px; border-radius: 20px; color: #fecaca; margin-top: 20px; font-weight: bold; }

        @keyframes rotate { to { transform: rotate(360deg); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.3); } 50% { opacity: 1; transform: scale(1.05); } 70% { transform: scale(0.9); } 100% { transform: scale(1); } }
        @keyframes popIn { 0% { transform: scale(0); } 80% { transform: scale(1.2); } 100% { transform: scale(1); } }
        @keyframes fadeInUP { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        
        .char { display: inline-block; animation: slideInChar 0.4s forwards; opacity: 0; transform: translateY(15px); }
        @keyframes slideInChar { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="top-brand">
        <h1>🌟 المستشار حازم سالم 🌟</h1>
        <p>نظام الوصول الذكي للمتفوقين 🚀</p>
    </div>

    <div id="loader"><div class="spinner"></div></div>
    
    <div id="statusScreen" class="status-screen">
        <div id="statusIcon" class="success-icon"></div>
        <div id="statusTitle" style="font-size: 24px; font-weight: 700; color: #f1f5f9;"></div>
        <div id="nameArea" class="joyful-greeting"></div>
        <div id="wisdomBox" class="wisdom-box"></div>
        <button id="backBtn" class="login-btn" style="width: 200px; display: none; margin-top: 30px;" onclick="location.reload()">↩️ حاول مرة أخرى</button>
    </div>

    <div class="login-card" id="loginCard">
        <div class="welcome-msg" id="greet">🔥 أهلاً يا بطل</div>
        <span class="sub-msg">جاهز لرحلة النجاح اليوم؟ 📚</span>
        
        <div class="input-group">
            <label>📧 بريدك الإلكتروني</label>
            <div class="field-box"><input type="email" id="email" placeholder="أدخل إيميلك هنا..." dir="ltr"></div>
        </div>
        
        <div class="input-group">
            <label>🔑 كلمة المرور</label>
            <div class="field-box">
                <input type="password" id="pass" placeholder="••••••••" dir="ltr">
                <button class="eye-btn" onclick="togglePass()">👁️</button>
            </div>
        </div>
        
        <button class="login-btn" onclick="handleLogin()">🚀 انطلاق نحو المنصة</button>
    </div>

    <button class="gear-btn" onclick="alert('📞 تواصل مع الدعم الفني: 01060234399')">⚙️</button>

<script>
    // إعدادات Firebase
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const wisdoms = [
        "🎉 جهز كشكولك، الحصة هتبدأ يا بطل!",
        "💪 خطوة جديدة نحو حلمك الكبير.",
        "🏆 نحن نثق في قدرتك على التميز والتفوق.",
        "🚀 انطلق بقوة، المستقبل بانتظارك."
    ];

    // تحية متغيرة حسب الوقت
    const hr = new Date().getHours();
    document.getElementById('greet').innerText = hr < 12 ? "🌅 صباح التفوق" : "🌃 مساء الهمة";

    function togglePass() {
        const p = document.getElementById('pass');
        p.type = p.type === 'password' ? 'text' : 'password';
    }

    async function handleLogin() {
        const mail = document.getElementById('email').value.trim();
        const psw = document.getElementById('pass').value.trim();
        
        if(!mail || !psw) { alert("أدخل بياناتك كاملة يا دكتور! 🩺"); return; }

        document.getElementById('loader').style.display = 'flex';

        try {
            const snap = await db.collection("users").where("email", "==", mail).get();
            
            if (snap.empty) throw new Error("هذا الإيميل غير مسجل لدينا! 🧐");

            let uData = snap.docs[0].data();
            if (uData.password !== psw) throw new Error("كلمة المرور غير صحيحة يا بطل! ❌");

            if (uData.status !== "active") {
                showFailure(uData.lockReason || "عذراً، هذا الحساب موقوف من الإدارة.");
                return;
            }

            // *** هنا كان الخطأ: تم إضافة سطور الحفظ في الذاكرة ***
            localStorage.setItem("userName", uData.name || "طالب مميز");
            localStorage.setItem("userEmail", uData.email || mail);

            // تشغيل شاشة النجاح المبهجة
            showSuccess(uData.name || "يا بطل");
            
            // التوجيه للصفحة الرئيسية بعد 3.5 ثوانٍ
            setTimeout(() => { 
                window.location.replace("home.html"); 
            }, 3500);

        } catch (e) {
            document.getElementById('loader').style.display = 'none';
            alert(e.message);
        }
    }

    function showSuccess(name) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('loginCard').style.display = 'none';
        const screen = document.getElementById('statusScreen');
        screen.classList.add('active');

        document.getElementById('statusIcon').innerText = "✨";
        document.getElementById('statusTitle').innerText = "تم تسجيل الدخول بنجاح";
        
        // تجهيز الجملة المبهجة
        const fullGreeting = "مرحباً بك يا " + name + " 🌟";
        const nameArea = document.getElementById('nameArea');
        let i = 0;
        
        // أنيميشن الكتابة المظبوط للجملة كاملة
        const interval = setInterval(() => {
            if (i < fullGreeting.length) {
                const s = document.createElement('span');
                s.innerText = fullGreeting[i] === " " ? "\u00A0" : fullGreeting[i]; // حفظ المسافات
                s.className = 'char';
                nameArea.appendChild(s);
                i++;
            } else {
                clearInterval(interval);
                document.getElementById('wisdomBox').innerText = wisdoms[Math.floor(Math.random()*wisdoms.length)];
            }
        }, 80); // سرعة الكتابة
    }

    function showFailure(msg) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('loginCard').style.display = 'none';
        const screen = document.getElementById('statusScreen');
        screen.classList.add('active');

        document.getElementById('statusIcon').innerText = "🛑";
        document.getElementById('statusTitle').innerHTML = `<div class="ban-box">دخول مرفوض!<br><small style="font-weight:normal; margin-top:10px; display:block;">${msg}</small></div>`;
        document.getElementById('backBtn').style.display = 'block';
    }
</script>
</body>
</html>
