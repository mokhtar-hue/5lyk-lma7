/* =========================================================
   Toggle Password
========================================================= */

function togglePass() {

    const p =
        document.getElementById(
            'pass'
        );


    const icon =
        document.querySelector(
            '.toggle-pass'
        );


    if (
        p.type === "password"
    ) {

        p.type = "text";


        icon.classList.replace(
            'fa-eye',
            'fa-eye-slash'
        );

    }

    else {

        p.type = "password";


        icon.classList.replace(
            'fa-eye-slash',
            'fa-eye'
        );

    }

}



/* =========================================================

========================================================= */

function toggleTheme() {

    document.body.classList.toggle(
        'light-mode'

    const isLight =

        );


    localStorage.setItem(

    document.getElementById(

/* =========================================================
   البحث عن المستخدم في Firestore
========================================================= */

async function findFirestoreUser(
    loginValue
) {

    let snap;


    /*
     * البحث باستخدام الإيميل
     */

    if (
        loginValue.includes('@')
    ) {

        snap =
            await db
            .collection("users")
            .where(
                "email",
                "==",
                loginValue
            )
            .limit(1)
            .get();


        if (
            !snap.empty
        ) {

            return snap.docs[0];

        }

    }


    /*
     * البحث باستخدام username
     */

    snap =
        await db
        .collection("users")
        .where(
            "username",
            "==",
            loginValue
        )
        .limit(1)
        .get();


    if (
        !snap.empty
    ) {

        return snap.docs[0];

    }


    /*
     * دعم userName
     */

    snap =
        await db
        .collection("users")
        .where(
            "userName",
            "==",
            loginValue
        )
        .limit(1)
        .get();


    if (
        !snap.empty
    ) {

        return snap.docs[0];

    }


    return null;

}



/* =========================================================
   التحقق من Firebase Authentication
========================================================= */

async function checkFirebaseAuthentication(
    email,
    password
) {

    try {

        /*
         * محاولة تسجيل الدخول.
         *
         * نجاح العملية يعني أن الحساب
         * موجود في Firebase Authentication.
         */

        const credential =
            await auth
            .signInWithEmailAndPassword(
                email,
                password
            );


        if (
            credential &&
            credential.user
        ) {

            return {

                exists: true,

                authenticated: true,

                user:
                    credential.user,

                error: null

            };

        }


        return {

            exists: false,

            authenticated: false,

            user: null,

            error: null

        };

    }

    catch (error) {


        /*
         * الحساب موجود في Authentication
         * لكن كلمة المرور خاطئة.
         */

        if (
            error.code ===
            'auth/wrong-password'
        ) {

            return {

                exists: true,

                authenticated: false,

                user: null,

                error: error

            };

        }


        /*
         * Firebase الجديد قد يرجع
         * invalid-credential بدلاً من
         * wrong-password.
         */

        if (
            error.code ===
            'auth/invalid-credential'
        ) {

            return {

                exists: true,

                authenticated: false,

                user: null,

                error: error

            };

        }


        /*
         * الحساب موجود ولكن تم تعطيله.
         */

        if (
            error.code ===
            'auth/user-disabled'
        ) {

            return {

                exists: true,

                authenticated: false,

                user: null,

                error: error

            };

        }


        /*
         * محاولات كثيرة.
         */

        if (
            error.code ===
            'auth/too-many-requests'
        ) {

            return {

                exists: true,

                authenticated: false,

                user: null,

                error: error

            };

        }


        /*
         * الحساب غير موجود في Authentication.
         *
         * هنا بالضبط نعتبره مرشحاً ليكون طالباً
         * موجوداً في Firestore فقط.
         */

        if (
            error.code ===
            'auth/user-not-found'
        ) {

            return {

                exists: false,

                authenticated: false,

                user: null,

                error: error

            };

        }


        /*
         * إيميل غير صحيح.
         */

        if (
            error.code ===
            'auth/invalid-email'
        ) {

            return {

                exists: false,

                authenticated: false,

                user: null,

                error: error

            };

        }


        /*
         * أي خطأ آخر.
         */

        return {

            exists: false,

            authenticated: false,

            user: null,

            error: error

        };

    }

}



/* =========================================================
   حفظ بيانات الإدارة
========================================================= */

async function saveAdminSession(
    userDoc,
    firebaseUser
) {

    const newToken =
        "zoma_" +
        Math.random()
        .toString(36)
        .substring(2, 12);


    /*
     * تحديث بيانات الإدارة في Firestore
     */

    await db
        .collection("users")
        .doc(userDoc.id)
        .update({

            lastSessionToken:
                newToken,

            lastLogin:
                firebase.firestore
                .FieldValue
                .serverTimestamp(),

            uid:
                firebaseUser.uid

        });


    /*
     * حفظ الجلسة محلياً
     */

    localStorage.setItem(
        "userEmail",
        firebaseUser.email
    );


    localStorage.setItem(
        "sessionToken",
        newToken
    );


    localStorage.setItem(
        "firebaseUID",
        firebaseUser.uid
    );


    localStorage.setItem(
        "accountType",
        "admin"
    );


    /*
     * حفظ اسم المستخدم إن وجد
     */

    const data =
        userDoc.data();


    if (
        data.username
    ) {

        localStorage.setItem(
            "username",
            data.username
        );

    }
    else if (
        data.userName
    ) {

        localStorage.setItem(
            "username",
            data.userName
        );

    }


    /*
     * حفظ اسم المدير إن وجد
     */

    if (
        data.name
    ) {

        localStorage.setItem(
            "adminName",
            data.name
        );

    }


}

/* =========================================================
   التحقق من كلمة مرور الطالب
========================================================= */

function checkStudentPassword(
    userData,
    enteredPassword
) {

    /*
     * دعم password
     */

    let storedPassword =
        userData.password;


    /*
     * دعم pass
     */

    if (
        storedPassword === undefined
    ) {

        storedPassword =
            userData.pass;

    }


    /*
     * دعم studentPassword
     */

    if (
        storedPassword === undefined
    ) {

        storedPassword =
            userData.studentPassword;

    }


    /*
     * إذا لم توجد كلمة مرور في Firestore
     *
     * في هذه الحالة نسمح بالدخول
     * لأن الحساب Firestore فقط.
     */

    if (
        storedPassword === undefined ||
        storedPassword === null
    ) {

        return true;

    }


    /*
     * مقارنة كلمة المرور
     */

    return (
        String(storedPassword) ===
        String(enteredPassword)
    );

}

    showLoader(true);

        /* =====================================================
           الخطوة 1
           البحث عن المستخدم في Firestore
        ===================================================== */

        const userDoc =
            await findFirestoreUser(
                loginValue
            );


        /*
         * غير موجود في Firestore
         */

        if (
            !userDoc
        ) {

            showLoader(false);

            return showError(
                "هذا الحساب غير موجود في قاعدة بيانات المنصة."
            );

        }


        const userData =
            userDoc.data();


        /*
         * الإيميل
         */

        const authEmail =
            userData.email ||
            (
                loginValue.includes('@')
                    ? loginValue
                    : ''
            );


        /*
         * لازم يكون هناك إيميل
         * لفحص Firebase Authentication.
         */

        if (
            !authEmail
        ) {

            /*
             * لو الحساب طالب فقط ولا يوجد إيميل
             * نسمح له بالدخول باستخدام بيانات Firestore.
             */

            if (
                checkStudentPassword(
                    userData,
                    pass
                )
            ) {

                saveStudentSession(
                    userDoc
                );


                showLoader(false);


                window.location.href =
                    "home.html";


                return;

            }


            showLoader(false);


            return showError(
                "كلمة المرور غير صحيحة."
            );

        }


        /* =====================================================
           الخطوة 2
           فحص حالة الحساب
        ===================================================== */

        if (
            userData.status === 'inactive' ||
            userData.status === 'banned'
        ) {

            showLoader(false);


            const reason =
                userData.lockReason ||
                userData.banReason ||
                "تم تعطيل حسابك مؤقتاً.";


            showError(
                "🚫 عذراً: " + reason
            );


            /*
             * زر الدعم
             */

            supBtn.style.display =
                'block';


            const waMsg =
                `السلام عليكم مستشار حازم، واجهت مشكلة في الدخول.
السبب: ${reason}
المستخدم: ${authEmail}`;


            supBtn.href =
                `https://wa.me/201060234399?text=${encodeURIComponent(waMsg)}`;


            return;

        }



        /* =====================================================
           الخطوة 3
           فحص Firebase Authentication
        ===================================================== */

        const authResult =
            await checkFirebaseAuthentication(
                authEmail,
                pass
            );



        /* =====================================================
           الحالة A
           Firestore + Authentication
           = إدارة
        ===================================================== */

        if (
            authResult.exists === true &&
            authResult.authenticated === true
        ) {


            const firebaseUser =
                authResult.user;


            /*
             * حفظ جلسة الإدارة
             */

            await saveAdminSession(
                userDoc,
                firebaseUser
            );


            showLoader(false);


            /*
             * الدخول إلى لوحة الإدارة
             */

            window.location.href =
                "admin1.html";


            return;

        }



        /* =====================================================
           الحالة B
           موجود في Authentication
           ولكن كلمة المرور خطأ
        ===================================================== */

        if (
            authResult.exists === true &&
            authResult.authenticated === false
        ) {

            showLoader(false);


            /*
             * حساب Authentication معطل
             */

            if (
                authResult.error &&
                authResult.error.code ===
                'auth/user-disabled'
            ) {

                return showError(
                    "🚫 تم تعطيل هذا الحساب من Firebase Authentication."
                );

            }


            /*
             * محاولات كثيرة
             */

            if (
                authResult.error &&
                authResult.error.code ===
                'auth/too-many-requests'
            ) {

                return showError(
                    "تم إجراء محاولات دخول كثيرة. حاول مرة أخرى بعد قليل."
                );

            }


            /*
             * كلمة مرور خاطئة
             */

            return showError(
                "كلمة المرور غير صحيحة."
            );

        }



        /* =====================================================
           الحالة C
           Firestore فقط
           = طالب
        ===================================================== */

        if (
            authResult.exists === false
        ) {


            /*
             * الحساب غير موجود في Authentication
             * إذن هو طالب Firestore فقط.
             */


            const passwordCorrect =
                checkStudentPassword(
                    userData,
                    pass
                );


            /*
             * كلمة المرور خاطئة
             */

            if (
                !passwordCorrect
            ) {

                showLoader(false);


                return showError(
                    "كلمة المرور غير صحيحة."
                );

            }


            /*
             * حفظ جلسة الطالب
             */

            saveStudentSession(
                userDoc
            );


            showLoader(false);


            /*
             * الدخول إلى home.html
             */

            window.location.href =
                "home.html";


            return;

        }



        /* =====================================================
           حالة غير معروفة
        ===================================================== */

        showLoader(false);


        return showError(
            "تعذر تحديد نوع الحساب."
        );


    }
    catch (e) {


        console.error(
            "Firebase Login Error:",
            e
        );


        showLoader(false);


        /*
         * رسائل Firebase
         */

        switch (
            e.code
        ) {


            case 'auth/invalid-email':

                showError(
                    "صيغة الإيميل غير صحيحة."
                );

                break;


            case 'auth/wrong-password':

                showError(
                    "كلمة المرور غير صحيحة."
                );

                break;


            case 'auth/invalid-credential':

                showError(
                    "بيانات الدخول غير صحيحة."
                );

                break;


            case 'auth/user-disabled':

                showError(
                    "🚫 تم تعطيل هذا الحساب."
                );

                break;


            case 'auth/too-many-requests':

                showError(
                    "تم إجراء محاولات دخول كثيرة. حاول مرة أخرى بعد قليل."
                );

                break;


            case 'auth/network-request-failed':

                showError(
                    "تعذر الاتصال بالإنترنت. تأكد من الاتصال وحاول مرة أخرى."
                );

                break;


            case 'permission-denied':

                showError(
                    "ليس لديك صلاحية للوصول إلى بيانات المستخدم."
                );

                break;


            default:

                showError(
                    "حدث خطأ أثناء تسجيل الدخول: " +
                    (
                        e.message ||
                        "خطأ غير معروف."
                    )
                );

                break;

        }

    }

}



/* =========================================================
   عرض رسالة الخطأ
========================================================= */

function showError(
    msg
) {

    const err =
        document.getElementById(
            'errorArea'
        );


    err.innerText =
        msg;


    err.style.display =
        'block';

}



/* =========================================================
   Loader
========================================================= */

function showLoader(
    show
) {

    document.getElementById(
        'loader'
    )
    .style
    .display =
        show
            ? 'flex'
            : 'none';

}



/* =========================================================
   فحص الجلسة القديمة
========================================================= */

async function checkOldAdminSession() {

    const email =
        localStorage.getItem(
            "userEmail"
        );


    const token =
        localStorage.getItem(
            "sessionToken"
        );


    /*
     * لا توجد جلسة
     */

    if (
        !email ||
        !token
    ) {

        return false;

    }


    try {


        const snap =
            await db
            .collection("users")
            .where(
                "email",
                "==",
                email
            )
            .limit(1)
            .get();


        if (
            snap.empty
        ) {

            return false;

        }


        const doc =
            snap.docs[0];


        const data =
            doc.data();


        /*
         * الحساب معطل
         */

        if (
            data.status === 'inactive' ||
            data.status === 'banned'
        ) {

            return false;

        }


        /*
         * التحقق من Session Token
         */

        if (
            data.lastSessionToken !==
            token
        ) {

            return false;

        }


        /*
         * مهم:
         *
         * الجلسة القديمة تعتبر للإدارة فقط
         * لأن sessionToken يتم إنشاؤه عند
         * تسجيل دخول Firebase Authentication.
         */

        localStorage.setItem(
            "accountType",
            "admin"
        );


        return true;

    }
    catch (error) {

        console.error(
            "Old session error:",
            error
        );


        return false;

    }

}



/* =========================================================
   التحقق من جلسة Firebase الحالية
========================================================= */

async function checkCurrentFirebaseUser() {

    const currentUser =
        auth.currentUser;


    /*
     * لا يوجد Firebase User
     */

    if (
        !currentUser
    ) {

        return false;

    }


    try {


        /*
         * البحث عن المستخدم في Firestore
         */

        const snap =
            await db
            .collection("users")
            .where(
                "email",
                "==",
                currentUser.email
            )
            .limit(1)
            .get();


        /*
         * Firebase فقط بدون Firestore
         *
         * لا نسمح له بالدخول.
         */

        if (
            snap.empty
        ) {

            /*
             * تسجيل الخروج حتى لا يظل
             * الحساب مفتوحاً في Firebase.
             */

            await auth.signOut();


            return false;

        }


        const doc =
            snap.docs[0];


        const data =
            doc.data();


        /*
         * الحساب معطل
         */

        if (
            data.status === 'inactive' ||
            data.status === 'banned'
        ) {

            await auth.signOut();


            return false;

        }


        /*
         * الحساب موجود في Firestore
         * وFirebase Authentication
         *
         * إذن إدارة.
         */

        localStorage.setItem(
            "userEmail",
            currentUser.email
        );


        localStorage.setItem(
            "firebaseUID",
            currentUser.uid
        );


        localStorage.setItem(
            "accountType",
            "admin"
        );


        /*
         * الدخول إلى admin1
         */

        window.location.href =
            "admin1.html";


        return true;

    }
    catch (error) {

        console.error(
            "Current Firebase user check failed:",
            error
        );


        return false;

    }

}



/* =========================================================
   تشغيل الصفحة
========================================================= */

window.onload = async function() {


    /*
     * وقت شاشة البداية
     */

    setTimeout(
        async function() {


            try {


                /* =================================================
                   1
                   فحص Firebase Authentication الحالي
                ================================================= */

                const firebaseRedirected =
                    await checkCurrentFirebaseUser();


                if (
                    firebaseRedirected
                ) {

                    return;

                }


                /* =================================================
                   2
                   فحص Session Token القديم
                ================================================= */

                const oldSession =
                    await checkOldAdminSession();


                if (
                    oldSession
                ) {

                    window.location.href =
                        "admin1.html";


                    return;

                }

            }
            catch (error) {

                console.error(
                    "Automatic login check failed:",
                    error
                );

            }


            /*
             * لا يوجد دخول تلقائي
             * إظهار صفحة تسجيل الدخول.
             */

            showLoginInterface();


        },
        2200
    );

};
