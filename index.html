<script>


/* =========================================================
   Firebase Configuration
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws",

    authDomain:
        "zomaapp-744fc.firebaseapp.com",

    projectId:
        "zomaapp-744fc"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();


const auth =
    firebase.auth();



/* =========================================================
   توليد Session Token قوي
========================================================= */

function generateSessionToken() {

    try {

        if (
            window.crypto &&
            window.crypto.getRandomValues
        ) {

            const array =
                new Uint32Array(8);

            window.crypto.getRandomValues(array);

            return (
                "zoma_" +
                Array.from(array)
                    .map(
                        n =>
                            n.toString(36)
                    )
                    .join("") +
                "_" +
                Date.now().toString(36)
            );

        }

    }

    catch (e) {

        console.warn(
            "Crypto token generation failed",
            e
        );

    }


    return (
        "zoma_" +
        Math.random()
            .toString(36)
            .substring(2, 15) +
        Math.random()
            .toString(36)
            .substring(2, 15) +
        "_" +
        Date.now()
    );

}



/* =========================================================
   Toggle Password
========================================================= */

function togglePass() {

    const p =
        document.getElementById(
            'pass'
        );


    const icon =
        document.querySelector(
            '.toggle-pass'
        );


    if (
        p.type === "password"
    ) {

        p.type = "text";


        icon.classList.replace(
            'fa-eye',
            'fa-eye-slash'
        );

    }

    else {

        p.type = "password";


        icon.classList.replace(
            'fa-eye-slash',
            'fa-eye'
        );

    }

}



/* =========================================================
   Theme
========================================================= */

function toggleTheme() {

    document.body.classList.toggle(
        'light-mode'
    );


    const isLight =
        document.body.classList.contains(
            'light-mode'
        );


    localStorage.setItem(
        'theme',
        isLight
            ? 'light'
            : 'dark'
    );


    document.getElementById(
        'themeIcon'
    ).className =
        isLight
            ? 'fas fa-sun'
            : 'fas fa-moon';

}


if (
    localStorage.getItem(
        'theme'
    ) === 'light'
) {

    toggleTheme();

}



/* =========================================================
   إظهار واجهة الدخول
========================================================= */

function showLoginInterface() {

    const overlay =
        document.getElementById(
            'magicOverlay'
        );


    const card =
        document.getElementById(
            'loginCard'
        );


    overlay.style.opacity =
        '0';


    setTimeout(() => {

        overlay.style.display =
            'none';


        card.style.display =
            'block';


        setTimeout(() => {

            card.style.opacity =
                '1';


            card.style.transform =
                'translateY(0)';

        }, 50);

    }, 1000);

}



/* =========================================================
   تحديد نوع الحساب
========================================================= */

function getAccountRole(userData) {

    const role =
        String(
            userData.role || "student"
        )
        .trim()
        .toLowerCase();


    if (
        role === "admin" ||
        role === "administrator" ||
        role === "أدمن" ||
        role === "ادمن" ||
        role === "مدير"
    ) {

        return "admin";

    }


    return "student";

}



/* =========================================================
   التوجيه حسب نوع الحساب
========================================================= */

function redirectByRole(
    role
) {

    if (
        role === "admin"
    ) {

        localStorage.setItem(
            "accountType",
            "admin"
        );


        window.location.replace(
            "admin1.html"
        );


        return;

    }


    localStorage.setItem(
        "accountType",
        "student"
    );


    window.location.replace(
        "home.html"
    );

}



/* =========================================================
   البحث عن المستخدم في Firestore
========================================================= */

async function findFirestoreUser(
    loginValue
) {

    let snap;


    /*
     * البحث باستخدام الإيميل
     */

    if (
        loginValue.includes('@')
    ) {

        snap =
            await db
            .collection("users")
            .where(
                "email",
                "==",
                loginValue
            )
            .limit(1)
            .get();


        if (
            !snap.empty
        ) {

            return snap.docs[0];

        }

    }


    /*
     * البحث باستخدام username
     */

    snap =
        await db
        .collection("users")
        .where(
            "username",
            "==",
            loginValue
        )
        .limit(1)
        .get();


    if (
        !snap.empty
    ) {

        return snap.docs[0];

    }


    /*
     * دعم userName
     */

    snap =
        await db
        .collection("users")
        .where(
            "userName",
            "==",
            loginValue
        )
        .limit(1)
        .get();


    if (
        !snap.empty
    ) {

        return snap.docs[0];

    }


    return null;

}



/* =========================================================
   التحقق من Firebase Authentication
========================================================= */

async function checkFirebaseAuthentication(
    email,
    password
) {

    try {

        const credential =
            await auth
            .signInWithEmailAndPassword(
                email,
                password
            );


        if (
            credential &&
            credential.user
        ) {

            return {

                exists: true,

                authenticated: true,

                user:
                    credential.user,

                error: null

            };

        }


        return {

            exists: false,

            authenticated: false,

            user: null,

            error: null

        };

    }

    catch (error) {


        if (
            error.code ===
            'auth/wrong-password'
        ) {

            return {

                exists: true,

                authenticated: false,

                user: null,

                error: error

            };

        }


        if (
            error.code ===
            'auth/invalid-credential'
        ) {

            return {

                exists: true,

                authenticated: false,

                user: null,

                error: error

            };

        }


        if (
            error.code ===
            'auth/user-disabled'
        ) {

            return {

                exists: true,

                authenticated: false,

                user: null,

                error: error

            };

        }


        if (
            error.code ===
            'auth/too-many-requests'
        ) {

            return {

                exists: true,

                authenticated: false,

                user: null,

                error: error

            };

        }


        if (
            error.code ===
            'auth/user-not-found'
        ) {

            return {

                exists: false,

                authenticated: false,

                user: null,

                error: error

            };

        }


        if (
            error.code ===
            'auth/invalid-email'
        ) {

            return {

                exists: false,

                authenticated: false,

                user: null,

                error: error

            };

        }


        return {

            exists: false,

            authenticated: false,

            user: null,

            error: error

        };

    }

}



/* =========================================================
   حفظ جلسة الأدمن
========================================================= */

async function saveAdminSession(
    userDoc,
    firebaseUser
) {

    const userData =
        userDoc.data();


    const role =
        getAccountRole(
            userData
        );


    if (
        role !== "admin"
    ) {

        throw new Error(
            "هذا الحساب ليس حساب أدمن."
        );

    }


    const newToken =
        generateSessionToken();


    await db
        .collection("users")
        .doc(userDoc.id)
        .update({

            lastSessionToken:
                newToken,

            lastLogin:
                firebase.firestore
                .FieldValue
                .serverTimestamp(),

            uid:
                firebaseUser.uid

        });


    localStorage.setItem(
        "userEmail",
        firebaseUser.email
    );


    localStorage.setItem(
        "sessionToken",
        newToken
    );


    localStorage.setItem(
        "firebaseUID",
        firebaseUser.uid
    );


    localStorage.setItem(
        "accountType",
        "admin"
    );


    localStorage.setItem(
        "accountId",
        userDoc.id
    );


    if (
        userData.username
    ) {

        localStorage.setItem(
            "username",
            userData.username
        );

    }

    else if (
        userData.userName
    ) {

        localStorage.setItem(
            "username",
            userData.userName
        );

    }


    if (
        userData.name
    ) {

        localStorage.setItem(
            "adminName",
            userData.name
        );

    }

}



/* =========================================================
   حفظ جلسة الطالب
   تم تعديلها لتصبح Session حقيقية
========================================================= */

async function saveStudentSession(
    userDoc,
    firebaseUser = null
) {

    const userData =
        userDoc.data();


    /*
     * توليد Session Token جديد.
     *
     * بمجرد تسجيل الدخول من جهاز/متصفح آخر
     * يتم استبدال هذا التوكن في Firestore،
     * وبالتالي الجلسة القديمة تصبح غير صالحة.
     */

    const newToken =
        generateSessionToken();


    const updateData = {

        lastSessionToken:
            newToken,

        lastLogin:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

    };


    /*
     * حفظ UID إذا كان موجودًا
     */

    if (
        firebaseUser &&
        firebaseUser.uid
    ) {

        updateData.uid =
            firebaseUser.uid;

    }


    /*
     * تحديث جلسة الطالب في Firestore
     */

    await db
        .collection("users")
        .doc(userDoc.id)
        .update(
            updateData
        );


    /*
     * نوع الحساب
     */

    localStorage.setItem(
        "accountType",
        "student"
    );


    /*
     * ID الحساب
     */

    localStorage.setItem(
        "accountId",
        userDoc.id
    );


    /*
     * الإيميل
     */

    if (
        userData.email
    ) {

        localStorage.setItem(
            "userEmail",
            userData.email
        );

    }


    /*
     * Username
     */

    if (
        userData.username
    ) {

        localStorage.setItem(
            "username",
            userData.username
        );

    }

    else if (
        userData.userName
    ) {

        localStorage.setItem(
            "username",
            userData.userName
        );

    }


    /*
     * اسم الطالب
     */

    if (
        userData.name
    ) {

        localStorage.setItem(
            "studentName",
            userData.name
        );

    }

    else if (
        userData.studentName
    ) {

        localStorage.setItem(
            "studentName",
            userData.studentName
        );

    }


    /*
     * حفظ Session Token للطالب
     */

    localStorage.setItem(
        "sessionToken",
        newToken
    );


    /*
     * حفظ Firebase UID
     */

    if (
        firebaseUser &&
        firebaseUser.uid
    ) {

        localStorage.setItem(
            "firebaseUID",
            firebaseUser.uid
        );

    }


    /*
     * إزالة بيانات الأدمن القديمة
     */

    localStorage.removeItem(
        "adminName"
    );


    return newToken;

}



/* =========================================================
   التحقق من كلمة مرور الطالب
========================================================= */

function checkStudentPassword(
    userData,
    enteredPassword
) {

    let storedPassword =
        userData.password;


    if (
        storedPassword === undefined
    ) {

        storedPassword =
            userData.pass;

    }


    if (
        storedPassword === undefined
    ) {

        storedPassword =
            userData.studentPassword;

    }


    /*
     * إذا لم توجد كلمة مرور
     */

    if (
        storedPassword === undefined ||
        storedPassword === null
    ) {

        return true;

    }


    return (
        String(storedPassword) ===
        String(enteredPassword)
    );

}



/* =========================================================
   تسجيل الدخول الرئيسي
========================================================= */

async function handleLogin() {


    const loginValue =
        document
        .getElementById('email')
        .value
        .trim();


    const pass =
        document
        .getElementById('pass')
        .value
        .trim();


    const errBox =
        document
        .getElementById('errorArea');


    const supBtn =
        document
        .getElementById('supportBtn');


    errBox.style.display =
        'none';


    supBtn.style.display =
        'none';


    if (
        !loginValue ||
        !pass
    ) {

        return showError(
            "برجاء إدخال البيانات كاملة."
        );

    }


    showLoader(true);


    try {


        /* =====================================================
           1 - البحث في Firestore
        ===================================================== */

        const userDoc =
            await findFirestoreUser(
                loginValue
            );


        if (
            !userDoc
        ) {

            showLoader(false);

            return showError(
                "هذا الحساب غير موجود في قاعدة بيانات المنصة."
            );

        }


        const userData =
            userDoc.data();


        const role =
            getAccountRole(
                userData
            );


        console.log(
            "Account Role:",
            role
        );


        const authEmail =
            userData.email ||
            (
                loginValue.includes('@')
                    ? loginValue
                    : ''
            );


        /* =====================================================
           2 - حالة الحساب
        ===================================================== */

        if (
            userData.status === 'inactive' ||
            userData.status === 'banned'
        ) {

            showLoader(false);


            const reason =
                userData.lockReason ||
                userData.banReason ||
                "تم تعطيل حسابك مؤقتاً.";


            showError(
                "🚫 عذراً: " + reason
            );


            supBtn.style.display =
                'block';


            const waMsg =
                `السلام عليكم مستشار حازم، واجهت مشكلة في الدخول.
السبب: ${reason}
المستخدم: ${authEmail}`;


            supBtn.href =
                `https://wa.me/201060234399?text=${encodeURIComponent(waMsg)}`;


            return;

        }



        /* =====================================================
           3 - الطالب
        ===================================================== */

        if (
            role === "student"
        ) {


            let firebaseUser = null;


            /*
             * لو للطالب Firebase Authentication
             */

            if (
                authEmail
            ) {

                const authResult =
                    await checkFirebaseAuthentication(
                        authEmail,
                        pass
                    );


                /*
                 * دخول Firebase ناجح
                 */

                if (
                    authResult.authenticated === true
                ) {

                    firebaseUser =
                        authResult.user;

                }


                /*
                 * Firebase موجود وكلمة المرور خطأ
                 */

                else if (
                    authResult.exists === true &&
                    authResult.authenticated === false
                ) {

                    const passwordCorrect =
                        checkStudentPassword(
                            userData,
                            pass
                        );


                    if (
                        !passwordCorrect
                    ) {

                        showLoader(false);

                        return showError(
                            "كلمة المرور غير صحيحة."
                        );

                    }

                }

            }


            /*
             * لو لم يدخل عن طريق Firebase
             * نتحقق من كلمة Firestore
             */

            if (
                !firebaseUser
            ) {

                const passwordCorrect =
                    checkStudentPassword(
                        userData,
                        pass
                    );


                if (
                    !passwordCorrect
                ) {

                    showLoader(false);

                    return showError(
                        "كلمة المرور غير صحيحة."
                    );

                }

            }


            /*
             * إنشاء جلسة جديدة للطالب
             */

            await saveStudentSession(
                userDoc,
                firebaseUser
            );


            showLoader(false);


            /*
             * الطالب -> home.html
             */

            redirectByRole(
                "student"
            );


            return;

        }



        /* =====================================================
           4 - الأدمن
        ===================================================== */

        if (
            role === "admin"
        ) {


            if (
                !authEmail
            ) {

                showLoader(false);

                return showError(
                    "حساب الأدمن يحتاج إلى إيميل صالح في بيانات الحساب."
                );

            }


            const authResult =
                await checkFirebaseAuthentication(
                    authEmail,
                    pass
                );


            if (
                authResult.authenticated === true
            ) {

                const firebaseUser =
                    authResult.user;


                /*
                 * قراءة أحدث بيانات الحساب
                 */

                const freshDoc =
                    await db
                    .collection("users")
                    .doc(userDoc.id)
                    .get();


                if (
                    !freshDoc.exists
                ) {

                    try {

                        await auth.signOut();

                    }

                    catch(e) {

                        console.error(e);

                    }


                    showLoader(false);

                    return showError(
                        "لم يتم العثور على بيانات الحساب."
                    );

                }


                const freshData =
                    freshDoc.data();


                const freshRole =
                    getAccountRole(
                        freshData
                    );


                /*
                 * لو تغير إلى طالب
                 */

                if (
                    freshRole !== "admin"
                ) {

                    try {

                        await auth.signOut();

                    }

                    catch(e) {

                        console.error(e);

                    }


                    await saveStudentSession(
                        freshDoc,
                        null
                    );


                    showLoader(false);


                    redirectByRole(
                        "student"
                    );


                    return;

                }


                /*
                 * حفظ جلسة الأدمن
                 */

                await saveAdminSession(
                    freshDoc,
                    firebaseUser
                );


                showLoader(false);


                redirectByRole(
                    "admin"
                );


                return;

            }


            if (
                authResult.exists === true &&
                authResult.authenticated === false
            ) {

                showLoader(false);


                if (
                    authResult.error &&
                    authResult.error.code ===
                    'auth/user-disabled'
                ) {

                    return showError(
                        "🚫 تم تعطيل هذا الحساب من Firebase Authentication."
                    );

                }


                if (
                    authResult.error &&
                    authResult.error.code ===
                    'auth/too-many-requests'
                ) {

                    return showError(
                        "تم إجراء محاولات دخول كثيرة. حاول مرة أخرى بعد قليل."
                    );

                }


                return showError(
                    "بيانات دخول الأدمن غير صحيحة."
                );

            }


            showLoader(false);


            return showError(
                "حساب الأدمن غير مرتبط بـ Firebase Authentication."
            );

        }



        /* =====================================================
           5 - حماية إضافية
        ===================================================== */

        showLoader(false);


        return showError(
            "نوع الحساب غير معروف."
        );


    }

    catch (e) {


        console.error(
            "Firebase Login Error:",
            e
        );


        showLoader(false);


        switch (
            e.code
        ) {


            case 'auth/invalid-email':

                showError(
                    "صيغة الإيميل غير صحيحة."
                );

                break;


            case 'auth/wrong-password':

                showError(
                    "كلمة المرور غير صحيحة."
                );

                break;


            case 'auth/invalid-credential':

                showError(
                    "بيانات الدخول غير صحيحة."
                );

                break;


            case 'auth/user-disabled':

                showError(
                    "🚫 تم تعطيل هذا الحساب."
                );

                break;


            case 'auth/too-many-requests':

                showError(
                    "تم إجراء محاولات دخول كثيرة. حاول مرة أخرى بعد قليل."
                );

                break;


            case 'auth/network-request-failed':

                showError(
                    "تعذر الاتصال بالإنترنت. تأكد من الاتصال وحاول مرة أخرى."
                );

                break;


            case 'permission-denied':

                showError(
                    "ليس لديك صلاحية للوصول إلى بيانات المستخدم."
                );

                break;


            default:

                showError(
                    "حدث خطأ أثناء تسجيل الدخول: " +
                    (
                        e.message ||
                        "خطأ غير معروف."
                    )
                );

                break;

        }

    }

}



/* =========================================================
   فحص جلسة الطالب القديمة
========================================================= */

async function checkOldStudentSession() {

    const email =
        localStorage.getItem(
            "userEmail"
        );


    const accountId =
        localStorage.getItem(
            "accountId"
        );


    const token =
        localStorage.getItem(
            "sessionToken"
        );


    /*
     * لازم تكون البيانات الثلاثة موجودة
     */

    if (
        !accountId ||
        !token
    ) {

        return false;

    }


    try {


        /*
         * نستخدم ID مباشرة بدل البحث بالإيميل
         */

        const userDoc =
            await db
            .collection("users")
            .doc(accountId)
            .get();


        if (
            !userDoc.exists
        ) {

            clearStudentSession();

            return false;

        }


        const data =
            userDoc.data();


        /*
         * التأكد أن الحساب ما زال طالبًا
         */

        const role =
            getAccountRole(
                data
            );


        if (
            role !== "student"
        ) {

            clearStudentSession();

            return false;

        }


        /*
         * حالة الحساب
         */

        if (
            data.status === 'inactive' ||
            data.status === 'banned'
        ) {

            clearStudentSession();

            return false;

        }


        /*
         * أهم نقطة:
         * مقارنة Token المتصفح مع Firestore
         */

        if (
            data.lastSessionToken !== token
        ) {

            clearStudentSession();

            return false;

        }


        /*
         * تحديث البيانات المحلية
         */

        localStorage.setItem(
            "accountType",
            "student"
        );


        localStorage.setItem(
            "accountId",
            userDoc.id
        );


        if (
            data.email
        ) {

            localStorage.setItem(
                "userEmail",
                data.email
            );

        }


        if (
            data.username
        ) {

            localStorage.setItem(
                "username",
                data.username
            );

        }

        else if (
            data.userName
        ) {

            localStorage.setItem(
                "username",
                data.userName
            );

        }


        if (
            data.name
        ) {

            localStorage.setItem(
                "studentName",
                data.name
            );

        }

        else if (
            data.studentName
        ) {

            localStorage.setItem(
                "studentName",
                data.studentName
            );

        }


        return true;

    }

    catch (error) {

        console.error(
            "Old student session error:",
            error
        );


        /*
         * لا نحذف الجلسة عند مشكلة
         * اتصال مؤقتة.
         *
         * لكن لن ندخل تلقائيًا.
         */

        return false;

    }

}



/* =========================================================
   تنظيف جلسة الطالب
========================================================= */

function clearStudentSession() {

    localStorage.removeItem(
        "sessionToken"
    );

    localStorage.removeItem(
        "accountId"
    );

    localStorage.removeItem(
        "accountType"
    );

    localStorage.removeItem(
        "studentName"
    );

    localStorage.removeItem(
        "username"
    );

    localStorage.removeItem(
        "firebaseUID"
    );

    localStorage.removeItem(
        "adminName"
    );

    localStorage.removeItem(
        "userEmail"
    );

}



/* =========================================================
   فحص جلسة الأدمن القديمة
========================================================= */

async function checkOldAdminSession() {

    const email =
        localStorage.getItem(
            "userEmail"
        );


    const token =
        localStorage.getItem(
            "sessionToken"
        );


    if (
        !email ||
        !token
    ) {

        return false;

    }


    try {


        const snap =
            await db
            .collection("users")
            .where(
                "email",
                "==",
                email
            )
            .limit(1)
            .get();


        if (
            snap.empty
        ) {

            return false;

        }


        const userDoc =
            snap.docs[0];


        const data =
            userDoc.data();


        const role =
            getAccountRole(
                data
            );


        if (
            role !== "admin"
        ) {

            return false;

        }


        if (
            data.status === 'inactive' ||
            data.status === 'banned'
        ) {

            localStorage.removeItem(
                "sessionToken"
            );

            return false;

        }


        if (
            data.lastSessionToken !==
            token
        ) {

            localStorage.removeItem(
                "sessionToken"
            );

            localStorage.removeItem(
                "adminName"
            );

            return false;

        }


        localStorage.setItem(
            "accountType",
            "admin"
        );


        localStorage.setItem(
            "accountId",
            userDoc.id
        );


        return true;

    }

    catch (error) {

        console.error(
            "Old admin session error:",
            error
        );


        return false;

    }

}



/* =========================================================
   التحقق من جلسة Firebase الحالية
========================================================= */

async function checkCurrentFirebaseUser() {

    const currentUser =
        auth.currentUser;


    if (
        !currentUser
    ) {

        return false;

    }


    try {


        const snap =
            await db
            .collection("users")
            .where(
                "email",
                "==",
                currentUser.email
            )
            .limit(1)
            .get();


        if (
            snap.empty
        ) {

            await auth.signOut();

            return false;

        }


        const userDoc =
            snap.docs[0];


        const data =
            userDoc.data();


        if (
            data.status === 'inactive' ||
            data.status === 'banned'
        ) {

            await auth.signOut();


            clearStudentSession();


            localStorage.removeItem(
                "accountType"
            );


            return false;

        }


        const role =
            getAccountRole(
                data
            );


        console.log(
            "Current Firebase Role:",
            role
        );



        /* =====================================================
           Firebase User + Student
        ===================================================== */

        if (
            role === "student"
        ) {


            /*
             * أولًا:
             * نحاول استخدام جلسة الطالب الموجودة.
             */

            const oldToken =
                localStorage.getItem(
                    "sessionToken"
                );


            const oldAccountId =
                localStorage.getItem(
                    "accountId"
                );


            /*
             * لو لدينا Session Token
             * يجب التحقق منه.
             */

            if (
                oldToken &&
                oldAccountId === userDoc.id
            ) {

                if (
                    data.lastSessionToken ===
                    oldToken
                ) {

                    localStorage.setItem(
                        "accountType",
                        "student"
                    );


                    localStorage.setItem(
                        "accountId",
                        userDoc.id
                    );


                    localStorage.setItem(
                        "userEmail",
                        currentUser.email
                    );


                    localStorage.setItem(
                        "firebaseUID",
                        currentUser.uid
                    );


                    if (
                        data.name
                    ) {

                        localStorage.setItem(
                            "studentName",
                            data.name
                        );

                    }


                    if (
                        data.username
                    ) {

                        localStorage.setItem(
                            "username",
                            data.username
                        );

                    }

                    else if (
                        data.userName
                    ) {

                        localStorage.setItem(
                            "username",
                            data.userName
                        );

                    }


                    window.location.replace(
                        "home.html"
                    );


                    return true;

                }


                /*
                 * Token مختلف:
                 * يوجد دخول أحدث من جهاز آخر.
                 */

                clearStudentSession();


                /*
                 * نخرج Firebase أيضًا
                 * حتى لا يعيد تسجيل الدخول تلقائيًا.
                 */

                try {

                    await auth.signOut();

                }

                catch(e) {

                    console.error(e);

                }


                return false;

            }


            /*
             * Firebase موجود لكن لا يوجد
             * Session Token محلي.
             *
             * هذا يعني أن Firebase فقط هو الذي
             * يحتفظ بالجلسة، لذلك ننشئ Session Token
             * جديدة لهذه الجلسة.
             */

            await saveStudentSession(
                userDoc,
                currentUser
            );


            window.location.replace(
                "home.html"
            );


            return true;

        }



        /* =====================================================
           Firebase User + Admin
        ===================================================== */

        if (
            role === "admin"
        ) {


            localStorage.setItem(
                "userEmail",
                currentUser.email
            );


            localStorage.setItem(
                "firebaseUID",
                currentUser.uid
            );


            localStorage.setItem(
                "accountId",
                userDoc.id
            );


            localStorage.setItem(
                "accountType",
                "admin"
            );


            if (
                data.name
            ) {

                localStorage.setItem(
                    "adminName",
                    data.name
                );

            }


            /*
             * الأدمن يتم فحص Session Token
             */

            const adminToken =
                localStorage.getItem(
                    "sessionToken"
                );


            if (
                adminToken &&
                data.lastSessionToken ===
                adminToken
            ) {

                window.location.replace(
                    "admin1.html"
                );


                return true;

            }


            /*
             * لو Firebase موجود ولكن Session Token
             * غير موجود، لا ندخله تلقائيًا.
             *
             * هذا يحافظ على نظام الأدمن.
             */

            return false;

        }


        await auth.signOut();

        return false;

    }

    catch (error) {

        console.error(
            "Current Firebase user check failed:",
            error
        );


        return false;

    }

}



/* =========================================================
   تشغيل الصفحة
========================================================= */

window.onload = async function() {


    /*
     * وقت شاشة البداية
     */

    setTimeout(
        async function() {


            try {


                /* =================================================
                   1
                   فحص جلسة الطالب القديمة
                ================================================= */

                const oldStudentSession =
                    await checkOldStudentSession();


                if (
                    oldStudentSession
                ) {

                    window.location.replace(
                        "home.html"
                    );


                    return;

                }



                /* =================================================
                   2
                   فحص جلسة الأدمن القديمة
                ================================================= */

                const oldAdminSession =
                    await checkOldAdminSession();


                if (
                    oldAdminSession
                ) {

                    window.location.replace(
                        "admin1.html"
                    );


                    return;

                }



                /* =================================================
                   3
                   فحص Firebase Authentication
                ================================================= */

                const firebaseRedirected =
                    await checkCurrentFirebaseUser();


                if (
                    firebaseRedirected
                ) {

                    return;

                }

            }

            catch (error) {

                console.error(
                    "Automatic login check failed:",
                    error
                );

            }


            /*
             * لا توجد جلسة صالحة
             */

            showLoginInterface();


        },
        2200
    );

};
