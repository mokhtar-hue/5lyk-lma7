    <style>

        :root {

            --primary: #6366f1;

            --bg: #0f172a;

            --card: #1e293b;

            --accent: #fbbf24;

        body.light-mode {

            --card: #ffffff;

            --text: #1e293b;

            --input: #f1f5f9;

            --accent: #d97706;

        body {

            background-color: var(--bg);

            color: var(--text);

            display: flex;

            align-items: center;

            min-height: 100vh;

            overflow: hidden;

            transition: var(--trans);

        }


        /* =====================================================
           زر تغيير الوضع
        ===================================================== */

        .settings-fab {

            position: fixed;

            top: 20px;

            left: 20px;

            z-index: 10001;

            width: 45px;

            height: 45px;

            justify-content: center;

            color: var(--accent);

        /* =====================================================
           شاشة الدخول السحرية
        ===================================================== */

            inset: 0;

            display: flex;

            font-size: 150px;

            color: var(--accent);

                drop-shadow(0 0 30px var(--accent));

                    var(--accent),
                    #fff

            margin-top: 20px;

                transform: scale(1);

        @keyframes scaleFloat {

            50% {

                    rotate(5deg);

        /* =====================================================

        /* =====================================================

<script>


/* =========================================================
   Firebase Configuration
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws",

    authDomain:
        "zomaapp-744fc.firebaseapp.com",

    projectId:
        "zomaapp-744fc"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();


const auth =
    firebase.auth();



/* =========================================================
   منع Redirect Loop
========================================================= */

let redirectInProgress = false;


/*
 * عند الرجوع لصفحة الدخول من home.html
 * لا نسمح بفحص الجلسة أكثر من مرة
 * في نفس دورة الصفحة.
 */

function isRedirecting() {

    return redirectInProgress === true;

}


function safeRedirect(url) {

    if (
        redirectInProgress
    ) {

        return;

    }


    redirectInProgress = true;


    window.location.replace(
        url
    );

}



/* =========================================================
   Toggle Password
========================================================= */

function togglePass() {

    const p =
        document.getElementById(
            'pass'
        );


    const icon =
        document.querySelector(
            '.toggle-pass'
        );


    if (
        p.type === "password"
    ) {

        p.type = "text";


        icon.classList.replace(
            'fa-eye',
            'fa-eye-slash'
        );

    }

    else {

        p.type = "password";


        icon.classList.replace(
            'fa-eye-slash',
            'fa-eye'
        );

    }

}



/* =========================================================
   Theme
========================================================= */

function toggleTheme() {

    document.body.classList.toggle(
        'light-mode'
    );


    const isLight =
        document.body.classList.contains(
            'light-mode'
        );


    localStorage.setItem(
        'theme',
        isLight
            ? 'light'
            : 'dark'
    );


    document.getElementById(
        'themeIcon'
    ).className =
        isLight
            ? 'fas fa-sun'
            : 'fas fa-moon';

}


if (
    localStorage.getItem(
        'theme'
    ) === 'light'
) {

    document.body.classList.add(
        'light-mode'
    );


    document.getElementById(
        'themeIcon'
    ).className =
        'fas fa-sun';

}



/* =========================================================
   إظهار واجهة الدخول
========================================================= */

function showLoginInterface() {

    const overlay =
        document.getElementById(
            'magicOverlay'
        );


    const card =
        document.getElementById(
            'loginCard'
        );


    overlay.style.opacity =
        '0';


    setTimeout(() => {

        overlay.style.display =
            'none';


        card.style.display =
            'block';


        setTimeout(() => {

            card.style.opacity =
                '1';


            card.style.transform =
                'translateY(0)';

        }, 50);

    }, 1000);

}



/* =========================================================
   تحديد نوع الحساب
========================================================= */

function getAccountRole(
    userData
) {

    const role =
        String(
            userData.role || "student"
        )
        .trim()
        .toLowerCase();


    if (
        role === "admin" ||
        role === "administrator" ||
        role === "أدمن" ||
        role === "ادمن" ||
        role === "مدير"
    ) {

        return "admin";

    }


    return "student";

}



/* =========================================================
   التوجيه حسب نوع الحساب
========================================================= */

function redirectByRole(
    role
) {

    if (
        isRedirecting()
    ) {

        return;

    }


    if (
        role === "admin"
    ) {

        localStorage.setItem(
            "accountType",
            "admin"
        );


        safeRedirect(
            "admin1.html"
        );


        return;

    }


    localStorage.setItem(
        "accountType",
        "student"
    );


    safeRedirect(
        "home.html"
    );

}



/* =========================================================
   البحث عن المستخدم في Firestore
========================================================= */

async function findFirestoreUser(
    loginValue
) {

    let snap;


    /*
     * البحث بالإيميل
     */

    if (
        loginValue.includes('@')
    ) {

        snap =
            await db
            .collection("users")
            .where(
                "email",
                "==",
                loginValue
            )
            .limit(1)
            .get();


        if (
            !snap.empty
        ) {

            return snap.docs[0];

        }

    }


    /*
     * البحث username
     */

    snap =
        await db
        .collection("users")
        .where(
            "username",
            "==",
            loginValue
        )
        .limit(1)
        .get();


    if (
        !snap.empty
    ) {

        return snap.docs[0];

    }


    /*
     * دعم userName
     */

    snap =
        await db
        .collection("users")
        .where(
            "userName",
            "==",
            loginValue
        )
        .limit(1)
        .get();


    if (
        !snap.empty
    ) {

        return snap.docs[0];

    }


    return null;

}



/* =========================================================
   Firebase Authentication
========================================================= */

async function checkFirebaseAuthentication(
    email,
    password
) {

    try {

        const credential =
            await auth
            .signInWithEmailAndPassword(
                email,
                password
            );


        if (
            credential &&
            credential.user
        ) {

            return {

                exists: true,

                authenticated: true,

                user:
                    credential.user,

                error: null

            };

        }


        return {

            exists: false,

            authenticated: false,

            user: null,

            error: null

        };

    }

    catch (error) {

        if (
            error.code ===
            'auth/wrong-password'
        ) {

            return {

                exists: true,

                authenticated: false,

                user: null,

                error: error

            };

        }


        if (
            error.code ===
            'auth/invalid-credential'
        ) {

            return {

                exists: true,

                authenticated: false,

                user: null,

                error: error

            };

        }


        if (
            error.code ===
            'auth/user-disabled'
        ) {

            return {

                exists: true,

                authenticated: false,

                user: null,

                error: error

            };

        }


        if (
            error.code ===
            'auth/too-many-requests'
        ) {

            return {

                exists: true,

                authenticated: false,

                user: null,

                error: error

            };

        }


        if (
            error.code ===
            'auth/user-not-found'
        ) {

            return {

                exists: false,

                authenticated: false,

                user: null,

                error: error

            };

        }


        if (
            error.code ===
            'auth/invalid-email'
        ) {

            return {

                exists: false,

                authenticated: false,

                user: null,

                error: error

            };

        }


        return {

            exists: false,

            authenticated: false,

            user: null,

            error: error

        };

    }

}



/* =========================================================
   حفظ جلسة الأدمن
========================================================= */

async function saveAdminSession(
    userDoc,
    firebaseUser
) {

    const userData =
        userDoc.data();


    const role =
        getAccountRole(
            userData
        );


    if (
        role !== "admin"
    ) {

        throw new Error(
            "هذا الحساب ليس حساب أدمن."
        );

    }


    const newToken =
        "zoma_" +
        Math.random()
        .toString(36)
        .substring(2, 12);


    await db
        .collection("users")
        .doc(userDoc.id)
        .update({

            lastSessionToken:
                newToken,

            lastLogin:
                firebase.firestore
                .FieldValue
                .serverTimestamp(),

            uid:
                firebaseUser.uid

        });


    localStorage.setItem(
        "userEmail",
        firebaseUser.email
    );


    localStorage.setItem(
        "sessionToken",
        newToken
    );


    localStorage.setItem(
        "firebaseUID",
        firebaseUser.uid
    );


    localStorage.setItem(
        "accountType",
        "admin"
    );


    localStorage.setItem(
        "accountId",
        userDoc.id
    );


    if (
        userData.username
    ) {

        localStorage.setItem(
            "username",
            userData.username
        );

    }

    else if (
        userData.userName
    ) {

        localStorage.setItem(
            "username",
            userData.userName
        );

    }


    if (
        userData.name
    ) {

        localStorage.setItem(
            "adminName",
            userData.name
        );

    }

}



/* =========================================================
   حفظ جلسة الطالب
========================================================= */

function saveStudentSession(
    userDoc
) {

    const userData =
        userDoc.data();


    localStorage.setItem(
        "accountType",
        "student"
    );


    localStorage.setItem(
        "accountId",
        userDoc.id
    );


    if (
        userData.email
    ) {

        localStorage.setItem(
            "userEmail",
            userData.email
        );

    }


    if (
        userData.username
    ) {

        localStorage.setItem(
            "username",
            userData.username
        );

    }

    else if (
        userData.userName
    ) {

        localStorage.setItem(
            "username",
            userData.userName
        );

    }


    if (
        userData.name
    ) {

        localStorage.setItem(
            "studentName",
            userData.name
        );

    }

    else if (
        userData.studentName
    ) {

        localStorage.setItem(
            "studentName",
            userData.studentName
        );

    }


    /*
     * مهم جداً:
     * الطالب لا يحمل أي Session Token
     * خاص بالأدمن.
     */

    localStorage.removeItem(
        "sessionToken"
    );


    localStorage.removeItem(
        "adminName"
    );

}



/* =========================================================
   التحقق من كلمة مرور الطالب
========================================================= */

function checkStudentPassword(
    userData,
    enteredPassword
) {

    let storedPassword =
        userData.password;


    if (
        storedPassword === undefined
    ) {

        storedPassword =
            userData.pass;

    }


    if (
        storedPassword === undefined
    ) {

        storedPassword =
            userData.studentPassword;

    }


    /*
     * عدم وجود كلمة مرور
     * يعني السماح كما في النظام القديم.
     */

    if (
        storedPassword === undefined ||
        storedPassword === null
    ) {

        return true;

    }


    return (
        String(storedPassword) ===
        String(enteredPassword)
    );

}



/* =========================================================
   تنظيف جلسة الأدمن
========================================================= */

function clearAdminSession() {

    localStorage.removeItem(
        "sessionToken"
    );


    localStorage.removeItem(
        "adminName"
    );


    /*
     * لا نمسح accountId هنا
     * لأنه قد يكون للطالب.
     */

}



/* =========================================================
   تسجيل الدخول الرئيسي
========================================================= */

async function handleLogin() {


    if (
        isRedirecting()
    ) {

        return;

    }


    const loginValue =
        document
        .getElementById('email')
        .value
        .trim();


    const pass =
        document
        .getElementById('pass')
        .value
        .trim();


    const errBox =
        document
        .getElementById('errorArea');


    const supBtn =
        document
        .getElementById('supportBtn');


    errBox.style.display =
        'none';


    supBtn.style.display =
        'none';


    if (
        !loginValue ||
        !pass
    ) {

        return showError(
            "برجاء إدخال البيانات كاملة."
        );

    }


    showLoader(true);


    try {


        /* =====================================================
           1
           البحث في Firestore
        ===================================================== */

        const userDoc =
            await findFirestoreUser(
                loginValue
            );


        if (
            !userDoc
        ) {

            showLoader(false);

            return showError(
                "هذا الحساب غير موجود في قاعدة بيانات المنصة."
            );

        }


        const userData =
            userDoc.data();


        /* =====================================================
           2
           تحديد الدور
        ===================================================== */

        const role =
            getAccountRole(
                userData
            );


        console.log(
            "Account Role:",
            role
        );


        /* =====================================================
           3
           الإيميل
        ===================================================== */

        const authEmail =
            userData.email ||
            (
                loginValue.includes('@')
                    ? loginValue
                    : ''
            );


        /* =====================================================
           4
           حالة الحساب
        ===================================================== */

        if (
            userData.status === 'inactive' ||
            userData.status === 'banned'
        ) {

            showLoader(false);


            const reason =
                userData.lockReason ||
                userData.banReason ||
                "تم تعطيل حسابك مؤقتاً.";


            showError(
                "🚫 عذراً: " + reason
            );


            supBtn.style.display =
                'block';


            const waMsg =
                `السلام عليكم مستشار حازم، واجهت مشكلة في الدخول.
السبب: ${reason}
المستخدم: ${authEmail}`;


            supBtn.href =
                `https://wa.me/201060234399?text=${encodeURIComponent(waMsg)}`;


            return;

        }


        /* =====================================================
           5
           STUDENT
        ===================================================== */

        if (
            role === "student"
        ) {

            /*
             * تنظيف أي بيانات أدمن قديمة
             */

            clearAdminSession();


            /*
             * هل الطالب مرتبط بـ Authentication؟
             */

            let firebaseLoginSucceeded =
                false;


            let firebaseStudentUser =
                null;


            if (
                authEmail
            ) {

                const authResult =
                    await checkFirebaseAuthentication(
                        authEmail,
                        pass
                    );


                /*
                 * دخول Firebase ناجح
                 */

                if (
                    authResult.authenticated === true
                ) {

                    firebaseLoginSucceeded =
                        true;


                    firebaseStudentUser =
                        authResult.user;

                }


                /*
                 * Firebase موجود وكلمة السر غلط
                 */

                else if (
                    authResult.exists === true &&
                    authResult.authenticated === false
                ) {

                    const firestorePasswordCorrect =
                        checkStudentPassword(
                            userData,
                            pass
                        );


                    if (
                        !firestorePasswordCorrect
                    ) {

                        showLoader(false);

                        return showError(
                            "كلمة المرور غير صحيحة."
                        );

                    }

                }

            }


            /*
             * لو لم ينجح Firebase
             * نتحقق من كلمة Firestore.
             */

            if (
                !firebaseLoginSucceeded
            ) {

                const passwordCorrect =
                    checkStudentPassword(
                        userData,
                        pass
                    );


                if (
                    !passwordCorrect
                ) {

                    showLoader(false);

                    return showError(
                        "كلمة المرور غير صحيحة."
                    );

                }

                /*
                 * الطالب Firestore فقط.
                 *
                 * لو كان فيه Firebase User قديم
                 * وتم الاعتماد على Firestore password،
                 * نعمل Sign Out حتى لا تسبب الجلسة
                 * القديمة Redirect Loop.
                 */

                if (
                    auth.currentUser
                ) {

                    try {

                        await auth.signOut();

                    }

                    catch (signOutError) {

                        console.warn(
                            "Student Firebase signOut:",
                            signOutError
                        );

                    }

                }

            }


            /*
             * حفظ جلسة الطالب
             */

            saveStudentSession(
                userDoc
            );


            /*
             * حفظ Firebase UID
             * فقط لو دخل Authentication فعلاً.
             */

            if (
                firebaseLoginSucceeded &&
                firebaseStudentUser
            ) {

                localStorage.setItem(
                    "firebaseUID",
                    firebaseStudentUser.uid
                );

            }

            else {

                localStorage.removeItem(
                    "firebaseUID"
                );

            }


            /*
             * علامة واضحة أن الدخول تم كطالب.
             */

            sessionStorage.setItem(
                "loginCompleted",
                "student"
            );


            showLoader(false);


            /*
             * الطالب -> home
             */

            redirectByRole(
                "student"
            );


            return;

        }


        /* =====================================================
           6
           ADMIN
        ===================================================== */

        if (
            role === "admin"
        ) {


            /*
             * الأدمن لازم يكون له إيميل
             */

            if (
                !authEmail
            ) {

                showLoader(false);

                return showError(
                    "حساب الأدمن يحتاج إلى إيميل صالح في بيانات الحساب."
                );

            }


            /*
             * تسجيل الدخول Authentication
             */

            const authResult =
                await checkFirebaseAuthentication(
                    authEmail,
                    pass
                );


            /*
             * نجاح الأدمن
             */

            if (
                authResult.authenticated === true
            ) {

                const firebaseUser =
                    authResult.user;


                /*
                 * إعادة قراءة بيانات الحساب
                 * للتأكد من role الحقيقي.
                 */

                const freshDoc =
                    await db
                    .collection("users")
                    .doc(userDoc.id)
                    .get();


                if (
                    !freshDoc.exists
                ) {

                    await auth.signOut();


                    showLoader(false);

                    return showError(
                        "لم يتم العثور على بيانات الحساب."
                    );

                }


                const freshData =
                    freshDoc.data();


                const freshRole =
                    getAccountRole(
                        freshData
                    );


                /*
                 * لو تغير من Admin إلى Student
                 */

                if (
                    freshRole !== "admin"
                ) {

                    try {

                        await auth.signOut();

                    }

                    catch(e) {

                        console.error(e);

                    }


                    saveStudentSession(
                        freshDoc
                    );


                    sessionStorage.setItem(
                        "loginCompleted",
                        "student"
                    );


                    showLoader(false);


                    redirectByRole(
                        "student"
                    );


                    return;

                }


                /*
                 * حفظ جلسة الأدمن
                 */

                await saveAdminSession(
                    freshDoc,
                    firebaseUser
                );


                sessionStorage.setItem(
                    "loginCompleted",
                    "admin"
                );


                showLoader(false);


                /*
                 * الأدمن -> admin1
                 */

                redirectByRole(
                    "admin"
                );


                return;

            }


            /*
             * Authentication موجود
             * ولكن البيانات خاطئة.
             */

            if (
                authResult.exists === true &&
                authResult.authenticated === false
            ) {

                showLoader(false);


                if (
                    authResult.error &&
                    authResult.error.code ===
                    'auth/user-disabled'
                ) {

                    return showError(
                        "🚫 تم تعطيل هذا الحساب من Firebase Authentication."
                    );

                }


                if (
                    authResult.error &&
                    authResult.error.code ===
                    'auth/too-many-requests'
                ) {

                    return showError(
                        "تم إجراء محاولات دخول كثيرة. حاول مرة أخرى بعد قليل."
                    );

                }


                return showError(
                    "بيانات دخول الأدمن غير صحيحة."
                );

            }


            /*
             * Admin Firestore فقط
             */

            showLoader(false);


            return showError(
                "حساب الأدمن غير مرتبط بـ Firebase Authentication."
            );

        }


        /* =====================================================
           7
           حماية
        ===================================================== */

        showLoader(false);


        return showError(
            "نوع الحساب غير معروف."
        );


    }

    catch (e) {


        console.error(
            "Firebase Login Error:",
            e
        );


        showLoader(false);


        switch (
            e.code
        ) {


            case 'auth/invalid-email':

                showError(
                    "صيغة الإيميل غير صحيحة."
                );

                break;


            case 'auth/wrong-password':

                showError(
                    "كلمة المرور غير صحيحة."
                );

                break;


            case 'auth/invalid-credential':

                showError(
                    "بيانات الدخول غير صحيحة
