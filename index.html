<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | منصة المستشار حـازم سالم</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #6366f1; --bg: #0f172a; --card: #1e293b;
            --text: #f1f5f9; --input: #334155; --accent: #818cf8; --danger: #ef4444;
        }
        
        body {
            font-family: 'Cairo', sans-serif; background-color: var(--bg);
            color: var(--text); margin: 0; display: flex; justify-content: center;
            align-items: center; min-height: 100vh; overflow-x: hidden;
        }

        #loader {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95);
            display: none; justify-content: center; align-items: center;
            z-index: 9999; backdrop-filter: blur(10px);
        }
        .spinner {
            width: 60px; height: 60px; border: 5px solid rgba(99, 102, 241, 0.1);
            border-top-color: var(--primary); border-radius: 50%;
            animation: rotate 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }

        .login-card {
            background: var(--card); padding: 50px 40px; border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%; max-width: 440px; text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            animation: slideUp 0.8s ease-out;
        }

        .logo-area { margin-bottom: 20px; font-size: 50px; color: var(--accent); animation: balance 2.5s ease-in-out infinite; }
        
        @keyframes balance { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes rotate { to { transform: rotate(360deg); } }
        
        .welcome-title { font-size: 26px; font-weight: 900; color: #fff; margin-bottom: 5px; }
        .welcome-sub { color: var(--accent); font-weight: 700; margin-bottom: 30px; font-size: 15px; }
        
        .input-box { margin-bottom: 25px; text-align: right; }
        .input-box label { display: block; margin-bottom: 10px; font-weight: 700; color: #94a3b8; font-size: 14px; }
        
        .field { position: relative; display: flex; align-items: center; }
        .field i { position: absolute; right: 15px; color: var(--accent); font-size: 18px; }
        .field input {
            flex: 1; padding: 16px 45px 16px 20px; border-radius: 20px; border: 2px solid transparent;
            background: var(--input); color: #fff; font-family: 'Cairo'; font-size: 16px; outline: none; transition: 0.3s;
        }
        .field input:focus { border-color: var(--primary); background: #243147; box-shadow: 0 0 15px rgba(99, 102, 241, 0.2); }
        
        .login-btn {
            width: 100%; padding: 18px; border: none; border-radius: 22px;
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: white; font-weight: 800; font-size: 18px; cursor: pointer; margin-top: 10px;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3); transition: 0.3s;
        }
        .login-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(79, 70, 229, 0.4); }
        
        .support-btn {
            display: none; width: 100%; padding: 15px; border-radius: 22px;
            background: #128c7e; color: white; text-decoration: none;
            font-weight: 700; margin-top: 15px; font-size: 15px; transition: 0.3s; text-align: center;
        }

        .error-msg { background: rgba(239, 68, 68, 0.1); color: var(--danger); padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700; margin-top: 15px; display: none; border: 1px solid var(--danger); }
    </style>
</head>
<body>

<div id="loader"><div class="spinner"></div></div>

<div class="login-card">
    <div class="logo-area"><i class="fas fa-balance-scale"></i></div>
    <div class="welcome-title" id="greeting">مرحباً بك</div>
    <div class="welcome-sub">منصة المستشار حازم سالم</div>

    <div class="input-box">
        <label>إسم المستخدم</label>
        <div class="field">
            <i class="fas fa-user-circle"></i>
            <input type="email" id="email" placeholder="example@mail.com" dir="ltr">
        </div>
    </div>

    <div class="input-box">
        <label>كلمة المرور</label>
        <div class="field">
            <i class="fas fa-lock"></i>
            <input type="password" id="pass" placeholder="••••••••" dir="ltr">
        </div>
    </div>

    <button class="login-btn" onclick="handleLogin()">دخول المنصة الآن</button>
    
    <div id="errorArea" class="error-msg"></div>
    <a id="supportBtn" href="#" target="_blank" class="support-btn">
        <i class="fab fa-whatsapp"></i> تواصل مع الدعم الفني
    </a>
</div>

<script>
    // تهيئة Firebase
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // التحقق من الجلسة السابقة
    window.onload = function() {
        const hr = new Date().getHours();
        document.getElementById('greeting').innerText = hr < 12 ? "صباح الخير يا بطل ☀️" : "مساء الخير يا بطل 🌙";
        
        if(localStorage.getItem("sessionToken")) {
            window.location.href = "home.html";
        }
    };

    async function handleLogin() {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('pass').value.trim();
        const errorArea = document.getElementById('errorArea');
        const supportBtn = document.getElementById('supportBtn');

        if(!email || !pass) return showError("من فضلك أدخل البيانات المطلوبة");

        showLoader(true);
        errorArea.style.display = 'none';
        supportBtn.style.display = 'none';

        try {
            const snap = await db.collection("users").where("email", "==", email).get();
            
            if(snap.empty) {
                showLoader(false);
                return showSupportError("هذا الحساب غير مسجل لدينا.", "استفسار من " + email);
            }

            const userDoc = snap.docs[0];
            const userData = userDoc.data();

            if((userData.password || userData.pass) !== pass) {
                showLoader(false);
                return showError("كلمة المرور غير صحيحة.");
            }

            if(userData.status === "banned") {
                showLoader(false);
                return showSupportError("حسابك معطل حالياً.", "طلب فك حظر حساب: " + email);
            }

            const newSessionToken = "sess_" + Math.random().toString(36).substr(2, 9);
            await db.collection("users").doc(userDoc.id).update({
                lastSessionToken: newSessionToken,
                lastLogin: firebase.firestore.FieldValue.serverTimestamp()
            });

            localStorage.setItem("userEmail", email);
            localStorage.setItem("sessionToken", newSessionToken);
            
            // تنبيه: تأكد أن ملف home.html موجود في نفس المستودع على GitHub
            window.location.href = "home.html";

        } catch (e) {
            console.error(e);
            showLoader(false);
            showError("حدث خطأ في الاتصال بالسيرفر.");
        }
    }

    function showError(msg) {
        const err = document.getElementById('errorArea');
        err.innerText = msg;
        err.style.display = 'block';
    }

    function showSupportError(msg, whatsappMsg) {
        showError(msg);
        const btn = document.getElementById('supportBtn');
        btn.href = "https://wa.me/201060234399?text=" + encodeURIComponent(whatsappMsg);
        btn.style.display = 'block';
    }

    function showLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }
</script>
</body>
</html>
