<script>


/* =========================================================
   Firebase Configuration
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws",

    authDomain:
        "zomaapp-744fc.firebaseapp.com",

};

/* =========================================================
   Toggle Password
========================================================= */

function togglePass() {

    const p =
        document.getElementById(
            'pass'
        );


    const icon =
        document.querySelector(
            '.toggle-pass'
        );


    if (
        p.type === "password"
    ) {

        p.type = "text";


        icon.classList.replace(
            'fa-eye',
            'fa-eye-slash'
        );

    }

    else {

        p.type = "password";


        icon.classList.replace(
            'fa-eye-slash',
            'fa-eye'
        );

    }

}



/* =========================================================
   Theme
========================================================= */

function toggleTheme() {

    document.body.classList.toggle(
        'light-mode'
    );


    const isLight =
        document.body.classList.contains(
            'light-mode'
        );


    localStorage.setItem(
        'theme',
        isLight
            ? 'light'
            : 'dark'
    );


    document.getElementById(
        'themeIcon'
    ).className =
        isLight
            ? 'fas fa-sun'
            : 'fas fa-moon';

}


if (
    localStorage.getItem(
        'theme'
    ) === 'light'
) {

    toggleTheme();

}



/* =========================================================
   إظهار واجهة الدخول
========================================================= */

function showLoginInterface() {

    const overlay =
        document.getElementById(
            'magicOverlay'
        );


    const card =

/* =========================================================
   تحديد نوع الحساب
   مهم جداً:
   
   admin  -> admin1.html
   student -> home.html
   
   وأي حساب قديم بدون role
   يعتبر student
========================================================= */

function getAccountRole(userData) {

    const role =
        String(
            userData.role || "student"
        )
        .trim()
        .toLowerCase();


    /*
     * دعم القيم العربية أيضاً
     */

    if (
        role === "admin" ||
        role === "administrator" ||
        role === "أدمن" ||
        role === "ادمن" ||
        role === "مدير"
    ) {

        return "admin";

    }


    return "student";

}



/* =========================================================
   التوجيه حسب نوع الحساب
========================================================= */

function redirectByRole(
    role
) {

    /*
     * حماية إضافية:
     * لا نسمح إلا بقيمتين.
     */

    if (
        role === "admin"
    ) {

        localStorage.setItem(
            "accountType",
            "admin"
        );


        window.location.replace(
            "admin1.html"
        );


        return;

    }


    /*
     * أي شيء غير admin
     * يعتبر طالب
     */

    localStorage.setItem(
        "accountType",
        "student"
    );


    window.location.replace(
        "home.html"
    );

}



/* =========================================================
   البحث عن المستخدم في Firestore
========================================================= */

async function findFirestoreUser(
    loginValue
) {

    let snap;


    /*
     * البحث باستخدام الإيميل
     */

    if (
        loginValue.includes('@')
    ) {

        snap =
            await db
            .collection("users")
            .where(
                "email",
                "==",
                loginValue
            )
            .limit(1)
            .get();


        if (
            !snap.empty
        ) {

            return snap.docs[0];

        }

    }


    /*
     * البحث باستخدام username
     */

    snap =
        await db
        .collection("users")
        .where(
            "username",
            "==",
            loginValue
        )
        .limit(1)
        .get();


    if (
        !snap.empty
    ) {

        return snap.docs[0];

    }


    /*
     * دعم userName
     */

    snap =
        await db
        .collection("users")
        .where(
            "userName",
            "==",
            loginValue
        )
        .limit(1)
        .get();


    if (
        !snap.empty
    ) {

        return snap.docs[0];

    }


    return null;

}



/* =========================================================
   التحقق من Firebase Authentication
========================================================= */

async function checkFirebaseAuthentication(
    email,
    password
) {

    try {

        const credential =
            await auth
            .signInWithEmailAndPassword(
                email,
                password
            );


        if (
            credential &&
            credential.user
        ) {

            return {

                exists: true,

                authenticated: true,

                user:
                    credential.user,

                error: null

            };

        }


        return {

            exists: false,

            authenticated: false,

            user: null,

            error: null

        };

    }

    catch (error) {


        /*
         * الحساب موجود في Authentication
         * ولكن كلمة المرور غير صحيحة.
         */

        if (
            error.code ===
            'auth/wrong-password'
        ) {

            return {

                exists: true,

                authenticated: false,

                user: null,

                error: error

            };

        }


        /*
         * Firebase الحديث
         */

        if (
            error.code ===
            'auth/invalid-credential'
        ) {

            return {

                exists: true,

                authenticated: false,

                user: null,

                error: error

            };

        }


        /*
         * الحساب معطل
         */

        if (
            error.code ===
            'auth/user-disabled'
        ) {

            return {

                exists: true,

                authenticated: false,

                user: null,

                error: error

            };

        }


        /*
         * محاولات كثيرة
         */

        if (
            error.code ===
            'auth/too-many-requests'
        ) {

            return {

                exists: true,

                authenticated: false,

                user: null,

                error: error

            };

        }


        /*
         * الحساب غير موجود
         */

        if (
            error.code ===
            'auth/user-not-found'
        ) {

            return {

                exists: false,

                authenticated: false,

                user: null,

                error: error

            };

        }


        /*
         * إيميل غير صحيح
         */

        if (
            error.code ===
            'auth/invalid-email'
        ) {

            return {

                exists: false,

                authenticated: false,

                user: null,

                error: error

            };

        }


        return {

            exists: false,

            authenticated: false,

            user: null,

            error: error

        };

    }

}



/* =========================================================
   حفظ جلسة الأدمن
========================================================= */

async function saveAdminSession(
    userDoc,
    firebaseUser
) {

    const userData =
        userDoc.data();


    /*
     * تأكيد أن الحساب أدمن فعلاً
     */

    const role =
        getAccountRole(
            userData
        );


    if (
        role !== "admin"
    ) {

        throw new Error(
            "هذا الحساب ليس حساب أدمن."
        );

    }


    const newToken =
        "zoma_" +
        Math.random()
        .toString(36)
        .substring(2, 12);


    /*
     * تحديث الجلسة
     */

    await db
        .collection("users")
        .doc(userDoc.id)
        .update({

            lastSessionToken:
                newToken,

            lastLogin:
                firebase.firestore
                .FieldValue
                .serverTimestamp(),

            uid:
                firebaseUser.uid

        });


    /*
     * حفظ بيانات الجلسة
     */

    localStorage.setItem(
        "userEmail",
        firebaseUser.email
    );


    localStorage.setItem(
        "sessionToken",
        newToken
    );


    localStorage.setItem(
        "firebaseUID",
        firebaseUser.uid
    );


    localStorage.setItem(
        "accountType",
        "admin"
    );


    localStorage.setItem(
        "accountId",
        userDoc.id
    );


    /*
     * username
     */

    if (
        userData.username
    ) {

        localStorage.setItem(
            "username",
            userData.username
        );

    }
    else if (
        userData.userName
    ) {

        localStorage.setItem(
            "username",
            userData.userName
        );

    }


    /*
     * اسم الأدمن
     */

    if (
        userData.name
    ) {

        localStorage.setItem(
            "adminName",
            userData.name
        );

    }

}



/* =========================================================
   حفظ جلسة الطالب
========================================================= */

function saveStudentSession(
    userDoc
) {

    const userData =
        userDoc.data();


    /*
     * إجبار الجلسة على الطالب
     */

    localStorage.setItem(
        "accountType",
        "student"
    );


    localStorage.setItem(
        "accountId",
        userDoc.id
    );


    /*
     * حفظ الإيميل
     */

    if (
        userData.email
    ) {

        localStorage.setItem(
            "userEmail",
            userData.email
        );

    }


    /*
     * حفظ username
     */

    if (
        userData.username
    ) {

        localStorage.setItem(
            "username",
            userData.username
        );

    }
    else if (
        userData.userName
    ) {

        localStorage.setItem(
            "username",
            userData.userName
        );

    }


    /*
     * حفظ اسم الطالب
     */

    if (
        userData.name
    ) {

        localStorage.setItem(
            "studentName",
            userData.name
        );

    }
    else if (
        userData.studentName
    ) {

        localStorage.setItem(
            "studentName",
            userData.studentName
        );

    }


    /*
     * إزالة بيانات أدمن قديمة
     */

    localStorage.removeItem(
        "sessionToken"
    );

    localStorage.removeItem(
        "adminName"
    );

}



/* =========================================================
   التحقق من كلمة مرور الطالب
========================================================= */

function checkStudentPassword(
    userData,
    enteredPassword
) {

    let storedPassword =
        userData.password;


    /*
     * دعم pass
     */

    if (
        storedPassword === undefined
    ) {

        storedPassword =
            userData.pass;

    }


    /*
     * دعم studentPassword
     */

    if (
        storedPassword === undefined
    ) {

        storedPassword =
            userData.studentPassword;

    }


    /*
     * إذا لم توجد كلمة مرور
     */

    if (
        storedPassword === undefined ||
        storedPassword === null
    ) {

        return true;

    }


    return (
        String(storedPassword) ===
        String(enteredPassword)
    );

}



/* =========================================================
   تسجيل الدخول الرئيسي
========================================================= */

async function handleLogin() {


    const loginValue =
        document
        .getElementById('email')
        .value
        .trim();


    const pass =
        document
        .getElementById('pass')
        .value
        .trim();


    const errBox =
        document
        .getElementById('errorArea');


    const supBtn =
        document
        .getElementById('supportBtn');


    /*
     * تنظيف الرسائل
     */

    errBox.style.display =
        'none';


    supBtn.style.display =
        'none';


    /*
     * التحقق
     */

    if (
        !loginValue ||
        !pass
    ) {

        return showError(
            "برجاء إدخال البيانات كاملة."
        );

    }


    showLoader(true);


    try {


        /* =====================================================
           1 - البحث في Firestore
        ===================================================== */

        const userDoc =
            await findFirestoreUser(
                loginValue
            );


        /*
         * الحساب غير موجود
         */

        if (
            !userDoc
        ) {

            showLoader(false);

            return showError(
                "هذا الحساب غير موجود في قاعدة بيانات المنصة."
            );

        }


        const userData =
            userDoc.data();


        /*
         * تحديد الـ role من Firestore
         *
         * هذه هي أهم نقطة في التعديل.
         */

        const role =
            getAccountRole(
                userData
            );


        console.log(
            "Account Role:",
            role
        );


        /*
         * الإيميل المستخدم في Firebase
         */

        const authEmail =
            userData.email ||
            (
                loginValue.includes('@')
                    ? loginValue
                    : ''
            );


        /* =====================================================
           2 - حالة الحساب
        ===================================================== */

        if (
            userData.status === 'inactive' ||
            userData.status === 'banned'
        ) {

            showLoader(false);


            const reason =
                userData.lockReason ||
                userData.banReason ||
                "تم تعطيل حسابك مؤقتاً.";


            showError(
                "🚫 عذراً: " + reason
            );


            supBtn.style.display =
                'block';


            const waMsg =
                `السلام عليكم مستشار حازم، واجهت مشكلة في الدخول.
السبب: ${reason}
المستخدم: ${authEmail}`;


            supBtn.href =
                `https://wa.me/201060234399?text=${encodeURIComponent(waMsg)}`;


            return;

        }


        /* =====================================================
           3 - لو الحساب طالب
           
           الطالب يعتمد على Firestore
           حتى لو لم يكن له Authentication.
        ===================================================== */

        if (
            role === "student"
        ) {

            /*
             * لو يوجد Firebase Authentication
             * نحاول استخدامه أولاً.
             *
             * ولو لم يوجد، نستخدم password
             * المخزنة في Firestore.
             */

            if (
                authEmail
            ) {

                const authResult =
                    await checkFirebaseAuthentication(
                        authEmail,
                        pass
                    );


                /*
                 * دخول Firebase ناجح
                 *
                 * لكن ما زال role = student
                 * لذلك يذهب إلى home.html
                 */

                if (
                    authResult.authenticated === true
                ) {

                    /*
                     * تنظيف أي جلسة أدمن قديمة
                     */

                    localStorage.removeItem(
                        "sessionToken"
                    );


                    localStorage.removeItem(
                        "adminName"
                    );


                    saveStudentSession(
                        userDoc
                    );


                    /*
                     * حفظ UID للطالب
                     */

                    if (
                        authResult.user
                    ) {

                        localStorage.setItem(
                            "firebaseUID",
                            authResult.user.uid
                        );

                    }


                    showLoader(false);


                    redirectByRole(
                        "student"
                    );


                    return;

                }


                /*
                 * Firebase موجود لكن كلمة المرور خاطئة.
                 */

                if (
                    authResult.exists === true &&
                    authResult.authenticated === false
                ) {

                    /*
                     * إذا كان الطالب لديه password
                     * في Firestore، لا نتجاوز خطأ
                     * Firebase إلا إذا كانت كلمة Firestore
                     * صحيحة.
                     */

                    const passwordCorrect =
                        checkStudentPassword(
                            userData,
                            pass
                        );


                    if (
                        !passwordCorrect
                    ) {

                        showLoader(false);

                        return showError(
                            "كلمة المرور غير صحيحة."
                        );

                    }

                }

            }


            /*
             * Firestore Student Login
             */

            const passwordCorrect =
                checkStudentPassword(
                    userData,
                    pass
                );


            if (
                !passwordCorrect
            ) {

                showLoader(false);

                return showError(
                    "كلمة المرور غير صحيحة."
                );

            }


            /*
             * حفظ جلسة الطالب
             */

            saveStudentSession(
                userDoc
            );


            showLoader(false);


            /*
             * الطالب -> home.html
             */

            redirectByRole(
                "student"
            );


            return;

        }


        /* =====================================================
           4 - لو الحساب أدمن
           
           لازم يكون موجود في Firebase Authentication.
        ===================================================== */

        if (
            role === "admin"
        ) {


            /*
             * الأدمن لازم يكون عنده إيميل.
             */

            if (
                !authEmail
            ) {

                showLoader(false);

                return showError(
                    "حساب الأدمن يحتاج إلى إيميل صالح في بيانات الحساب."
                );

            }


            /*
             * التحقق من Firebase Authentication
             */

            const authResult =
                await checkFirebaseAuthentication(
                    authEmail,
                    pass
                );


            /*
             * تسجيل دخول ناجح
             */

            if (
                authResult.authenticated === true
            ) {

                const firebaseUser =
                    authResult.user;


                /*
                 * تأكيد أخير أن role ما زال admin
                 */

                const freshDoc =
                    await db
                    .collection("users")
                    .doc(userDoc.id)
                    .get();


                if (
                    !freshDoc.exists
                ) {

                    await auth.signOut();


                    showLoader(false);

                    return showError(
                        "لم يتم العثور على بيانات الحساب."
                    );

                }


                const freshData =
                    freshDoc.data();


                const freshRole =
                    getAccountRole(
                        freshData
                    );


                /*
                 * لو تم تغيير الحساب إلى طالب
                 * أثناء تسجيل الدخول
                 */

                if (
                    freshRole !== "admin"
                ) {

                    /*
                     * تسجيل الخروج من Firebase
                     */

                    try {

                        await auth.signOut();

                    } catch(e) {

                        console.error(e);

                    }


                    saveStudentSession(
                        freshDoc
                    );


                    showLoader(false);


                    redirectByRole(
                        "student"
                    );


                    return;

                }


                /*
                 * حفظ جلسة الأدمن
                 */

                await saveAdminSession(
                    freshDoc,
                    firebaseUser
                );


                showLoader(false);


                /*
                 * الأدمن -> admin1.html
                 */

                redirectByRole(
                    "admin"
                );


                return;

            }


            /*
             * Firebase Authentication موجود
             * لكن كلمة المرور غير صحيحة
             */

            if (
                authResult.exists === true &&
                authResult.authenticated === false
            ) {

                showLoader(false);


                if (
                    authResult.error &&
                    authResult.error.code ===
                    'auth/user-disabled'
                ) {

                    return showError(
                        "🚫 تم تعطيل هذا الحساب من Firebase Authentication."
                    );

                }


                if (
                    authResult.error &&
                    authResult.error.code ===
                    'auth/too-many-requests'
                ) {

                    return showError(
                        "تم إجراء محاولات دخول كثيرة. حاول مرة أخرى بعد قليل."
                    );

                }


                return showError(
                    "بيانات دخول الأدمن غير صحيحة."
                );

            }


            /*
             * أدمن موجود في Firestore فقط
             * وليس في Authentication.
             *
             * لا نسمح له بالدخول.
             */

            showLoader(false);


            return showError(
                "حساب الأدمن غير مرتبط بـ Firebase Authentication."
            );

        }


        /* =====================================================
           5 - حماية إضافية
        ===================================================== */

        showLoader(false);


        return showError(
            "نوع الحساب غير معروف."
        );


    }
    catch (e) {


        console.error(
            "Firebase Login Error:",
            e
        );


        showLoader(false);


        switch (
            e.code
        ) {


            case 'auth/invalid-email':

                showError(
                    "صيغة الإيميل غير صحيحة."
                );

                break;


            case 'auth/wrong-password':

                showError(
                    "كلمة المرور غير صحيحة."
                );

                break;


            case 'auth/invalid-credential':

                showError(
                    "بيانات الدخول غير صحيحة."
                );

                break;


            case 'auth/user-disabled':

                showError(
                    "🚫 تم تعطيل هذا الحساب."
                );

                break;


            case 'auth/too-many-requests':

                showError(
                    "تم إجراء محاولات دخول كثيرة. حاول مرة أخرى بعد قليل."
                );

                break;


            case 'auth/network-request-failed':

                showError(
                    "تعذر الاتصال بالإنترنت. تأكد من الاتصال وحاول مرة أخرى."
                );

                break;


            case 'permission-denied':

                showError(
                    "ليس لديك صلاحية للوصول إلى بيانات المستخدم."
                );

                break;


            default:

                showError(
                    "حدث خطأ أثناء تسجيل الدخول: " +
                    (
                        e.message ||
                        "خطأ غير معروف."
                    )
                );

                break;

        }

    }

}



/* =========================================================
   عرض رسالة الخطأ
========================================================= */

function showError(
    msg
) {

    const err =
        document.getElementById(
            'errorArea'
        );


    err.innerText =
        msg;


    err.style.display =
        'block';

}

   Loader
========================================================= */

function showLoader(
    show
) {

    document.getElementById(

    )
    .style
    .display =
        show
            ? 'flex'
            : 'none';

}



/* =========================================================
   فحص الجلسة القديمة
========================================================= */

async function checkOldAdminSession() {

    const email =
        localStorage.getItem(
            "userEmail"
        );


    const token =
        localStorage.getItem(
            "sessionToken"
        );


    /*
     * لا توجد جلسة
     */

    if (
        !email ||
        !token
    ) {

        return false;

    }


    try {


        const snap =
            await db
            .collection("users")
            .where(
                "email",
                "==",
                email
            )
            .limit(1)
            .get();


        if (
            snap.empty
        ) {

            return false;

        }


        const userDoc =
            snap.docs[0];


        const data =
            userDoc.data();


        /*
         * التحقق من role
         */

        const role =
            getAccountRole(
                data
            );


        /*
         * الجلسة القديمة لا تعمل
         * إلا لو الحساب أدمن فعلاً.
         */

        if (
            role !== "admin"
        ) {

            /*
             * تنظيف جلسة أدمن قديمة
             */

            localStorage.removeItem(
                "sessionToken"
            );


            localStorage.removeItem(
                "adminName"
            );


            return false;

        }


        /*
         * الحساب معطل
         */

        if (
            data.status === 'inactive' ||
            data.status === 'banned'
        ) {

            localStorage.removeItem(
                "sessionToken"
            );


            return false;

        }


        /*
         * التحقق من Session Token
         */

        if (
            data.lastSessionToken !==
            token
        ) {

            return false;

        }


        /*
         * الجلسة صحيحة
         */

        localStorage.setItem(
            "accountType",
            "admin"
        );


        localStorage.setItem(
            "accountId",
            userDoc.id
        );


        return true;

    }
    catch (error) {

        console.error(
            "Old session error:",
            error
        );


        return false;

    }

}



/* =========================================================
   التحقق من جلسة Firebase الحالية
========================================================= */

async function checkCurrentFirebaseUser() {

    const currentUser =
        auth.currentUser;


    /*
     * لا يوجد مستخدم
     */

    if (
        !currentUser
    ) {

        return false;

    }


    try {


        /*
         * البحث عن المستخدم
         */

        const snap =
            await db
            .collection("users")
            .where(
                "email",
                "==",
                currentUser.email
            )
            .limit(1)
            .get();


        /*
         * Firebase فقط بدون Firestore
         */

        if (
            snap.empty
        ) {

            await auth.signOut();


            return false;

        }


        const userDoc =
            snap.docs[0];


        const data =
            userDoc.data();


        /*
         * فحص الحالة
         */

        if (
            data.status === 'inactive' ||
            data.status === 'banned'
        ) {

            await auth.signOut();


            localStorage.removeItem(
                "accountType"
            );


            localStorage.removeItem(
                "sessionToken"
            );


            return false;

        }


        /*
         * قراءة role الحقيقي
         */

        const role =
            getAccountRole(
                data
            );


        console.log(
            "Current Firebase Role:",
            role
        );


        /* =====================================================
           Firebase User + Student
           
           يدخل home.html
        ===================================================== */

        if (
            role === "student"
        ) {

            /*
             * تنظيف بيانات الأدمن
             */

            localStorage.removeItem(
                "sessionToken"
            );


            localStorage.removeItem(
                "adminName"
            );


            saveStudentSession(
                userDoc
            );


            localStorage.setItem(
                "firebaseUID",
                currentUser.uid
            );


            /*
             * الطالب
             */

            window.location.replace(
                "home.html"
            );


            return true;

        }


        /* =====================================================
           Firebase User + Admin
           
           يدخل admin1.html
        ===================================================== */

        if (
            role === "admin"
        ) {

            /*
             * حفظ بيانات الأدمن
             */

            localStorage.setItem(
                "userEmail",
                currentUser.email
            );


            localStorage.setItem(
                "firebaseUID",
                currentUser.uid
            );


            localStorage.setItem(
                "accountId",
                userDoc.id
            );


            localStorage.setItem(
                "accountType",
                "admin"
            );


            if (
                data.name
            ) {

                localStorage.setItem(
                    "adminName",
                    data.name
                );

            }


            /*
             * مهم:
             * إذا لم يكن هناك sessionToken،
             * لا ننشئ واحداً من مجرد وجود
             * Firebase Authentication.
             *
             * لكن يسمح بالدخول لأن Firebase
             * Authentication صالح والـ role admin.
             */

            window.location.replace(
                "admin1.html"
            );


            return true;

        }


        /*
         * نوع غير معروف
         */

        await auth.signOut();


        return false;

    }
    catch (error) {

        console.error(
            "Current Firebase user check failed:",
            error
        );


        return false;

    }

}

window.onload = async function() {


    /*
     * وقت شاشة البداية
     */

    setTimeout(
        async function() {


            try {


                /* =================================================
                   1
                   فحص Firebase Authentication الحالي
                ================================================= */

                const firebaseRedirected =
                    await checkCurrentFirebaseUser();


                if (
                    firebaseRedirected
                ) {

                    return;

                }


                /* =================================================
                   2

};
