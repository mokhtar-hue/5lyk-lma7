<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>تسجيل الدخول | منصة المستشار حازم سالم التعليمية</title>
    <meta name="description" content="سجل دخولك الآن إلى منصة المستشار حازم سالم، المنصة التعليمية الرائدة في محافظة الدقهلية والمنصورة. تابع دروسك وامتحاناتك بأحدث التقنيات.">
    <meta name="keywords" content="منصة المستشار حازم سالم, تسجيل دخول المستشار, حازم سالم, امتحانات الدقهلية, المنصورة تعليم, المستشار">
    <meta name="author" content="المستشار حازم سالم">
    <meta name="geo.region" content="EG-DK">
    <meta name="geo.placename" content="Mansoura">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #6366f1; --bg: #f8fafc; --card: #ffffff;
            --text: #1e293b; --input: #f1f5f9; --accent: #4f46e5;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --input: #334155;
        }

        body {
            font-family: 'Cairo', sans-serif; background-color: var(--bg);
            color: var(--text); margin: 0; display: flex; justify-content: center;
            align-items: center; min-height: 100vh; overflow: hidden; transition: 0.5s;
        }

        /* Loading Spinner */
        #loader {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9);
            display: none; justify-content: center; align-items: center;
            z-index: 9999; backdrop-filter: blur(10px);
        }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary); border-radius: 50%;
            animation: rotate 0.8s linear infinite;
        }

        .login-card {
            background: var(--card); padding: 40px; border-radius: 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%; max-width: 420px; text-align: center;
            border: 1px solid rgba(255,255,255,0.05); animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes rotate { to { transform: rotate(360deg); } }

        .welcome-title { font-size: 28px; font-weight: 900; color: var(--primary); margin-bottom: 5px; }
        .welcome-sub { color: #94a3b8; font-weight: 600; margin-bottom: 30px; font-size: 14px; }

        .input-box { margin-bottom: 20px; text-align: right; }
        .input-box label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; color: #64748b; padding-right: 5px; }
        
        .field { position: relative; display: flex; align-items: center; }
        .field input {
            width: 100%; padding: 15px 20px; border-radius: 18px; border: 2px solid transparent;
            background: var(--input); color: var(--text); font-family: 'Cairo';
            font-size: 16px; transition: 0.3s; outline: none;
        }
        .field input:focus { border-color: var(--primary); background: var(--card); box-shadow: 0 0 20px rgba(99, 102, 241, 0.15); }

        .login-btn {
            width: 100%; padding: 16px; border: none; border-radius: 20px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; font-weight: 800; font-size: 18px; cursor: pointer;
            transition: 0.3s; margin-top: 10px; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.4); }

        .status-overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 10000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; animation: fadeIn 0.4s;
        }

        .theme-toggle { position: absolute; top: 20px; left: 20px; cursor: pointer; font-size: 24px; border: none; background: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body data-theme="dark">

<button class="theme-toggle" onclick="toggleTheme()">🌙</button>

<div id="loader"><div class="spinner"></div></div>

<div id="statusOverlay" class="status-overlay">
    <div id="statusIcon" style="font-size: 80px; margin-bottom: 20px;"></div>
    <h2 id="statusTitle" style="font-weight: 900; margin-bottom: 10px;"></h2>
    <p id="statusDesc" style="color: #94a3b8; max-width: 300px; line-height: 1.8;"></p>
    <button class="login-btn" style="max-width: 200px; margin-top: 25px;" onclick="closeOverlay()">إغلاق</button>
</div>

<div class="login-card">
    <div class="welcome-title" id="greeting">صباح الخير</div>
    <div class="welcome-sub">مرحباً بك في منصة المستشار حازم سالم ⚖️</div>

    <div class="input-box">
        <label>البريد الإلكتروني</label>
        <div class="field"><input type="email" id="email" placeholder="example@mail.com" dir="ltr"></div>
    </div>

    <div class="input-box">
        <label>كلمة المرور</label>
        <div class="field"><input type="password" id="pass" placeholder="••••••••" dir="ltr"></div>
    </div>

    <button class="login-btn" onclick="handleLogin()">دخول النظام</button>
    
    <p style="margin-top: 25px; font-size: 12px; color: #64748b; font-weight: 600;">
        <i class="fas fa-shield-alt"></i> نظام الوصول الذكي - محافظة الدقهلية
    </p>
</div>

<script>
    // إعدادات Firebase
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // إدارة التحية حسب الوقت
    const hr = new Date().getHours();
    document.getElementById('greeting').innerText = hr < 12 ? "صباح الخير يا بطل ☀️" : "مساء الخير يا بطل 🌙";

    // تفعيل فحص الجلسة عند فتح الصفحة
    window.onload = checkExistingSession;

    async function handleLogin() {
        const email = document.getElementById('email').value.trim().toLowerCase();
        const pass = document.getElementById('pass').value.trim();

        if(!email || !pass) return alert("من فضلك ادخل بياناتك");

        showLoader(true);

        try {
            const snap = await db.collection("users").where("email", "==", email).get();
            
            if(snap.empty) {
                showLoader(false);
                return alert("الحساب غير مسجل بالنظام!");
            }

            const userDoc = snap.docs[0];
            const userData = userDoc.data();

            if(userData.password !== pass) {
                showLoader(false);
                return alert("كلمة المرور غير صحيحة!");
            }

            if(userData.status === "banned") {
                showLoader(false);
                return showStatus("🚫", "حسابك معطل", userData.banReason || "يرجى مراجعة المستشار حازم سالم.");
            }

            // إنشاء توكن فريد للجلسة (يمنع فتح الحساب من مكانين)
            const sessionToken = Date.now().toString();
            await db.collection("users").doc(userDoc.id).update({
                lastSessionToken: sessionToken,
                lastLogin: new Date().toISOString()
            });

            // حفظ البيانات محلياً
            localStorage.setItem("userEmail", email);
            localStorage.setItem("userName", userData.name);
            localStorage.setItem("sessionToken", sessionToken);

            showStatus("✅", "تم تسجيل الدخول", "جارٍ تحويلك إلى ساحة المستشار...");
            
            setTimeout(() => {
                window.location.href = "home.html";
            }, 2000);

        } catch (e) {
            showLoader(false);
            alert("خطأ في الاتصال بالشبكة!");
        }
    }

    // وظيفة فحص الجلسة (الطرد التلقائي)
    async function checkExistingSession() {
        const localToken = localStorage.getItem("sessionToken");
        const email = localStorage.getItem("userEmail");

        if(localToken && email) {
            const snap = await db.collection("users").where("email", "==", email).get();
            if(!snap.empty) {
                const cloudToken = snap.docs[0].data().lastSessionToken;
                if(localToken !== cloudToken) {
                    localStorage.clear();
                    showStatus("⚠️", "تنبيه أمني", "تم تسجيل الدخول من جهاز آخر، تم تسجيل خروجك لحماية حسابك.");
                } else {
                    // إذا كان التوكن سليم، وجهه للرئيسية فوراً دون تسجيل دخول مجدد
                    window.location.href = "home.html";
                }
            }
        }
    }

    function showStatus(icon, title, desc) {
        const over = document.getElementById('statusOverlay');
        document.getElementById('statusIcon').innerText = icon;
        document.getElementById('statusTitle').innerText = title;
        document.getElementById('statusDesc').innerText = desc;
        over.style.display = 'flex';
    }

    function closeOverlay() {
        document.getElementById('statusOverlay').style.display = 'none';
    }

    function showLoader(show) {
        document.getElementById('loader').style.display = show ? 'flex' : 'none';
    }

    function toggleTheme() {
        const b = document.body;
        const current = b.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        b.setAttribute('data-theme', next);
        document.querySelector('.theme-toggle').innerText = next === 'dark' ? "🌙" : "☀️";
    }
</script>

</body>
</html>
