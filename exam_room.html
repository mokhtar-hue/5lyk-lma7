<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة الاختبار</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #d4af37; --bg: #0a0f1c; --card: #141e30; --text: #e2e8f0; --accent: #10b981; --danger: #ef4444; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; user-select: none; }
        .glass-panel { background: rgba(20, 30, 48, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .container { max-width: 800px; margin: 50px auto; padding: 20px; }
        
        /* شاشة تسجيل الدخول */
        #loginScreen { text-align: center; }
        .input-group input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; font-family: 'Cairo'; font-size: 16px; box-sizing: border-box; }
        .btn-gold { background: linear-gradient(45deg, #b8860b, #ffd700); color: #000; border: none; padding: 15px 30px; border-radius: 12px; font-weight: 900; font-size: 18px; cursor: pointer; width: 100%; margin-top: 15px; font-family: 'Cairo'; }
        
        /* شريط الاختبار */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 15px 20px; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 100; }
        .timer { font-size: 24px; font-weight: 900; color: var(--primary); }
        
        /* الأسئلة */
        .q-img { max-width: 100%; border-radius: 12px; margin-bottom: 15px; border: 2px solid #334155; }
        .q-text { font-size: 22px; font-weight: 700; margin-bottom: 25px; line-height: 1.6; color: #fff; }
        .opt-btn { background: #1e293b; border: 2px solid #334155; padding: 15px; border-radius: 12px; cursor: pointer; text-align: right; color: #cbd5e1; margin-bottom: 12px; font-size: 18px; transition: 0.2s; font-family: 'Cairo'; display: block; width: 100%; box-sizing: border-box; }
        .opt-btn.active { background: rgba(212, 175, 55, 0.2); border-color: var(--primary); color: var(--primary); }
        textarea.essay { width: 100%; height: 150px; background: #0f172a; border: 2px solid #334155; color: white; border-radius: 12px; padding: 15px; font-size: 16px; font-family: 'Cairo'; box-sizing: border-box; resize: vertical; }
        
        .nav-btns { display: flex; justify-content: space-between; margin-top: 30px; }
        .nav-btns button { padding: 12px 25px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-family: 'Cairo'; font-size: 16px; }
        .btn-prev { background: #334155; color: white; }
        
        /* منع النسخ والتحديد */
        * { -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        input, textarea { -webkit-user-select: text; user-select: text; }
    </style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div class="container" id="loginArea">
    <div class="glass-panel" id="loginScreen">
        <h2 style="color: var(--primary);">تسجيل دخول الاختبار</h2>
        <p id="examTitleLabel">جاري تحميل الاختبار...</p>
        <div class="input-group">
            <input type="text" id="username" placeholder="اسم المستخدم (User)">
            <input type="password" id="password" placeholder="كلمة المرور (Password)">
        </div>
        <button class="btn-gold" onclick="loginToExam()">دخول وبدء الاختبار</button>
    </div>
</div>

<!-- منطقة الاختبار -->
<div id="examArea" style="display: none;">
    <div class="top-bar">
        <div><i class="fas fa-user"></i> <span id="studentNameTop"></span></div>
        <div class="timer" id="timerDisplay">00:00</div>
    </div>
    <div class="container">
        <div class="glass-panel">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px; color:#94a3b8;">
                <span id="qCount"></span>
                <span id="qPoints" style="color: var(--primary); font-weight:bold;"></span>
            </div>
            <div id="qContent"></div>
            
            <div class="nav-btns">
                <button class="btn-prev" onclick="prevQ()">السابق</button>
                <button class="btn-gold" style="width: auto; margin:0;" id="nextBtn" onclick="nextQ()">التالي</button>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", authDomain: "zomaapp-744fc.firebaseapp.com", projectId: "zomaapp-744fc" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const quizId = urlParams.get('id');
    
    let currentQuiz = null;
    let loggedStudent = null;
    let questions = [];
    let studentAnswers = [];
    let currentIdx = 0;
    let timerInterval;
    let timeLeft = 0;
    let sessionId = null;
    let isSubmitted = false;

    // منع اختصارات الكيبورد والنسخ
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73) || (e.ctrlKey && e.keyCode == 67)) { return false; }
    };

    // نظام مانع الغش (إذا خرج من الصفحة)
    document.addEventListener("visibilitychange", () => {
        if (document.hidden && loggedStudent && !isSubmitted) {
            Swal.fire('تحذير غش!', 'تم اكتشاف خروجك من صفحة الاختبار. سيتم تسليم إجاباتك فوراً.', 'error');
            submitExam(true);
        }
    });

    window.onload = async () => {
        if(!quizId) return document.body.innerHTML = "<h2 style='text-align:center;color:red;margin-top:50px'>رابط غير صالح</h2>";
        const doc = await db.collection("quizzes2").doc(quizId).get();
        if(!doc.exists) return document.body.innerHTML = "<h2 style='text-align:center;color:red;margin-top:50px'>الاختبار غير موجود</h2>";
        currentQuiz = doc.data();
        
        if(currentQuiz.status === 'closed') {
            document.body.innerHTML = "<h2 style='text-align:center;color:red;margin-top:50px'>هذا الاختبار مغلق حالياً</h2>";
            return;
        }
        document.getElementById('examTitleLabel').innerText = currentQuiz.title;
    };

    async function loginToExam() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if(!u || !p) return Swal.fire('خطأ', 'أدخل البيانات', 'error');

        // البحث في قائمة الطلاب المسموح لهم
        const student = currentQuiz.students.find(s => s.username === u && s.password === p);
        if(!student) return Swal.fire('خطأ', 'بيانات الدخول غير صحيحة أو غير مصرح لك', 'error');

        // التحقق مما إذا كان قد اختبر سابقاً (لو الإعادة ممنوعة)
        if(!currentQuiz.allowRetake) {
            const prev = await db.collection("results2").where("quizId","==",quizId).where("username","==",u).get();
            if(!prev.empty) return Swal.fire('تنبيه', 'لقد قمت بأداء هذا الاختبار مسبقاً', 'warning');
        }

        loggedStudent = student;
        questions = currentQuiz.questions;
        studentAnswers = new Array(questions.length).fill(null);
        timeLeft = currentQuiz.duration * 60;

        // تسجيل الدخول في الجلسات الحية للمراقبة
        const sessionRef = await db.collection("live_sessions2").add({
            quizId: quizId,
            username: u,
            name: student.name,
            startTime: firebase.firestore.FieldValue.serverTimestamp(),
            status: "testing"
        });
        sessionId = sessionRef.id;

        // مراقبة لو الأدمن عمل طرد
        db.collection("live_sessions2").doc(sessionId).onSnapshot(doc => {
            if(doc.data() && doc.data().status === "kicked" && !isSubmitted) {
                Swal.fire('تنبيه', 'تم إنهاء جلستك من قبل المراقب', 'error');
                submitExam(true);
            }
        });

        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('examArea').style.display = 'block';
        document.getElementById('studentNameTop').innerText = student.name;
        
        renderQuestion();
        startTimer();
    }

    function renderQuestion() {
        const q = questions[currentIdx];
        document.getElementById('qCount').innerText = `السؤال ${currentIdx + 1} / ${questions.length}`;
        document.getElementById('qPoints').innerText = `${q.points} درجات`;
        
        let html = ``;
        if(q.imgUrl) html += `<img src="${q.imgUrl}" class="q-img">`;
        html += `<div class="q-text">${q.text}</div>`;

        if(q.type === 'essay') {
            html += `<textarea class="essay" placeholder="اكتب إجابتك هنا..." oninput="saveAnswer(this.value)">${studentAnswers[currentIdx] || ''}</textarea>`;
        } else {
            q.options.forEach((opt, i) => {
                const active = studentAnswers[currentIdx] === i ? 'active' : '';
                html += `<button class="opt-btn ${active}" onclick="saveAnswer(${i})">${opt}</button>`;
            });
        }
        document.getElementById('qContent').innerHTML = html;

        const btn = document.getElementById('nextBtn');
        if(currentIdx === questions.length - 1) {
            btn.innerText = "تسليم الاختبار";
            btn.style.background = "var(--accent)";
            btn.onclick = () => submitExam(false);
        } else {
            btn.innerText = "التالي";
            btn.style.background = "linear-gradient(45deg, #b8860b, #ffd700)";
            btn.onclick = nextQ;
        }
    }

    function saveAnswer(val) {
        studentAnswers[currentIdx] = val;
        if(questions[currentIdx].type === 'mcq') renderQuestion(); // لتحديث اللون
    }

    function nextQ() { if(currentIdx < questions.length - 1) { currentIdx++; renderQuestion(); } }
    function prevQ() { if(currentIdx > 0) { currentIdx--; renderQuestion(); } }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60); let s = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            if(timeLeft <= 0) submitExam(true);
        }, 1000);
    }

    async function submitExam(isForced = false) {
        if(isSubmitted) return;
        if(!isForced && !confirm("هل أنت متأكد من تسليم الإجابات النهائية؟")) return;
        
        isSubmitted = true;
        clearInterval(timerInterval);
        Swal.fire({title: 'جاري الحفظ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

        let score = 0;
        let maxScore = 0;
        let hasEssay = false;

        const answersData = questions.map((q, i) => {
            maxScore += parseInt(q.points);
            let earned = 0;
            let ans = studentAnswers[i];
            let isCorrect = false;

            if(q.type === 'mcq') {
                if(ans === parseInt(q.correctIndex)) { earned = parseInt(q.points); score += earned; isCorrect = true; }
                ans = ans !== null ? q.options[ans] : "لم يجب";
            } else {
                hasEssay = true;
                ans = ans || "لم يجب";
            }

            return { qIndex: i, text: q.text, type: q.type, studentAns: ans, correctAns: q.type==='mcq' ? q.options[q.correctIndex] : "يصحح يدوياً", pointsEarned: earned, maxPoints: parseInt(q.points), isCorrect: isCorrect, remark: "" };
        });

        const resultDoc = {
            quizId: quizId,
            quizTitle: currentQuiz.title,
            username: loggedStudent.username,
            name: loggedStudent.name,
            score: score,
            maxScore: maxScore,
            isGraded: !hasEssay, // لو مفيش مقالي يبقى اتصحح بالكامل
            answers: answersData,
            cheatAttempt: isForced && timeLeft > 0,
            submittedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        await db.collection("results2").add(resultDoc);
        if(sessionId) await db.collection("live_sessions2").doc(sessionId).update({ status: "submitted" });

        // التحقق من الهدايا (Rewards)
        let percent = (score / maxScore) * 100;
        let rewardMsg = null;
        if(currentQuiz.rewards && currentQuiz.showResults) {
            // ترتيب تنازلي وإيجاد أول جائزة يستحقها
            const sortedRewards = currentQuiz.rewards.sort((a,b) => b.minScore - a.minScore);
            const wonReward = sortedRewards.find(r => percent >= parseInt(r.minScore));
            if(wonReward) rewardMsg = wonReward.rewardText;
        }

        if(currentQuiz.showResults) {
            if(rewardMsg) {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                Swal.fire({ icon: 'success', title: 'مبارك!', html: `<h3>نتيجتك: ${score} / ${maxScore}</h3><br><h2 style="color:#d4af37">🎁 هديتك: ${rewardMsg}</h2>`, confirmButtonText: 'خروج' }).then(()=> window.close());
            } else {
                Swal.fire('تم التسليم', `نتيجتك: ${score} / ${maxScore} ${hasEssay ? '<br>(يوجد أسئلة مقالية بانتظار تصحيح المستشار)' : ''}`, 'success').then(()=> window.close());
            }
        } else {
            Swal.fire('تم التسليم', 'تم حفظ إجاباتك بنجاح. النتيجة محجوبة حالياً.', 'success').then(()=> window.close());
        }
    }
</script>
</body>
</html>
