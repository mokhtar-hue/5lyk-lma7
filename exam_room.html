<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>غرفة الاختبار</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <style>

        :root {

            --primary: #d4af37;
            --primary-light: #ffd700;

            --bg: #070b14;
            --card: #111827;
            --card2: #182235;

            --text: #e2e8f0;
            --muted: #94a3b8;

            --accent: #10b981;
            --danger: #ef4444;
            --blue: #3b82f6;

        }


        * {

            box-sizing: border-box;

            -webkit-touch-callout: none;

            -webkit-user-select: none;

            -moz-user-select: none;

            user-select: none;

        }


        input,
        textarea {

            -webkit-user-select: text;

            user-select: text;

        }


        html,
        body {

            margin: 0;

            padding: 0;

            min-height: 100%;

        }


        body {

            font-family: 'Cairo', sans-serif;

            background:

                radial-gradient(
                    circle at top right,
                    rgba(212,175,55,0.12),
                    transparent 35%
                ),

                radial-gradient(
                    circle at bottom left,
                    rgba(59,130,246,0.08),
                    transparent 35%
                ),

                var(--bg);

            color: var(--text);

            overflow-x: hidden;

        }


        /* =========================
           CONTAINER
        ========================== */

        .container {

            max-width: 850px;

            margin: 45px auto;

            padding: 20px;

        }


        /* =========================
           GLASS PANEL
        ========================== */

        .glass-panel {

            background: rgba(17, 24, 39, 0.92);

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255,255,255,0.07);

            border-radius: 24px;

            padding: 30px;

            box-shadow:

                0 25px 60px rgba(0,0,0,0.45),

                inset 0 1px 0 rgba(255,255,255,0.03);

        }


        /* =========================
           LOGIN
        ========================== */

        #loginScreen {

            text-align: center;

        }


        .login-icon {

            width: 85px;

            height: 85px;

            margin: 0 auto 20px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 38px;

            color: #111;

            background:

                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-light)
                );

            box-shadow:

                0 10px 35px rgba(212,175,55,0.25);

        }


        .login-title {

            color: var(--primary);

            font-size: 27px;

            font-weight: 900;

            margin: 0 0 8px;

        }


        .exam-title {

            color: #fff;

            font-size: 19px;

            font-weight: 700;

            margin-bottom: 25px;

        }


        .input-group {

            margin-top: 20px;

        }


        .input-group input {

            width: 100%;

            padding: 16px 18px;

            margin: 8px 0;

            border-radius: 13px;

            border: 1px solid #334155;

            outline: none;

            background: #0b1220;

            color: white;

            font-family: 'Cairo';

            font-size: 16px;

            transition: .2s;

        }


        .input-group input:focus {

            border-color: var(--primary);

            box-shadow:

                0 0 0 3px rgba(212,175,55,0.10);

        }


        .btn-gold {

            background:

                linear-gradient(
                    135deg,
                    #b8860b,
                    #ffd700
                );

            color: #050505;

            border: none;

            padding: 15px 30px;

            border-radius: 13px;

            font-weight: 900;

            font-size: 17px;

            cursor: pointer;

            width: 100%;

            margin-top: 15px;

            font-family: 'Cairo';

            transition: .2s;

        }


        .btn-gold:hover {

            transform: translateY(-2px);

            box-shadow:

                0 10px 25px rgba(212,175,55,0.25);

        }


        /* =========================
           TOP BAR
        ========================== */

        .top-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            background:

                rgba(17,24,39,0.96);

            padding: 15px 22px;

            border-bottom: 2px solid var(--primary);

            position: sticky;

            top: 0;

            z-index: 100;

            box-shadow:

                0 8px 30px rgba(0,0,0,0.25);

        }


        .student-top {

            display: flex;

            align-items: center;

            gap: 10px;

            font-weight: 800;

            color: #fff;

        }


        .student-top i {

            color: var(--primary);

        }


        .timer-box {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .timer-box i {

            color: var(--primary);

        }


        .timer {

            font-size: 24px;

            font-weight: 900;

            color: var(--primary);

            direction: ltr;

        }


        /* =========================
           QUESTIONS
        ========================== */

        .question-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            margin-bottom: 25px;

            color: var(--muted);

            font-weight: 700;

        }


        #qPoints {

            color: var(--primary);

        }


        .q-img {

            max-width: 100%;

            display: block;

            margin: 0 auto 20px;

            border-radius: 14px;

            border: 2px solid #334155;

        }


        .q-text {

            font-size: 22px;

            font-weight: 800;

            margin-bottom: 25px;

            line-height: 1.8;

            color: #fff;

        }


        .opt-btn {

            background: #182235;

            border: 2px solid #334155;

            padding: 16px;

            border-radius: 13px;

            cursor: pointer;

            text-align: right;

            color: #cbd5e1;

            margin-bottom: 12px;

            font-size: 17px;

            transition: .2s;

            font-family: 'Cairo';

            display: block;

            width: 100%;

        }


        .opt-btn:hover {

            border-color: rgba(212,175,55,.7);

        }


        .opt-btn.active {

            background:

                rgba(212,175,55,0.14);

            border-color: var(--primary);

            color: var(--primary);

        }


        textarea.essay {

            width: 100%;

            height: 160px;

            background: #0b1220;

            border: 2px solid #334155;

            color: white;

            border-radius: 13px;

            padding: 15px;

            font-size: 16px;

            font-family: 'Cairo';

            resize: vertical;

            outline: none;

        }


        textarea.essay:focus {

            border-color: var(--primary);

        }


        /* =========================
           NAV BUTTONS
        ========================== */

        .nav-btns {

            display: flex;

            justify-content: space-between;

            gap: 12px;

            margin-top: 30px;

        }


        .nav-btns button {

            padding: 13px 25px;

            border-radius: 11px;

            border: none;

            font-weight: 800;

            cursor: pointer;

            font-family: 'Cairo';

            font-size: 16px;

        }


        .btn-prev {

            background: #334155;

            color: white;

        }


        .btn-prev:hover {

            background: #475569;

        }


        /* =========================
           RESULT SCREEN
        ========================== */

        #resultArea {

            display: none;

        }


        .result-panel {

            text-align: center;

            overflow: hidden;

            position: relative;

        }


        .result-icon {

            width: 95px;

            height: 95px;

            border-radius: 50%;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 42px;

            color: white;

            background:

                linear-gradient(
                    135deg,
                    #059669,
                    #10b981
                );

            box-shadow:

                0 15px 40px rgba(16,185,129,.22);

        }


        .result-icon.waiting {

            background:

                linear-gradient(
                    135deg,
                    #b8860b,
                    #ffd700
                );

            color: #111;

        }


        .result-title {

            font-size: 28px;

            font-weight: 900;

            color: #fff;

            margin-bottom: 5px;

        }


        .result-subtitle {

            color: var(--muted);

            font-size: 16px;

            margin-bottom: 25px;

        }


        .student-result-name {

            background:

                linear-gradient(
                    135deg,
                    rgba(212,175,55,.15),
                    rgba(255,255,255,.03)
                );

            border: 1px solid rgba(212,175,55,.25);

            padding: 15px;

            border-radius: 15px;

            margin-bottom: 20px;

            font-size: 19px;

            font-weight: 800;

        }


        .student-result-name i {

            color: var(--primary);

            margin-left: 7px;

        }


        .score-card {

            background: #0b1220;

            border: 1px solid #263449;

            border-radius: 20px;

            padding: 25px;

            margin: 20px 0;

        }


        .score-label {

            color: var(--muted);

            font-size: 15px;

            margin-bottom: 8px;

        }


        .score-value {

            font-size: 45px;

            font-weight: 900;

            color: var(--primary);

            direction: ltr;

        }


        .score-percent {

            margin-top: 5px;

            color: #cbd5e1;

            font-size: 17px;

            font-weight: 700;

        }


        .reward-card {

            margin-top: 20px;

            padding: 20px;

            border-radius: 17px;

            background:

                linear-gradient(
                    135deg,
                    rgba(212,175,55,.17),
                    rgba(255,215,0,.04)
                );

            border: 1px solid rgba(212,175,55,.35);

        }


        .reward-title {

            color: var(--primary);

            font-weight: 900;

            font-size: 18px;

        }


        .reward-text {

            margin-top: 8px;

            color: #fff;

            font-size: 21px;

            font-weight: 900;

        }


        .waiting-message {

            margin-top: 20px;

            padding: 18px;

            border-radius: 15px;

            background: rgba(245,158,11,.08);

            border: 1px solid rgba(245,158,11,.25);

            color: #fbbf24;

            font-weight: 700;

        }


        .exit-btn {

            margin-top: 25px;

            background: #334155;

            color: white;

            border: none;

            padding: 13px 35px;

            border-radius: 12px;

            font-family: 'Cairo';

            font-weight: 800;

            font-size: 16px;

            cursor: pointer;

        }


        .exit-btn:hover {

            background: #475569;

        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media(max-width:600px) {

            .container {

                margin: 20px auto;

                padding: 12px;

            }


            .glass-panel {

                padding: 20px;

                border-radius: 18px;

            }


            .top-bar {

                padding: 12px;

            }


            .student-top {

                font-size: 13px;

                max-width: 60%;

            }


            .timer {

                font-size: 20px;

            }


            .q-text {

                font-size: 19px;

            }


            .opt-btn {

                font-size: 16px;

                padding: 14px;

            }


            .result-title {

                font-size: 24px;

            }


            .score-value {

                font-size: 38px;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     LOGIN AREA
====================================================== -->

<div class="container" id="loginArea">

    <div class="glass-panel" id="loginScreen">

        <div class="login-icon">

            <i class="fas fa-file-pen"></i>

        </div>


        <h2 class="login-title">

            تسجيل دخول الاختبار

        </h2>


        <div class="exam-title"
             id="examTitleLabel">

            جاري تحميل الاختبار...

        </div>


        <div class="input-group">

            <input
                type="text"
                id="username"
                placeholder="اسم المستخدم (User)"
                autocomplete="off">


            <input
                type="password"
                id="password"
                placeholder="كلمة المرور (Password)"
                autocomplete="off">

        </div>


        <button
            class="btn-gold"
            onclick="loginToExam()">

            <i class="fas fa-right-to-bracket"></i>

            دخول وبدء الاختبار

        </button>

    </div>

</div>



<!-- =====================================================
     EXAM AREA
====================================================== -->

<div id="examArea"
     style="display:none;">

    <div class="top-bar">

        <div class="student-top">

            <i class="fas fa-user-circle"></i>

            <span id="studentNameTop"></span>

        </div>


        <div class="timer-box">

            <i class="fas fa-clock"></i>

            <div
                class="timer"
                id="timerDisplay">

                00:00

            </div>

        </div>

    </div>


    <div class="container">

        <div class="glass-panel">

            <div class="question-header">

                <span id="qCount"></span>

                <span id="qPoints"></span>

            </div>


            <div id="qContent"></div>


            <div class="nav-btns">

                <button
                    class="btn-prev"
                    onclick="prevQ()">

                    <i class="fas fa-arrow-right"></i>

                    السابق

                </button>


                <button
                    class="btn-gold"
                    style="width:auto;margin:0;"
                    id="nextBtn"
                    onclick="nextQ()">

                    التالي

                </button>

            </div>

        </div>

    </div>

</div>



<!-- =====================================================
     RESULT AREA
====================================================== -->

<div class="container"
     id="resultArea">

    <div class="glass-panel result-panel">

        <div
            class="result-icon"
            id="resultIcon">

            <i class="fas fa-check"></i>

        </div>


        <div
            class="result-title"
            id="resultTitle">

            تم تسليم الاختبار

        </div>


        <div
            class="result-subtitle"
            id="resultSubtitle">

            تم حفظ إجاباتك بنجاح

        </div>


        <div
            class="student-result-name">

            <i class="fas fa-user"></i>

            <span id="resultStudentName"></span>

        </div>


        <div
            class="score-card"
            id="scoreCard">

            <div class="score-label">

                درجتك في الاختبار

            </div>


            <div
                class="score-value"
                id="resultScore">

                0 / 0

            </div>


            <div
                class="score-percent"
                id="resultPercent">

                0%

            </div>

        </div>


        <div
            class="reward-card"
            id="rewardCard"
            style="display:none;">

            <div class="reward-title">

                🎁 مبروك! لقد حصلت على

            </div>


            <div
                class="reward-text"
                id="rewardText">

            </div>

        </div>


        <div
            class="waiting-message"
            id="waitingMessage"
            style="display:none;">

            <i class="fas fa-hourglass-half"></i>

            توجد أسئلة مقالية بانتظار التصحيح من المستشار.

        </div>


        <button
            class="exit-btn"
            onclick="exitExam()">

            <i class="fas fa-door-open"></i>

            خروج من الاختبار

        </button>

    </div>

</div>



<script>


/* =====================================================
   FIREBASE
====================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws",

    authDomain:
        "zomaapp-744fc.firebaseapp.com",

    projectId:
        "zomaapp-744fc"

};


firebase.initializeApp(firebaseConfig);


const db = firebase.firestore();



/* =====================================================
   URL
====================================================== */

const urlParams =
    new URLSearchParams(window.location.search);


const quizId =
    urlParams.get('id');



/* =====================================================
   VARIABLES
====================================================== */

let currentQuiz = null;

let loggedStudent = null;

let questions = [];

let studentAnswers = [];

let currentIdx = 0;

let timerInterval = null;

let timeLeft = 0;

let sessionId = null;

let isSubmitted = false;

let isExiting = false;



/* =====================================================
   منع النسخ والاختصارات
====================================================== */

document.addEventListener(
    'contextmenu',
    event => event.preventDefault()
);


document.onkeydown = function(e) {

    if (

        e.keyCode === 123 ||

        (e.ctrlKey &&
         e.shiftKey &&
         e.keyCode === 73) ||

        (e.ctrlKey &&
         e.keyCode === 67)

    ) {

        e.preventDefault();

        return false;

    }

};



/* =====================================================
   منع الخروج من صفحة الاختبار
====================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if (

            document.hidden &&

            loggedStudent &&

            !isSubmitted &&

            !isExiting

        ) {

            Swal.fire({

                title: 'تحذير غش!',

                text:
                    'تم اكتشاف خروجك من صفحة الاختبار. سيتم تسليم إجاباتك فوراً.',

                icon: 'error',

                confirmButtonText: 'حسناً',

                allowOutsideClick: false

            });


            submitExam(true);

        }

    }
);



/* =====================================================
   تحميل الاختبار
====================================================== */

window.onload = async function() {

    try {

        if(!quizId) {

            showErrorPage(
                "رابط الاختبار غير صالح"
            );

            return;

        }


        const doc =
            await db
                .collection("quizzes2")
                .doc(quizId)
                .get();


        if(!doc.exists) {

            showErrorPage(
                "الاختبار غير موجود"
            );

            return;

        }


        currentQuiz =
            doc.data();


        if(currentQuiz.status === 'closed') {

            showErrorPage(
                "هذا الاختبار مغلق حالياً"
            );

            return;

        }


        document.getElementById(
            'examTitleLabel'
        ).innerText =
            currentQuiz.title || "الاختبار";


    } catch(error) {

        console.error(error);

        showErrorPage(
            "حدث خطأ أثناء تحميل الاختبار"
        );

    }

};



/* =====================================================
   LOGIN
====================================================== */

async function loginToExam() {

    const u =
        document
            .getElementById('username')
            .value
            .trim();


    const p =
        document
            .getElementById('password')
            .value;


    if(!u || !p) {

        Swal.fire(
            'خطأ',
            'أدخل اسم المستخدم وكلمة المرور',
            'error'
        );

        return;

    }


    if(!currentQuiz) {

        Swal.fire(
            'خطأ',
            'الاختبار لم يتم تحميله بعد',
            'error'
        );

        return;

    }


    const students =
        Array.isArray(currentQuiz.students)
            ? currentQuiz.students
            : [];


    const student =
        students.find(
            s =>
                String(s.username) === String(u) &&
                String(s.password) === String(p)
        );


    if(!student) {

        Swal.fire(
            'خطأ',
            'بيانات الدخول غير صحيحة أو غير مصرح لك',
            'error'
        );

        return;

    }


    /*
       =================================================
       التحقق من وجود محاولة سابقة
       =================================================
    */

    try {

        const previousResults =
            await db
                .collection("results2")
                .where(
                    "quizId",
                    "==",
                    quizId
                )
                .where(
                    "username",
                    "==",
                    u
                )
                .get();


        /*
           لو الإعادة غير مسموحة
           يتم عرض آخر نتيجة مباشرة
           ولا يدخل الطالب الاختبار
        */

        if(
            !currentQuiz.allowRetake &&
            !previousResults.empty
        ) {

            const previousResult =
                previousResults.docs[
                    previousResults.docs.length - 1
                ].data();


            loggedStudent = student;


            showPreviousResult(
                previousResult
            );


            return;

        }


        /*
           =================================================
           بدء محاولة جديدة
           =================================================
        */

        loggedStudent = student;


        questions =
            Array.isArray(currentQuiz.questions)
                ? currentQuiz.questions
                : [];


        if(questions.length === 0) {

            Swal.fire(
                'خطأ',
                'لا توجد أسئلة في هذا الاختبار',
                'error'
            );

            return;

        }


        studentAnswers =
            new Array(
                questions.length
            ).fill(null);


        timeLeft =
            parseInt(
                currentQuiz.duration
            ) * 60;


        if(!timeLeft || timeLeft < 1) {

            timeLeft = 60;

        }


        /*
           =================================================
           إنشاء جلسة مراقبة
           =================================================
        */

        const sessionRef =
            await db
                .collection("live_sessions2")
                .add({

                    quizId: quizId,

                    username: u,

                    name: student.name,

                    startTime:
                        firebase.firestore
                            .FieldValue
                            .serverTimestamp(),

                    status: "testing"

                });


        sessionId =
            sessionRef.id;


        /*
           =================================================
           مراقبة الطرد من لوحة المراقب
           =================================================
        */

        db.collection("live_sessions2")
            .doc(sessionId)
            .onSnapshot(doc => {

                const data =
                    doc.data();


                if(

                    data &&

                    data.status === "kicked" &&

                    !isSubmitted

                ) {

                    Swal.fire({

                        title:
                            'تم إنهاء الاختبار',

                        text:
                            'تم إنهاء جلستك من قبل المراقب.',

                        icon:
                            'error',

                        confirmButtonText:
                            'حسناً',

                        allowOutsideClick:
                            false

                    });


                    submitExam(true);

                }

            });


        /*
           =================================================
           إظهار الاختبار
           =================================================
        */

        document.getElementById(
            'loginArea'
        ).style.display = 'none';


        document.getElementById(
            'examArea'
        ).style.display = 'block';


        document.getElementById(
            'resultArea'
        ).style.display = 'none';


        document.getElementById(
            'studentNameTop'
        ).innerText =
            student.name;


        renderQuestion();


        startTimer();


    } catch(error) {

        console.error(error);

        Swal.fire(
            'خطأ',
            'حدث خطأ أثناء تسجيل الدخول',
            'error'
        );

    }

}



/* =====================================================
   عرض السؤال
====================================================== */

function renderQuestion() {

    const q =
        questions[currentIdx];


    if(!q) return;


    document.getElementById(
        'qCount'
    ).innerText =
        `السؤال ${currentIdx + 1} / ${questions.length}`;


    document.getElementById(
        'qPoints'
    ).innerText =
        `${q.points || 0} درجات`;


    let html = "";


    if(q.imgUrl) {

        html += `

            <img

                src="${escapeHtml(q.imgUrl)}"

                class="q-img"

                alt="صورة السؤال"

            >

        `;

    }


    html += `

        <div class="q-text">

            ${q.text || ""}

        </div>

    `;


    /*
       =================================================
       Essay
       =================================================
    */

    if(q.type === 'essay') {

        html += `

            <textarea

                class="essay"

                placeholder="اكتب إجابتك هنا..."

                oninput="saveAnswer(this.value)"

            >${studentAnswers[currentIdx] || ''}</textarea>

        `;

    }


    /*
       =================================================
       MCQ
       =================================================
    */

    else {

        const options =
            Array.isArray(q.options)
                ? q.options
                : [];


        options.forEach(
            (opt, i) => {

                const active =
                    studentAnswers[currentIdx] === i
                        ? 'active'
                        : '';


                html += `

                    <button

                        type="button"

                        class="opt-btn ${active}"

                        onclick="saveAnswer(${i})"

                    >

                        ${escapeHtml(opt)}

                    </button>

                `;

            }
        );

    }


    document.getElementById(
        'qContent'
    ).innerHTML = html;


    const btn =
        document.getElementById(
            'nextBtn'
        );


    if(
        currentIdx ===
        questions.length - 1
    ) {

        btn.innerText =
            "تسليم الاختبار";


        btn.style.background =
            "linear-gradient(135deg,#059669,#10b981)";


        btn.onclick =
            () => submitExam(false);

    }

    else {

        btn.innerText =
            "التالي";


        btn.style.background =
            "linear-gradient(45deg,#b8860b,#ffd700)";


        btn.onclick =
            nextQ;

    }

}



/* =====================================================
   حفظ الإجابة
====================================================== */

function saveAnswer(val) {

    studentAnswers[currentIdx] =
        val;


    if(
        questions[currentIdx].type ===
        'mcq'
    ) {

        renderQuestion();

    }

}



/* =====================================================
   التالي
====================================================== */

function nextQ() {

    if(
        currentIdx <
        questions.length - 1
    ) {

        currentIdx++;

        renderQuestion();

    }

}



/* =====================================================
   السابق
====================================================== */

function prevQ() {

    if(currentIdx > 0) {

        currentIdx--;

        renderQuestion();

    }

}



/* =====================================================
   TIMER
====================================================== */

function startTimer() {

    updateTimerDisplay();


    timerInterval =
        setInterval(
            () => {

                if(timeLeft > 0) {

                    timeLeft--;

                }


                updateTimerDisplay();


                if(timeLeft <= 0) {

                    clearInterval(
                        timerInterval
                    );


                    submitExam(true);

                }

            },
            1000
        );

}



/* =====================================================
   عرض الوقت
====================================================== */

function updateTimerDisplay() {

    let m =
        Math.floor(
            timeLeft / 60
        );


    let s =
        timeLeft % 60;


    document.getElementById(
        'timerDisplay'
    ).innerText =

        `${m}:${s < 10 ? '0' : ''}${s}`;

}



/* =====================================================
   تسليم الاختبار
====================================================== */

async function submitExam(
    isForced = false
) {

    if(isSubmitted) return;


    if(
        !isForced &&
        !confirm(
            "هل أنت متأكد من تسليم الإجابات النهائية؟"
        )
    ) {

        return;

    }


    isSubmitted = true;


    clearInterval(
        timerInterval
    );


    Swal.fire({

        title:
            'جاري حفظ الاختبار...',

        html:
            'برجاء الانتظار لحظات',

        allowOutsideClick:
            false,

        allowEscapeKey:
            false,

        didOpen:
            () => {

                Swal.showLoading();

            }

    });


    try {

        let score = 0;

        let maxScore = 0;

        let hasEssay = false;


        /*
           =================================================
           تجهيز الإجابات
           =================================================
        */

        const answersData =
            questions.map(
                (q, i) => {

                    const points =
                        parseInt(
                            q.points
                        ) || 0;


                    maxScore += points;


                    let earned = 0;

                    let ans =
                        studentAnswers[i];


                    let isCorrect =
                        false;


                    /*
                       MCQ
                    */

                    if(
                        q.type ===
                        'mcq'
                    ) {

                        if(

                            ans !== null &&

                            parseInt(ans) ===
                            parseInt(q.correctIndex)

                        ) {

                            earned =
                                points;


                            score +=
                                earned;


                            isCorrect =
                                true;

                        }


                        ans =
                            ans !== null
                                ? (
                                    q.options &&
                                    q.options[ans] !== undefined
                                      ? q.options[ans]
                                      : "إجابة غير معروفة"
                                  )
                                : "لم يجب";

                    }


                    /*
                       Essay
                    */

                    else {

                        hasEssay =
                            true;


                        ans =
                            ans
                                ? ans
                                : "لم يجب";

                    }


                    return {

                        qIndex:
                            i,

                        text:
                            q.text,

                        type:
                            q.type,

                        studentAns:
                            ans,

                        correctAns:
                            q.type === 'mcq'

                                ? (
                                    q.options &&
                                    q.options[q.correctIndex] !== undefined
                                      ? q.options[q.correctIndex]
                                      : ""
                                  )

                                : "يصحح يدوياً",

                        pointsEarned:
                            earned,

                        maxPoints:
                            points,

                        isCorrect:
                            isCorrect,

                        remark:
                            ""

                    };

                }
            );


        /*
           =================================================
           إنشاء نتيجة الطالب
           =================================================
        */

        const resultDoc = {

            quizId:
                quizId,

            quizTitle:
                currentQuiz.title,

            username:
                loggedStudent.username,

            name:
                loggedStudent.name,

            score:
                score,

            maxScore:
                maxScore,

            isGraded:
                !hasEssay,

            answers:
                answersData,

            cheatAttempt:
                isForced &&
                timeLeft > 0,

            submittedAt:
                firebase.firestore
                    .FieldValue
                    .serverTimestamp()

        };


        /*
           =================================================
           حفظ النتيجة
           =================================================
        */

        await db
            .collection("results2")
            .add(resultDoc);


        /*
           =================================================
           تحديث الجلسة
           =================================================
        */

        if(sessionId) {

            try {

                await db
                    .collection("live_sessions2")
                    .doc(sessionId)
                    .update({

                        status:
                            "submitted"

                    });

            } catch(e) {

                console.log(
                    "Session update error:",
                    e
                );

            }

        }


        /*
           =================================================
           حساب النسبة
           =================================================
        */

        const percent =
            maxScore > 0

                ? (
                    score /
                    maxScore
                  ) * 100

                : 0;


        /*
           =================================================
           الجائزة
           =================================================
        */

        let rewardMsg = null;


        if(

            currentQuiz.rewards &&

            currentQuiz.showResults

        ) {

            const sortedRewards =
                [...currentQuiz.rewards]
                    .sort(
                        (a,b) =>
                            parseInt(b.minScore) -
                            parseInt(a.minScore)
                    );


            const wonReward =
                sortedRewards.find(
                    r =>
                        percent >=
                        parseInt(r.minScore)
                );


            if(wonReward) {

                rewardMsg =
                    wonReward.rewardText;

            }

        }


        /*
           =================================================
           عرض النتيجة
           =================================================
        */

        Swal.close();


        showResultScreen({

            name:
                loggedStudent.name,

            score:
                score,

            maxScore:
                maxScore,

            percent:
                percent,

            hasEssay:
                hasEssay,

            reward:
                rewardMsg,

            showResults:
                currentQuiz.showResults,

            forced:
                isForced

        });


    } catch(error) {

        console.error(error);


        isSubmitted = false;


        Swal.fire({

            title:
                'حدث خطأ',

            text:
                'تعذر حفظ الاختبار. حاول مرة أخرى.',

            icon:
                'error',

            confirmButtonText:
                'حسناً'

        });

    }

}



/* =====================================================
   عرض النتيجة بعد التسليم
====================================================== */

function showResultScreen(data) {

    clearInterval(
        timerInterval
    );


    document.getElementById(
        'loginArea'
    ).style.display = 'none';


    document.getElementById(
        'examArea'
    ).style.display = 'none';


    document.getElementById(
        'resultArea'
    ).style.display = 'block';


    document.getElementById(
        'resultStudentName'
    ).innerText =
        data.name || "الطالب";


    const icon =
        document.getElementById(
            'resultIcon'
        );


    const title =
        document.getElementById(
            'resultTitle'
        );


    const subtitle =
        document.getElementById(
            'resultSubtitle'
        );


    const scoreCard =
        document.getElementById(
            'scoreCard'
        );


    const waiting =
        document.getElementById(
            'waitingMessage'
        );


    const rewardCard =
        document.getElementById(
            'rewardCard'
        );


    /*
       النتيجة محجوبة
    */

    if(!data.showResults) {

        icon.className =
            "result-icon waiting";


        icon.innerHTML =
            '<i class="fas fa-lock"></i>';


        title.innerText =
            "تم تسليم الاختبار";


        subtitle.innerText =
            "تم حفظ إجاباتك بنجاح";


        scoreCard.style.display =
            "none";


        waiting.style.display =
            "block";


        waiting.innerHTML =

            `<i class="fas fa-lock"></i>
             النتيجة محجوبة حالياً من قبل إدارة الاختبار.`;


        rewardCard.style.display =
            "none";


        return;

    }


    /*
       النتيجة ظاهرة
    */

    icon.className =
        "result-icon";


    icon.innerHTML =
        '<i class="fas fa-check"></i>';


    title.innerText =
        "تم تسليم الاختبار بنجاح";


    subtitle.innerText =
        "هذه هي نتيجتك النهائية الحالية";


    scoreCard.style.display =
        "block";


    document.getElementById(
        'resultScore'
    ).innerText =
        `${data.score} / ${data.maxScore}`;


    document.getElementById(
        'resultPercent'
    ).innerText =
        `${formatPercent(data.percent)}%`;


    if(data.hasEssay) {

        waiting.style.display =
            "block";


        waiting.innerHTML =

            `<i class="fas fa-hourglass-half"></i>
             يوجد أسئلة مقالية بانتظار التصحيح من المستشار.`;

    }

    else {

        waiting.style.display =
            "none";

    }


    /*
       الجائزة
    */

    if(data.reward) {

        rewardCard.style.display =
            "block";


        document.getElementById(
            'rewardText'
        ).innerText =
            data.reward;


        setTimeout(
            () => {

                confetti({

                    particleCount:
                        180,

                    spread:
                        80,

                    origin:
                        {
                            y: 0.6
                        }

                });

            },
            300
        );

    }

    else {

        rewardCard.style.display =
            "none";

    }

}



/* =====================================================
   عرض النتيجة السابقة
====================================================== */

function showPreviousResult(result) {

    isSubmitted = true;


    clearInterval(
        timerInterval
    );


    /*
       بيانات النتيجة السابقة
    */

    const score =
        parseInt(
            result.score
        ) || 0;


    const maxScore =
        parseInt(
            result.maxScore
        ) || 0;


    let percent =
        maxScore > 0

            ? (
                score /
                maxScore
              ) * 100

            : 0;


    /*
       معرفة هل يوجد مقالي
    */

    let hasEssay =
        false;


    if(
        Array.isArray(
            result.answers
        )
    ) {

        hasEssay =
            result.answers.some(
                a =>
                    a.type ===
                    'essay'
            );

    }


    /*
       حساب الجائزة من بيانات الاختبار الحالي
    */

    let rewardMsg = null;


    if(

        currentQuiz.showResults &&

        currentQuiz.rewards

    ) {

        const sortedRewards =
            [...currentQuiz.rewards]
                .sort(
                    (a,b) =>
                        parseInt(b.minScore) -
                        parseInt(a.minScore)
                );


        const wonReward =
            sortedRewards.find(
                r =>
                    percent >=
                    parseInt(r.minScore)
            );


        if(wonReward) {

            rewardMsg =
                wonReward.rewardText;

        }

    }


    /*
       إظهار النتيجة
    */

    showResultScreen({

        name:
            result.name ||
            loggedStudent.name,

        score:
            score,

        maxScore:
            maxScore,

        percent:
            percent,

        hasEssay:
            hasEssay,

        reward:
            rewardMsg,

        showResults:
            currentQuiz.showResults !== false,

        forced:
            false

    });

}



/* =====================================================
   خروج نهائي
====================================================== */

function exitExam() {

    isExiting = true;


    /*
       نحاول إغلاق الصفحة إذا كان المتصفح
       يسمح بذلك
    */

    try {

        window.close();

    } catch(e) {

        console.log(e);

    }


    /*
       إذا لم يسمح المتصفح بالإغلاق
       نترك الطالب على شاشة الخروج
    */

    setTimeout(
        () => {

            document.body.innerHTML = `

                <div style="

                    min-height:100vh;

                    display:flex;

                    align-items:center;

                    justify-content:center;

                    padding:20px;

                    text-align:center;

                ">

                    <div class="glass-panel"
                         style="max-width:500px;">

                        <div class="result-icon"
                             style="margin:auto auto 20px;">

                            <i class="fas fa-door-open"></i>

                        </div>

                        <h2>

                            تم الخروج من الاختبار

                        </h2>

                        <p style="color:#94a3b8;">

                            يمكنك إغلاق هذه الصفحة الآن.

                        </p>

                    </div>

                </div>

            `;

        },
        300
    );

}



/* =====================================================
   صفحة الخطأ
====================================================== */

function showErrorPage(message) {

    document.body.innerHTML = `

        <div style="

            min-height:100vh;

            display:flex;

            align-items:center;

            justify-content:center;

            padding:20px;

        ">

            <div class="glass-panel"
                 style="

                    max-width:550px;

                    width:100%;

                    text-align:center;

                 ">

                <div class="result-icon"
                     style="

                        background:
                        linear-gradient(
                            135deg,
                            #dc2626,
                            #ef4444
                        );

                     ">

                    <i class="fas fa-circle-exclamation"></i>

                    ${message}

                </h2>

    `;

}



/* =====================================================
   تنسيق النسبة
====================================================== */

function formatPercent(value) {

    return Number(
        value
    ).toFixed(2);

}



/* =====================================================
   حماية بسيطة من HTML
====================================================== */

function escapeHtml(value) {

    if(value === null ||
       value === undefined) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
