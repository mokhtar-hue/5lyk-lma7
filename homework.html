<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية | منصة خليـــك لمــاح مع المستشـــار
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --bg: #0f172a;
            --card: #1e293b;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            overflow-x: hidden;
        }

        /* نافبار علوي */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            position: sticky;
    db.collection("homeworks").orderBy("createdAt", "desc").onSnapshot(snap => {
        const grid = document.getElementById('studentHwList');
        grid.innerHTML = "";
        
        if(snap.empty) {
            grid.innerHTML = "<p>لا توجد واجبات مضافة حالياً.</p>";
            return;
        }

        snap.forEach(doc => {
            const data = doc.data();
            grid.innerHTML += `
                <div class="hw-card">
                    <div style="font-size: 40px; margin-bottom: 10px;">📄</div>
                    <h3 style="margin: 0;">${data.title}</h3>
                    <p style="color: #94a3b8; font-size: 13px;">تأكد من الحل بدقة قبل المحاضرة القادمة</p>
                    <a href="${data.link}" target="_blank" class="download-btn">فتح الواجب / تحميل</a>
                </div>`;
        });
    });
</script>
</body>
</html>
