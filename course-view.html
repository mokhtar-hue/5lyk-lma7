<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل الكورس المحمي | المستشار</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --accent: #10b981; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #f1f5f9; margin: 0; user-select: none; }
        
        .header { background: var(--card); padding: 15px 5%; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .user-info { font-size: 14px; color: var(--accent); font-weight: bold; }

        .course-container { display: grid; grid-template-columns: 1fr 350px; height: calc(100vh - 70px); }
        
        /* مشغل الفيديو المحمي */
        .video-player-area { background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 60px; z-index: 10; cursor: default; } /* تغطية العنوان */
        .video-wrapper { position: relative; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }

        .playlist { background: var(--card); border-right: 1px solid #334155; overflow-y: auto; padding: 20px; }
        .playlist-item { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; border: 1px solid transparent; transition: 0.3s; }
        .playlist-item:hover { background: rgba(99, 102, 241, 0.1); border-color: var(--primary); }
        .playlist-item.active { background: var(--primary); color: white; }
        
        .file-btn { display: block; width: 100%; background: #10b981; color: white; text-align: center; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 10px; }

        @media (max-width: 900px) { .course-container { grid-template-columns: 1fr; height: auto; } }
    </style>
</head>
<body oncontextmenu="return false;"> <div id="courseApp">
    <div style="text-align:center; padding:100px;">جاري التحقق من الصلاحيات والخصوصية...</div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", authDomain: "zomaapp-744fc.firebaseapp.com", projectId: "zomaapp-744fc" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const userEmail = localStorage.getItem("userEmail") || "طالب زائر";
    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get('id');

    async function initCourseView() {
        if (!courseId) return;
        const doc = await db.collection("courses").doc(courseId).get();
        if(!doc.exists) return;
        const course = doc.data();
        renderCourseUI(course);
    }

    function renderCourseUI(course) {
        let contentHtml = "";
        course.content.forEach((item, index) => {
            contentHtml += `<div class="playlist-item" onclick="playMedia('${item.link}', '${item.type}', this)">
                <i class="fas fa-${item.type === 'video' ? 'play-circle' : 'file-pdf'}"></i> ${item.title}</div>`;
        });

        document.getElementById('courseApp').innerHTML = `
            <div class="header">
                <div>
                    <span style="font-weight:900;">${course.title}</span>
                    <div class="user-info">أهلاً بك: ${userEmail}</div>
                </div>
                <a href="courses-catalog.html" style="color:#fff; text-decoration:none;"><i class="fas fa-sign-out-alt"></i> خروج</a>
            </div>
            <div class="course-container">
                <div class="video-player-area" id="playerArea">
                    <div style="text-align:center; color:#475569;">
                        <i class="fas fa-play-circle" style="font-size:60px; margin-bottom:15px;"></i>
                        <p>اختر درساً لبدء المشاهدة الآمنة</p>
                    </div>
                </div>
                <div class="playlist">
                    <h4 style="margin:0 0 15px 0;">قائمة الدروس</h4>
                    ${contentHtml}
                </div>
            </div>
        `;
    }

    function playMedia(link, type, element) {
        const playerArea = document.getElementById('playerArea');
        document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        if(type === 'video') {
            const videoId = getYoutubeId(link);
            // بارامترات الحماية: 
            // rel=0 (منع مقترحات غريبة)
            // modestbranding=1 (إخفاء لوجو يوتيوب)
            // controls=1 (إظهار التحكم العادي)
            // showinfo=0 (قديمة لكن تضاف لبعض المتصفحات)
            const secureUrl = `https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1&showinfo=0&autoplay=1`;
            
            playerArea.innerHTML = `
                <div class="video-wrapper">
                    <div class="video-overlay"></div> <iframe src="${secureUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            `;
        } else {
            playerArea.innerHTML = `<div style="text-align:center;">
                <i class="fas fa-file-pdf" style="font-size:80px; color:#ef4444;"></i>
                <h3 style="color:#fff">الملف متاح للمعاينة</h3>
                <a href="${link}" target="_blank" class="file-btn" style="width:200px; margin:20px auto;">تحميل PDF</a>
            </div>`;
        }
    }

    // وظيفة استخراج الـ ID الذكية
    function getYoutubeId(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length == 11) ? match[2] : null;
    }

    // منع اختصارات الكيبورد (F12, Ctrl+U, etc.)
    document.onkeydown = function(e) {
        if(e.keyCode == 123) return false; // F12
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // View Source
    };
</script>
</body>
</html>
