<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المستشار | نظام العرض المحمي 🛡️</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #6366f1; --bg: #020617; --card: #1e293b; --accent: #10b981; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #f1f5f9; margin: 0; overflow: hidden; user-select: none; }
        
        /* الهيكل الرئيسي */
        .app-wrapper { display: flex; flex-direction: column; height: 100vh; }
        .top-nav { height: 70px; background: var(--card); padding: 0 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; z-index: 1000; }
        .main-content { display: grid; grid-template-columns: 1fr 350px; flex: 1; overflow: hidden; }

        /* منطقة اللاعب */
        #playerArea { position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .content-frame { width: 100%; height: 100%; z-index: 1; }
        iframe { width: 100%; height: 100%; border: none; }

        /* عوازل الحماية لمنع الضغط على الشير واللوجو */
        .blocker-top { position: absolute; top: 0; left: 0; width: 100%; height: 70px; z-index: 50; cursor: default; }
        .blocker-right { position: absolute; top: 0; right: 0; width: 20%; height: 100px; z-index: 51; cursor: default; }
        
        /* العلامة المائية المتحركة للفيديو */
        .v-watermark { position: absolute; color: rgba(255, 255, 255, 0.2); font-size: 15px; font-weight: bold; pointer-events: none; z-index: 100; white-space: nowrap; transition: 3s linear; text-shadow: 1px 1px 2px #000; }

        /* حماية PDF (شبكة علامات مائية) */
        .pdf-grid-mask { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 60; pointer-events: none; display: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='120'><text transform='rotate(-25)' fill='rgba(255,255,255,0.08)' font-size='14' font-family='Cairo' x='0' y='60'>المستشار - حماية</text></svg>");
        }

        /* القائمة الجانبية */
        .sidebar { background: #0f172a; border-right: 1px solid #334155; overflow-y: auto; padding: 20px; }
        .item { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 12px; cursor: pointer; border: 1px solid transparent; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
        .item:hover { border-color: var(--primary); }
        .item.active { background: var(--primary); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }

        /* أزرار التحكم */
        .controls-overlay { position: absolute; bottom: 20px; left: 20px; z-index: 200; display: flex; gap: 10px; }
        .btn-action { background: rgba(0,0,0,0.7); border: 1px solid #444; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; }

        @media (max-width: 1024px) { .main-content { grid-template-columns: 1fr; overflow-y: auto; } .sidebar { height: auto; } }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="app-wrapper">
    <header class="top-nav">
        <div>
            <h2 id="courseTitle" style="margin:0; font-size:1rem; color:var(--primary);">تحميل...</h2>
            <small id="studentID" style="color:#94a3b8;"></small>
        </div>
        <a href="courses-catalog.html" style="color: #ef4444; text-decoration: none; font-size: 14px;"><i class="fas fa-power-off"></i> خروج</a>
    </header>

    <main class="main-content">
        <section id="playerArea">
            <div id="vWatermark" class="v-watermark"></div>
            <div class="blocker-top"></div>
            <div class="blocker-right"></div>
            <div id="pdfMask" class="pdf-grid-mask"></div>
            
            <div id="view" class="content-frame">
                <div style="text-align:center; color:#334155;">
                    <i class="fas fa-shield-halved fa-6x" style="margin-bottom:20px;"></i>
                    <h2>بوابة المستشار التعليمية</h2>
                    <p>اختر درساً من القائمة لبدء التعلم الآمن</p>
                </div>
            </div>

            <div class="controls-overlay" id="playerControls" style="display:none;">
                <button class="btn-action" onclick="goFullscreen()"><i class="fas fa-expand"></i> وضع ملء الشاشة</button>
            </div>
        </section>

        <aside class="sidebar" id="playlist"></aside>
    </main>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", authDomain: "zomaapp-744fc.firebaseapp.com", projectId: "zomaapp-744fc" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const params = new URLSearchParams(window.location.search);
    const courseId = params.get('id');
    const studentMail = localStorage.getItem("userEmail") || "Unregistered_Student";

    async function initPlayer() {
        if(!courseId) return;
        const doc = await db.collection("courses").doc(courseId).get();
        if(!doc.exists) return;
        
        const data = doc.data();
        document.getElementById('courseTitle').innerText = data.title;
        document.getElementById('studentID').innerText = `البطاقة الرقمية: ${studentMail}`;
        
        const list = document.getElementById('playlist');
        data.content.forEach(item => {
            list.innerHTML += `
                <div class="item" onclick="loadMedia('${item.link}', '${item.type}', this)">
                    <i class="fas fa-${item.type==='video'?'play-circle':'file-invoice'}"></i>
                    <span>${item.title}</span>
                </div>`;
        });
        moveWatermark();
    }

    function loadMedia(link, type, el) {
        document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        
        const view = document.getElementById('view');
        const pdfMask = document.getElementById('pdfMask');
        const controls = document.getElementById('playerControls');
        
        controls.style.display = "flex";

        if(type === 'video') {
            pdfMask.style.display = "none";
            const id = extractVideoID(link);
            // حماية اليوتيوب: fs=0 لإلغاء زر ملء الشاشة الخاص بهم، modestbranding=1 لإخفاء الشعار
            view.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&controls=1&fs=0&disablekb=1&iv_load_policy=3&autoplay=1" allow="autoplay; fullscreen"></iframe>`;
        } else {
            pdfMask.style.display = "block";
            // مستعرض PDF من جوجل مع تعطيل التفاعل
            const googleViewer = `https://docs.google.com/viewer?url=${encodeURIComponent(link)}&embedded=true`;
            view.innerHTML = `
                <div style="width:100%; height:100%; pointer-events: none; overflow: hidden; position:relative;">
                    <iframe src="${googleViewer}"></iframe>
                </div>
                <div style="position:absolute; top:0; right:0; width:60px; height:60px; background:transparent; z-index:100;"></div> `;
        }
    }

    function extractVideoID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length == 11) ? match[2] : url;
    }

    // دالة ملء الشاشة (تحفظ العلامة المائية والطبقات فوق الفيديو)
    function goFullscreen() {
        const area = document.getElementById('playerArea');
        if (!document.fullscreenElement) {
            if (area.requestFullscreen) area.requestFullscreen();
            else if (area.webkitRequestFullscreen) area.webkitRequestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }

    // تحريك العلامة المائية لمنع برامج التسجيل
    function moveWatermark() {
        const wm = document.getElementById('vWatermark');
        wm.innerText = `مؤمن لـ: ${studentMail}`;
        setInterval(() => {
            wm.style.left = Math.random() * 70 + "%";
            wm.style.top = Math.random() * 80 + "%";
        }, 4000);
    }

    // منع الاختصارات (F12, Ctrl+U, Ctrl+P)
    document.addEventListener('keydown', (e) => {
        if(e.ctrlKey && ['u','s','p','c'].includes(e.key.toLowerCase())) e.preventDefault();
        if(e.key === 'F12') e.preventDefault();
    });

    initPlayer();
</script>
</body>
</html>
