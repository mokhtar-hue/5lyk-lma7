<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المستشار | الحماية الفولاذية 🛡️</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #6366f1; --bg: #020617; --card: #1e293b; --accent: #10b981; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #f1f5f9; margin: 0; overflow: hidden; user-select: none; }
        
        .app-wrapper { display: flex; flex-direction: column; height: 100vh; }
        .top-nav { height: 70px; background: var(--card); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; border-bottom: 1px solid #334155; z-index: 1000; }
        .main-content { display: grid; grid-template-columns: 1fr 380px; flex: 1; overflow: hidden; }

        .display-section { position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .content-frame { width: 100%; height: 100%; position: relative; z-index: 1; }
        iframe { width: 100%; height: 100%; border: none; }

        /* طبقة حماية يوتيوب (تغطية الشير واللوجو) */
        .yt-protector { position: absolute; top: 0; right: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .share-blocker { position: absolute; top: 0; right: 0; width: 25%; height: 15%; pointer-events: auto; background: transparent; z-index: 11; }
        .title-blocker { position: absolute; top: 0; left: 0; width: 80%; height: 12%; pointer-events: auto; background: transparent; z-index: 11; }

        /* العلامة المائية المتكررة (Pattern) للـ PDF والفيديو */
        .pattern-watermark {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
            gap: 20px; pointer-events: none; z-index: 12; opacity: 0.1; overflow: hidden;
        }
        .pattern-text { transform: rotate(-30deg); font-size: 14px; font-weight: bold; white-space: nowrap; }

        /* العلامة المائية المتحركة الطائرة */
        .flying-watermark {
            position: absolute; color: rgba(255, 255, 255, 0.3); font-size: 18px; font-weight: bold;
            pointer-events: none; z-index: 100; transition: 3s linear; white-space: nowrap;
        }

        .sidebar { background: #0f172a; border-right: 1px solid #334155; overflow-y: auto; padding: 15px; }
        .item { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.3s; border: 1px solid transparent; display: flex; align-items: center; gap: 10px; }
        .item.active { background: var(--primary); }

        .fs-btn { position: absolute; bottom: 20px; left: 20px; z-index: 100; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 15px; border-radius: 8px; cursor: pointer; backdrop-filter: blur(5px); }

        @media (max-width: 1024px) { .main-content { grid-template-columns: 1fr; } .sidebar { display: none; } }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="app-wrapper">
    <header class="top-nav">
        <div>
            <h2 id="courseTitle" style="margin:0; font-size:1.1rem;">المستشار التعليمي</h2>
            <small id="studentBadge" style="color:var(--accent)"></small>
        </div>
        <a href="courses-catalog.html" style="color: #94a3b8; text-decoration: none;"><i class="fas fa-chevron-left"></i> عودة</a>
    </header>

    <main class="main-content">
        <section class="display-section" id="playerContainer">
            <div id="flyingWM" class="flying-watermark"></div>
            <div id="patternWM" class="pattern-watermark"></div>
            <div class="share-blocker"></div> <div class="title-blocker"></div> <div id="view" class="content-frame">
                <div style="text-align:center; color:#475569; margin-top:20vh;">
                    <i class="fas fa-shield-alt fa-4x"></i>
                    <p>اختر المحتوى لبدء العرض الآمن</p>
                </div>
            </div>
            
            <button class="fs-btn" onclick="toggleFullScreen()"><i class="fas fa-expand"></i> ملء الشاشة</button>
        </section>

        <aside class="sidebar" id="playlist"></aside>
    </main>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", authDomain: "zomaapp-744fc.firebaseapp.com", projectId: "zomaapp-744fc" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const params = new URLSearchParams(window.location.search);
    const courseId = params.get('id');
    const studentEmail = localStorage.getItem("userEmail") || "Unverified_User";

    async function init() {
        if(!courseId) return;
        const doc = await db.collection("courses").doc(courseId).get();
        const data = doc.data();
        document.getElementById('courseTitle').innerText = data.title;
        document.getElementById('studentBadge').innerText = `🔐 حساب: ${studentEmail}`;
        
        // بناء القائمة المتكررة للعلامة المائية (Pattern)
        const pattern = document.getElementById('patternWM');
        for(let i=0; i<16; i++) {
            pattern.innerHTML += `<div class="pattern-text">${studentEmail}</div>`;
        }

        const list = document.getElementById('playlist');
        data.content.forEach((item, i) => {
            list.innerHTML += `
                <div class="item" onclick="loadContent('${item.link}', '${item.type}', this)">
                    <i class="fas fa-${item.type==='video'?'play-circle':'file-pdf'}"></i>
                    <span>${item.title}</span>
                </div>`;
        });
        
        moveFlyingWM();
    }

    function loadContent(link, type, el) {
        document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        const view = document.getElementById('view');

        if(type === 'video') {
            const id = extractID(link);
            // البارامترات: controls=1 (تحكم بسيط) , modestbranding=1 (إخفاء اللوجو) , rel=0 (منع فيديوهات أخرى)
            view.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&fs=0&controls=1&disablekb=1&iv_load_policy=3&autoplay=1" allow="autoplay"></iframe>`;
        } else {
            // عرض الـ PDF داخل محرك جوجل مع تعطيل التفاعل
            view.innerHTML = `<iframe src="https://docs.google.com/viewer?url=${encodeURIComponent(link)}&embedded=true" style="pointer-events:none;"></iframe>
            <div style="position:absolute; bottom:0; width:100%; height:40px; background:var(--bg); z-index:100; text-align:center; font-size:12px; padding-top:10px; color:#ef4444;">
               🛡️ نسخة محمية رقمياً - يمنع النسخ أو التحميل
            </div>`;
        }
    }

    function extractID(url) {
        const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const m = url.match(reg);
        return (m && m[2].length == 11) ? m[2] : url;
    }

    function toggleFullScreen() {
        const elem = document.getElementById('playerContainer');
        if (!document.fullscreenElement) {
            elem.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }

    function moveFlyingWM() {
        const wm = document.getElementById('flyingWM');
        wm.innerText = "جاري المشاهدة بواسطة: " + studentEmail;
        setInterval(() => {
            const x = Math.random() * 60;
            const y = Math.random() * 90;
            wm.style.left = x + "%";
            wm.style.top = y + "%";
        }, 4000);
    }

    // منع الاختصارات نهائياً
    window.addEventListener('keydown', (e) => {
        if(e.ctrlKey && (e.key==='u' || e.key==='s' || e.key==='p' || e.key==='c' || e.key==='v')) e.preventDefault();
        if(e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) e.preventDefault();
    });
    
    init();
</script>
</body>
</html>
