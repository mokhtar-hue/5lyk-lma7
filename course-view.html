<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المستشار | الحماية القصوى 🛡️</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #6366f1; --bg: #020617; --card: #1e293b; --accent: #10b981; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #f1f5f9; margin: 0; overflow: hidden; user-select: none; }
        
        .app-wrapper { display: flex; flex-direction: column; height: 100vh; }
        .top-nav { height: 70px; background: var(--card); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; border-bottom: 1px solid #334155; z-index: 1000; }
        .main-content { display: grid; grid-template-columns: 1fr 380px; flex: 1; overflow: hidden; }

        /* منطقة العرض */
        .display-section { position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
        .content-frame { width: 100%; height: 100%; position: relative; }
        iframe { width: 100%; height: 100%; border: none; pointer-events: auto; }

        /* طبقات الحماية */
        .overlay-blocker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .top-blocker { position: absolute; top: 0; left: 0; width: 100%; height: 60px; z-index: 11; pointer-events: auto; background: transparent; }
        
        /* العلامة المائية المتحركة */
        .dynamic-watermark {
            position: absolute; color: rgba(255, 255, 255, 0.2); font-size: 20px; font-weight: bold;
            pointer-events: none; z-index: 999; white-space: nowrap; transition: 2s ease-in-out;
        }

        /* القائمة الجانبية */
        .sidebar { background: #0f172a; border-right: 1px solid #334155; overflow-y: auto; padding: 15px; }
        .item { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.3s; border: 1px solid transparent; display: flex; align-items: center; gap: 10px; }
        .item:hover { border-color: var(--primary); }
        .item.active { background: var(--primary); }

        /* زر تكبير الشاشة المخصص */
        .fs-btn { position: absolute; bottom: 20px; left: 20px; z-index: 100; background: rgba(0,0,0,0.5); border: none; color: white; padding: 10px; border-radius: 5px; cursor: pointer; }

        @media (max-width: 1024px) { .main-content { grid-template-columns: 1fr; overflow-y: auto; } .sidebar { height: auto; } }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="app-wrapper" id="playerUI">
    <header class="top-nav">
        <div>
            <h2 id="courseTitle" style="margin:0; font-size:1.1rem;">جاري التحميل...</h2>
            <small id="studentBadge" style="color:var(--accent)"></small>
        </div>
        <a href="courses-catalog.html" style="color: #ef4444; text-decoration: none; font-weight: bold;"><i class="fas fa-times"></i> إغلاق</a>
    </header>

    <main class="main-content">
        <section class="display-section" id="playerContainer">
            <div id="watermark" class="dynamic-watermark"></div>
            <div class="top-blocker"></div> <div id="view" class="content-frame">
                <div style="text-align:center; margin-top:20vh; color:#475569;">
                    <i class="fas fa-play-circle fa-5x"></i>
                    <p>اختر درساً للبدء</p>
                </div>
            </div>
            <button class="fs-btn" onclick="toggleFullScreen()"><i class="fas fa-expand"></i> ملء الشاشة</button>
        </section>

        <aside class="sidebar" id="playlist">
            </aside>
    </main>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", authDomain: "zomaapp-744fc.firebaseapp.com", projectId: "zomaapp-744fc" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const params = new URLSearchParams(window.location.search);
    const courseId = params.get('id');
    const studentEmail = localStorage.getItem("userEmail") || "Guest_User";

    async function init() {
        if(!courseId) return;
        const doc = await db.collection("courses").doc(courseId).get();
        const data = doc.data();
        
        document.getElementById('courseTitle').innerText = data.title;
        document.getElementById('studentBadge').innerText = `🔐 مؤمن لـ: ${studentEmail}`;
        
        const list = document.getElementById('playlist');
        data.content.forEach((item, i) => {
            list.innerHTML += `
                <div class="item" onclick="loadContent('${item.link}', '${item.type}', this)">
                    <i class="fas fa-${item.type==='video'?'play':'file-pdf'}"></i>
                    <span>${item.title}</span>
                </div>`;
        });
        
        startWatermark();
    }

    function loadContent(link, type, el) {
        document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        const view = document.getElementById('view');

        if(type === 'video') {
            const id = extractID(link);
            // حماية اليوتيوب القصوى: fs=0 (منع زر ملء الشاشة الخاص بيوتيوب لاستخدام زرنا المحمي)
            // disablekb=1 (منع الكيبورد) , iv_load_policy=3 (منع التفاعلات)
            view.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&controls=1&fs=0&disablekb=1&iv_load_policy=3&autoplay=1" allow="autoplay"></iframe>`;
        } else {
            // حماية PDF: نستخدم Google Drive Viewer ونمنع التفاعل
            view.innerHTML = `<iframe src="https://docs.google.com/viewer?url=${encodeURIComponent(link)}&embedded=true" style="pointer-events: none;"></iframe>
            <div style="position:absolute; bottom:0; width:100%; height:50px; background:var(--bg); z-index:20; text-align:center; padding-top:10px;">
                ⚠️ المعاينة فقط مفعلة - التحميل ممنوع بأمر المستشار
            </div>`;
        }
    }

    function extractID(url) {
        const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const m = url.match(reg);
        return (m && m[2].length == 11) ? m[2] : url;
    }

    // زر ملء الشاشة المحمي (يحافظ على الـ Watermark)
    function toggleFullScreen() {
        const elem = document.getElementById('playerContainer');
        if (!document.fullscreenElement) {
            elem.requestFullscreen().catch(err => alert(err.message));
        } else {
            document.exitFullscreen();
        }
    }

    // محرك العلامة المائية المتحرك
    function startWatermark() {
        const wm = document.getElementById('watermark');
        wm.innerText = studentEmail + " | ملكية خاصة للمستشار";
        
        setInterval(() => {
            const x = Math.random() * 70;
            const y = Math.random() * 80;
            wm.style.left = x + "%";
            wm.style.top = y + "%";
        }, 3000);
    }

    // منع الاختصارات
    window.addEventListener('keydown', (e) => {
        if(e.ctrlKey && (e.key==='u' || e.key==='s' || e.key==='p')) e.preventDefault();
        if(e.key === 'F12') e.preventDefault();
    });

    init();
</script>
</body>
</html>
