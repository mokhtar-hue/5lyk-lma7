<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوابة الدفع | المستشار</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo'; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .payment-card { background: #1e293b; padding: 30px; border-radius: 20px; width: 400px; text-align: center; border: 1px solid #334155; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .btn { background: #6366f1; color: white; padding: 12px; width: 100%; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .fawry-box { background: #fff; color: #000; padding: 20px; border-radius: 10px; margin-top: 20px; display: none; }
        .price-tag { font-size: 24px; color: #10b981; font-weight: 900; }
    </style>
</head>
<body>

<div class="payment-card">
    <h2>تأكيد الاشتراك</h2>
    <p id="courseName">تحميل...</p>
    <div class="price-tag" id="finalPrice">0 ج.م</div>
    
    <div id="promoSection">
        <input type="text" id="promoInput" placeholder="أدخل كود الخصم (إن وجد)">
        <button class="btn" style="background:#334155; margin-bottom:20px;" onclick="applyPromo()">تطبيق الخصم</button>
    </div>

    <button class="btn" id="payBtn" onclick="generateFawryCode()">توليد كود فوري للدفع</button>

    <div class="fawry-box" id="fawryArea">
        <p>توجه لأقرب منفذ فوري واستخدم الكود التالي:</p>
        <h1 id="fawryCode" style="letter-spacing: 5px;">987654321</h1>
        <p>المبلغ المطلوب: <span id="fawryAmount">0</span> ج.م</p>
        <small>صالح لمدة 48 ساعة</small>
    </div>
</div>

<script>
    firebase.initializeApp({ apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", authDomain: "zomaapp-744fc.firebaseapp.com", projectId: "zomaapp-744fc" });
    const db = firebase.firestore();
    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get('id');
    let originalPrice = parseFloat(urlParams.get('price'));
    let currentPrice = originalPrice;

    document.getElementById('finalPrice').innerText = originalPrice + " ج.م";

    async function applyPromo() {
        const code = document.getElementById('promoInput').value;
        const promoDoc = await db.collection("promos").doc(code).get();

        if (promoDoc.exists) {
            const data = promoDoc.data();
            const discount = data.percent; // مثلاً 20 (يعني 20%)
            currentPrice = originalPrice - (originalPrice * (discount / 100));
            document.getElementById('finalPrice').innerText = currentPrice + " ج.م (خصم " + discount + "%)";
            alert("تم تطبيق الخصم بنجاح!");
        } else {
            alert("كود غير صالح");
        }
    }

    async function generateFawryCode() {
        // هنا المفروض نرسل طلب للسيرفر يولد كود فوري حقيقي، لكن كنموذج:
        const randomCode = Math.floor(100000000 + Math.random() * 900000000);
        document.getElementById('fawryCode').innerText = randomCode;
        document.getElementById('fawryAmount').innerText = currentPrice;
        document.getElementById('fawryArea').style.display = 'block';
        document.getElementById('payBtn').style.display = 'none';
        document.getElementById('promoSection').style.display = 'none';

        // تخزين الطلب في قاعدة البيانات للأدمن
        await db.collection("payment_requests").add({
            email: localStorage.getItem("userEmail"),
            courseId: courseId,
            amount: currentPrice,
            fawryCode: randomCode,
            status: "pending",
            date: new Date()
        });
    }
</script>
</body>
</html>
