<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة دفع المستشار | VIP 🛡️</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #161e2d; --accent: #10b981; --fawry: #ffc107; --cash: #ef4444; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        .payment-container { width: 95%; max-width: 480px; padding: 20px; animation: fadeIn 0.6s ease-out; }
        .main-card { background: var(--card); border-radius: 28px; padding: 35px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.08); text-align: center; }
        
        .price-display { background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(16, 185, 129, 0.1)); border-radius: 20px; padding: 25px; margin: 25px 0; border: 1px solid var(--primary); }
        .amount { font-size: 38px; font-weight: 900; color: var(--accent); }
        
        .pay-option { background: rgba(255,255,255,0.03); border-radius: 18px; padding: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.05); text-align: right; position: relative; }
        .pay-option:hover { background: rgba(255,255,255,0.08); border-color: var(--primary); transform: translateY(-3px); }
        .pay-option i { font-size: 26px; width: 45px; text-align: center; }
        
        .btn-wallet { border-right: 4px solid var(--accent); }
        .btn-fawry { border-right: 4px solid var(--fawry); }
        .btn-cash { border-right: 4px solid var(--cash); }

        .wallet-badge { background: var(--accent); color: #000; padding: 3px 10px; border-radius: 8px; font-size: 11px; font-weight: 900; position: absolute; left: 15px; top: 50%; transform: translateY(-50%); }

        #cashModal { display: none; background: rgba(0,0,0,0.92); position: fixed; inset: 0; z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal-content { background: var(--card); padding: 30px; border-radius: 25px; max-width: 380px; width: 90%; text-align: center; border: 1px solid var(--cash); }

        .promo-box { display: flex; gap: 8px; margin-bottom: 25px; }
        .promo-box input { flex: 1; background: #070b14; border: 1px solid #334155; border-radius: 12px; color: white; padding: 12px; font-family: 'Cairo'; text-align: center; outline: none; }
        .promo-box button { background: var(--primary); border: none; color: white; border-radius: 12px; padding: 0 15px; cursor: pointer; font-weight: bold; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="payment-container">
    <div class="main-card">
        <h2 style="margin:0;">بوابة دفع المستشار 🛡️</h2>
        <p style="opacity: 0.5; font-size: 13px;">يرجى اختيار وسيلة الدفع لتفعيل الكورس</p>

        <div class="price-display">
            <p style="margin:0; font-size:13px;">المبلغ المطلوب</p>
            <div class="amount" id="displayAmount">0.00 ج.م</div>
            <p id="courseNameDisplay" style="margin:5px 0 0 0; font-size:14px; font-weight:bold; color:var(--primary);"></p>
        </div>

        <div class="promo-box">
            <input type="text" id="promoInput" placeholder="كود الخصم">
            <button onclick="applyPromo()">تفعيل</button>
        </div>

        <div id="optionsArea">
            <div class="pay-option btn-wallet" id="platformWalletOption" onclick="payWithPlatformWallet()" style="display: none;">
                <i class="fas fa-wallet" style="color: var(--accent);"></i>
                <div>
                    <h4>محفظة المنصة</h4>
                    <p>الدفع من رصيد حسابك الحالي</p>
                </div>
                <span class="wallet-badge" id="currentBalance">0.00</span>
            </div>

            <div class="pay-option btn-fawry" onclick="payWithFawry()">
                <i class="fas fa-bolt" style="color: var(--fawry);"></i>
                <div>
                    <h4>Fawry Pay</h4>
                    <p>دفع عبر ماكينات فوري</p>
                </div>
            </div>

            <div class="pay-option btn-cash" onclick="showCashModal()">
                <i class="fas fa-university" style="color: var(--cash);"></i>
                <div>
                    <h4>تحويل كاش</h4>
                    <p>فودافون / اتصالات / أورانج</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="cashModal">
    <div class="modal-content">
        <i class="fas fa-mobile-alt fa-3x" style="color:var(--cash); margin-bottom:15px;"></i>
        <h3>تعليمات الدفع كاش</h3>
        <p>حول مبلغ <b id="cashAmountText" style="color:var(--accent);"></b> للرقم:</p>
        <h2 style="background:#070b14; padding:15px; border-radius:15px; color:var(--cash); margin:10px 0; border: 1px dashed var(--cash);">01550153566</h2>
        <p style="font-size:12px; opacity:0.7;">أرسل صورة التحويل واتساب لتفعيل اشتراكك.</p>
        <button onclick="confirmCashTransfer()" style="background:var(--accent); width:100%; border:none; padding:15px; border-radius:12px; color:white; font-weight:900; cursor:pointer;">تم التحويل، أرسل إشعار</button>
        <button onclick="closeModal()" style="background:none; border:none; color:white; cursor:pointer; margin-top:15px;">إغلاق</button>
    </div>
</div>

<script>
    // تهيئة Firebase بنفس الإعدادات الموجودة في لوحة التحكم
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    // جلب البيانات من الـ URL (مثل: payment.html?id=math101&price=150&name=مراجعة_الاستاتيكا)
    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get('id');
    const courseName = urlParams.get('name') || "كورس جديد";
    let price = parseFloat(urlParams.get('price')) || 0;
    const userEmail = localStorage.getItem("userEmail");

    async function init() {
        if (!userEmail) {
            alert("جلسة العمل انتهت، يرجى تسجيل الدخول");
            window.location.href = "index.html";
            return;
        }

        document.getElementById('displayAmount').innerText = price.toFixed(2) + " ج.م";
        document.getElementById('courseNameDisplay').innerText = courseName;
        document.getElementById('cashAmountText').innerText = price.toFixed(2) + " ج.م";

        // مراقبة الرصيد من الفايربيز (مثل لوحة التحكم تماماً)
        db.collection("users").doc(userEmail).onSnapshot((doc) => {
            if (doc.exists) {
                const userData = doc.data();
                const walletBalance = parseFloat(userData.wallet || 0);
                document.getElementById('currentBalance').innerText = walletBalance.toFixed(2) + " ج.م";
                
                // التحكم في ظهور خيار الدفع بالمحفظة
                if (walletBalance >= price) {
                    document.getElementById('platformWalletOption').style.display = 'flex';
                } else {
                    document.getElementById('platformWalletOption').style.display = 'none';
                }
            }
        });
    }

    // 1. الدفع من محفظة المنصة (سحب حقيقي من الفايربيز)
    async function payWithPlatformWallet() {
        if (!confirm(`هل تريد خصم ${price} ج.م من محفظتك والاشتراك في ${courseName}؟`)) return;

        const userRef = db.collection("users").doc(userEmail);

        try {
            await db.runTransaction(async (transaction) => {
                const userDoc = await transaction.get(userRef);
                const currentBalance = parseFloat(userDoc.data().wallet || 0);

                if (currentBalance < price) {
                    throw "عذراً، رصيدك غير كافٍ لإتمام العملية.";
                }

                // خصم الرصيد
                transaction.update(userRef, { wallet: currentBalance - price });

                // إضافة الاشتراك في جدول الكورسات
                const subId = `${userEmail}_${courseId}`;
                transaction.set(db.collection("subscriptions").doc(subId), {
                    email: userEmail,
                    courseId: courseId,
                    courseName: courseName,
                    pricePaid: price,
                    method: "PlatformWallet",
                    status: "active",
                    purchaseDate: new Date()
                });
            });

            alert("✅ تم الاشتراك بنجاح! استمتع بمحاضراتك.");
            window.location.href = "courses-catalog.html"; // التوجه لكورساتي

        } catch (error) {
            alert("خطأ: " + error);
        }
    }

    // 2. الدفع عبر فوري (توليد كود)
    function payWithFawry() {
        const refNum = Math.floor(Math.random() * 899999999) + 100000000;
        
        db.collection("payment_requests").add({
            email: userEmail,
            courseId: courseId,
            amount: price,
            method: "Fawry",
            refNum: refNum,
            status: "pending",
            timestamp: new Date()
        }).then(() => {
            const merchantCode = "1T987654321"; // كود التاجر الخاص بك
            window.location.href = `https://www.fawrypay.com/atfawry/pay?merchant=${merchantCode}&amount=${price}&ref=${refNum}`;
        });
    }

    // 3. المحفظة اليدوية (إرسال إشعار للمستشار)
    function showCashModal() { document.getElementById('cashModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('cashModal').style.display = 'none'; }

    async function confirmCashTransfer() {
        await db.collection("payment_requests").add({
            email: userEmail,
            courseId: courseId,
            courseName: courseName,
            amount: price,
            method: "Manual_Cash",
            status: "pending",
            timestamp: new Date()
        });

        const waMsg = `أهلاً مستشار حازم، لقد قمت بتحويل ${price} ج.م لاشتراك كورس (${courseName}). إيميل حسابي: ${userEmail}`;
        window.open(`https://wa.me/201550153566?text=${encodeURIComponent(waMsg)}`, '_blank');
        closeModal();
    }

    async function applyPromo() {
        const code = document.getElementById('promoInput').value.trim();
        if (!code) return;

        const promoDoc = await db.collection("promos").doc(code).get();
        if (promoDoc.exists) {
            const discountPercent = promoDoc.data().percent || 0;
            price = price - (price * (discountPercent / 100));
            
            document.getElementById('displayAmount').innerText = price.toFixed(2) + " ج.م";
            document.getElementById('cashAmountText').innerText = price.toFixed(2) + " ج.م";
            alert("✅ تم تطبيق كود الخصم بنجاح!");
            init(); // إعادة فحص الرصيد بعد الخصم
        } else {
            alert("❌ كود الخصم غير صحيح");
        }
    }

    window.onload = init;
</script>
</body>
</html>
