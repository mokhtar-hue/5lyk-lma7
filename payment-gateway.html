<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة دفع المستشار | VIP 🛡️</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --accent: #10b981; --fawry: #ffc107; --cash: #ef4444; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        .payment-container { width: 95%; max-width: 480px; padding: 20px; animation: fadeIn 0.6s ease-out; }
        .main-card { background: var(--card); border-radius: 28px; padding: 35px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.08); text-align: center; }
        
        .price-display { background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(16, 185, 129, 0.1)); border-radius: 20px; padding: 25px; margin: 25px 0; border: 1px solid var(--primary); }
        .amount { font-size: 38px; font-weight: 900; color: var(--accent); text-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        
        .pay-option { background: rgba(255,255,255,0.03); border-radius: 18px; padding: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(255,255,255,0.05); text-align: right; position: relative; }
        .pay-option:hover { background: rgba(255,255,255,0.08); border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .pay-option i { font-size: 26px; width: 45px; text-align: center; }
        .pay-option h4 { margin: 0; font-size: 17px; font-weight: 700; }
        .pay-option p { margin: 0; font-size: 13px; opacity: 0.6; }

        .btn-wallet { border-right: 4px solid var(--accent); }
        .btn-fawry { border-right: 4px solid var(--fawry); }
        .btn-cash { border-right: 4px solid var(--cash); }

        .promo-box { display: flex; gap: 8px; margin-bottom: 25px; }
        .promo-box input { flex: 1; background: #070b14; border: 1px solid #334155; border-radius: 12px; color: white; padding: 12px; font-family: 'Cairo'; text-align: center; font-size: 14px; outline: none; }
        .promo-box button { background: var(--primary); border: none; color: white; border-radius: 12px; padding: 0 20px; cursor: pointer; font-weight: bold; transition: 0.3s; }

        #cashModal { display: none; background: rgba(0,0,0,0.92); position: fixed; inset: 0; z-index: 2000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); }
        .modal-content { background: var(--card); padding: 35px; border-radius: 25px; max-width: 400px; width: 100%; text-align: center; border: 1px solid var(--cash); }

        .wallet-badge { background: var(--accent); color: #000; padding: 3px 10px; border-radius: 8px; font-size: 11px; font-weight: 900; position: absolute; left: 15px; top: 50%; transform: translateY(-50%); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="payment-container">
    <div class="main-card">
        <h2 style="margin:0; letter-spacing: -1px;">بوابة دفع المستشار 🛡️</h2>
        <p style="opacity: 0.5; font-size: 13px; margin-top: 5px;">نظام دفع آمن ومشفر 100%</p>

        <div class="price-display">
            <p style="margin:0; font-size:13px; opacity: 0.8;">إجمالي المبلغ المطلوب</p>
            <div class="amount" id="displayAmount">0 ج.م</div>
            <p id="courseNameDisplay" style="margin:8px 0 0 0; font-size:14px; font-weight:bold; color: var(--primary);"></p>
        </div>

        <div class="promo-box">
            <input type="text" id="promoInput" placeholder="كود الخصم (اختياري)">
            <button onclick="applyPromo()">تفعيل</button>
        </div>

        <div id="optionsArea">
            <div class="pay-option btn-wallet" id="platformWallet" onclick="payWithPlatformWallet()" style="display: none;">
                <i class="fas fa-wallet" style="color: var(--accent);"></i>
                <div>
                    <h4>محفظة المنصة</h4>
                    <p>خصم فوري من رصيدك</p>
                </div>
                <span class="wallet-badge" id="currentBalance">0 ج.م</span>
            </div>

            <div class="pay-option btn-fawry" onclick="payWithFawry()">
                <i class="fas fa-bolt" style="color: var(--fawry);"></i>
                <div>
                    <h4>Fawry Pay</h4>
                    <p>دفع عبر كود فوري للمنافذ</p>
                </div>
            </div>

            <div class="pay-option btn-cash" onclick="showCashModal()">
                <i class="fas fa-university" style="color: var(--cash);"></i>
                <div>
                    <h4>محافظ كاش</h4>
                    <p>فودافون، اتصالات، أورانج</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="cashModal">
    <div class="modal-content">
        <i class="fas fa-paper-plane fa-3x" style="color:var(--cash); margin-bottom:20px;"></i>
        <h3 style="margin:0;">تحويل كاش يدوي</h3>
        <p style="font-size:14px; margin-top:15px;">حول مبلغ <b id="cashAmountText" style="color:var(--accent);"></b> للرقم:</p>
        <h2 style="background:#070b14; padding:15px; border-radius:15px; color:var(--cash); margin:15px 0; border: 1px dashed var(--cash); letter-spacing: 2px;">01550153566</h2>
        <p style="font-size:12px; opacity:0.7;">صور الإيصال وأرسله واتساب ليتم تفعيل الكورس.</p>
        <button onclick="confirmCashTransfer()" style="background:var(--accent); width:100%; border:none; padding:15px; border-radius:12px; color:white; font-weight:900; cursor:pointer; margin-top:10px;">إرسال الإشعار الآن</button>
        <button onclick="closeModal()" style="background:none; border:none; color:white; cursor:pointer; margin-top:15px; font-size:13px;">إغلاق النافذة</button>
    </div>
</div>

<script>
    // تهيئة Firebase
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    // جلب البيانات من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get('id');
    const courseName = urlParams.get('name') || "اشتراك كورس";
    let price = parseFloat(urlParams.get('price')) || 0;
    const userEmail = localStorage.getItem("userEmail");

    async function init() {
        if(!userEmail) { alert("خطأ: يرجى تسجيل الدخول أولاً"); return; }
        
        document.getElementById('displayAmount').innerText = price + " ج.م";
        document.getElementById('courseNameDisplay').innerText = courseName;
        document.getElementById('cashAmountText').innerText = price + " ج.م";

        try {
            const userDoc = await db.collection("users").doc(userEmail).get();
            if(userDoc.exists) {
                userBalance = userDoc.data().wallet || 0;
                document.getElementById('currentBalance').innerText = userBalance + " ج.م";
                // إظهار زر محفظة المنصة فقط إذا كان الرصيد كافياً
                document.getElementById('platformWallet').style.display = (userBalance >= price) ? 'flex' : 'none';
            }
        } catch (error) { console.log("Error fetching user data:", error); }
    }

    // 1. الدفع بمحفظة المنصة
    async function payWithPlatformWallet() {
        if(confirm(`تأكيد خصم ${price} ج.م من رصيدك وتفعيل الكورس؟`)) {
            const userRef = db.collection("users").doc(userEmail);
            try {
                await db.runTransaction(async (transaction) => {
                    const userSnap = await transaction.get(userRef);
                    const currentWallet = userSnap.data().wallet || 0;
                    if (currentWallet < price) throw "عذراً، رصيدك غير كافٍ";
                    
                    transaction.update(userRef, { wallet: currentWallet - price });
                    transaction.set(db.collection("subscriptions").doc(`${userEmail}_${courseId}`), {
                        email: userEmail, courseId: courseId, date: new Date(), method: "Platform_Wallet", status: "active"
                    });
                });
                alert("🎉 مبروك! تم تفعيل الكورس بنجاح.");
                window.location.href = "course_viewer.html?id=" + courseId;
            } catch(e) { alert(e); }
        }
    }

    // 2. الدفع عبر فوري
    function payWithFawry() {
        const refNum = Math.floor(Math.random() * 900000000);
        db.collection("payment_requests").add({
            email: userEmail, courseId: courseId, amount: price, method: "Fawry", refNum: refNum, status: "pending", date: new Date()
        }).then(() => {
            const merchantCode = "1T987654321"; // كود التاجر الخاص بك
            const fawryUrl = `https://www.fawrypay.com/atfawry/pay?merchant=${merchantCode}&amount=${price}&ref=${refNum}`;
            window.location.href = fawryUrl;
        });
    }

    // 3. المحفظة اليدوية
    function showCashModal() { document.getElementById('cashModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('cashModal').style.display = 'none'; }

    async function confirmCashTransfer() {
        await db.collection("payment_requests").add({
            email: userEmail, courseId: courseId, courseName: courseName, amount: price, 
            method: "E-Wallet (Manual)", status: "pending", date: new Date()
        });
        const msg = `أهلاً مستشار، لقد حولت مبلغ ${price} ج.م لكورس ${courseName}. إيميل الحساب: ${userEmail}`;
        window.open(`https://wa.me/201550153566?text=${encodeURIComponent(msg)}`, '_blank');
        closeModal();
    }

    async function applyPromo() {
        const code = document.getElementById('promoInput').value.trim();
        if(!code) return;
        try {
            const promoDoc = await db.collection("promos").doc(code).get();
            if(promoDoc.exists) {
                const disc = promoDoc.data().percent;
                price = price - (price * (disc / 100));
                document.getElementById('displayAmount').innerText = price + " ج.م";
                document.getElementById('cashAmountText').innerText = price + " ج.م";
                alert(`✅ تم تطبيق الخصم بنجاح! السعر الجديد: ${price} ج.م`);
                init(); // لإعادة فحص أزرار الدفع بعد الخصم
            } else { alert("❌ كود الخصم غير صحيح أو انتهت صلاحيته"); }
        } catch(e) { alert("خطأ في الاتصال بالخادم"); }
    }

    // بدء التشغيل
    window.onload = init;
</script>
</body>
</html>
