<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحاضرات | منصة المستشار</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; }
        
        .back-btn { background: var(--card); color: white; border: 1px solid var(--primary); padding: 8px 15px; border-radius: 10px; cursor: pointer; margin-bottom: 15px; }

        /* حاوية الفيديو مع الحماية */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 25px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 15px;
            border: 3px solid var(--primary);
            overflow: hidden;
            display: none; /* تظهر عند اختيار فيديو */
        }

        #playerFrame { width: 100%; height: 100%; border: none; }

        /* العلامة المائية المتحركة */
        #watermark {
            position: absolute;
            top: 10%;
            left: 10%;
            color: rgba(255, 255, 255, 0.3); /* شفافة جداً */
            font-size: 12px;
            font-weight: bold;
            pointer-events: none; /* عشان ميعطلش التاتش على الفيديو */
            z-index: 999;
            white-space: nowrap;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            transition: all 2s linear; /* حركة ناعمة */
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; text-align: center; cursor: pointer; border: 1px solid #334155; transition: 0.3s; }
        .card:hover { transform: scale(1.05); border-color: var(--primary); }
        .card i { font-size: 30px; color: var(--primary); margin-bottom: 10px; }
    </style>
</head>
<body>

    <button class="back-btn" onclick="location.href='home.html'">⬅️ العودة للرئيسية</button>

    <h3 style="text-align:center;">🎥 محاضراتك التعليمية</h3>

    <div id="videoArea" class="video-wrapper">
        <div id="watermark"></div> <div id="player" style="width:100%; height:100%;"></div>
    </div>

    <div id="lessonsGrid" class="grid">
        <p>جاري تحميل المحاضرات...</p>
    </div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // جلب اسم الطالب للعلامة المائية
    const studentName = localStorage.getItem("userName") || "حساب غير مسجل";
    const watermark = document.getElementById('watermark');
    watermark.innerText = studentName;

    // وظيفة تحريك العلامة المائية بشكل عشوائي
    function moveWatermark() {
        const x = Math.random() * 80; // نسبة مئوية من العرض
        const y = Math.random() * 80; // نسبة مئوية من الطول
        watermark.style.top = y + "%";
        watermark.style.left = x + "%";
    }
    setInterval(moveWatermark, 4000); // تتحرك كل 4 ثواني

    // جلب الفيديوهات
    db.collection("lessons").orderBy("createdAt", "desc").onSnapshot(snap => {
        const grid = document.getElementById('lessonsGrid');
        grid.innerHTML = "";
        
        snap.forEach(doc => {
            const lesson = doc.data();
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div style="font-size:30px;">🎬</div><div style="font-size:13px; font-weight:bold; margin-top:10px;">${lesson.title}</div>`;
            
            card.onclick = function() {
                document.getElementById('videoArea').style.display = "block";
                const player = document.getElementById('player');
                
                // تنظيف وحقن كود الفيديو (iframe)
                player.innerHTML = lesson.url; 
                
                // التأكد أن الـ iframe يملأ المساحة المحمية
                const iframe = player.querySelector('iframe');
                if(iframe) {
                    iframe.style.width = "100%";
                    iframe.style.height = "100%";
                }
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            grid.appendChild(card);
        });
    });
</script>

</body>
</html>
