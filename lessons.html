<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>المحاضرات المؤمنة | منصة المستشار</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        
        * { 
            -webkit-user-select: none; 
            user-select: none; 
            -webkit-touch-callout: none; 
            outline: none;
        }
        
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; overflow-x: hidden; }
        
        .back-btn { background: var(--card); color: white; border: 1px solid var(--primary); padding: 8px 15px; border-radius: 10px; cursor: pointer; margin-bottom: 15px; transition: 0.3s; }
        .back-btn:hover { background: var(--primary); }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 850px;
            margin: 0 auto 25px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 15px;
            border: 3px solid var(--primary);
            overflow: hidden;
            display: none; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: opacity 0.3s ease;
        }

        #watermark {
            position: absolute;
            z-index: 9999;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            transition: all 0.8s ease-in-out;
            background: rgba(0,0,0,0.1);
            padding: 4px 8px;
            border-radius: 5px;
        }

        /* حالة الحماية - تعتيم الشاشة */
        .security-blur {
            filter: blur(20px) grayscale(1);
            opacity: 0.1;
            pointer-events: none;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; text-align: center; cursor: pointer; border: 1px solid #334155; transition: 0.3s; }
        .card:hover { transform: scale(1.03); border-color: var(--primary); background: #243147; }
        .card i { font-size: 35px; color: var(--primary); margin-bottom: 10px; }

        @media print { body { display: none !important; } }
    </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;">

    <button class="back-btn" onclick="location.href='home.html'"><i class="fas fa-chevron-right"></i> العودة للرئيسية</button>

    <h3 id="pageTitle" style="text-align:center; margin-bottom: 20px;">🎥 محاضراتك التعليمية (منطقة آمنة)</h3>

    <div id="videoArea" class="video-wrapper">
        <div id="watermark">...</div>
        <div id="player" style="width:100%; height:100%;"></div>
    </div>

    <div id="lessonsGrid" class="grid">
        <p style="text-align:center; width:100%">جاري تحميل المحاضرات المؤمنة...</p>
    </div>

<script>
    // 1. إعدادات Firebase
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 2. إعدادات العلامة المائية
    const studentName = localStorage.getItem("userName") || "طالب مستشار";
    const studentPhone = localStorage.getItem("userPhone") || "مستخدم منصة";
    const watermark = document.getElementById('watermark');
    watermark.innerText = `${studentName} | ${studentPhone}`;

    function moveWatermark() {
        const x = Math.random() * 70;
        const y = Math.random() * 85;
        watermark.style.top = y + "%";
        watermark.style.left = x + "%";
    }
    setInterval(moveWatermark, 3000);

    // 3. نظام الحماية المرن (بدون تسجيل خروج)
    function applyProtection(enable) {
        const videoWrapper = document.getElementById('videoArea');
        if (enable) {
            videoWrapper.classList.add('security-blur');
            console.warn("⚠️ تم تفعيل حماية المحتوى بسبب نشاط خارجي");
        } else {
            videoWrapper.classList.remove('security-blur');
        }
    }

    // أ- منع الاختصارات
    document.addEventListener('keydown', function(e) {
        const forbiddenKeys = [
            "PrintScreen", "F12", 
            (e.ctrlKey && e.shiftKey && e.key === 'I'),
            (e.ctrlKey && e.shiftKey && e.key === 'J'),
            (e.ctrlKey && e.shiftKey && e.key === 'C'),
            (e.ctrlKey && e.key === 'u'),
            (e.ctrlKey && e.key === 'p'),
            (e.ctrlKey && e.key === 's'),
            (e.metaKey && e.shiftKey && e.key === 's'),
            (e.metaKey && e.shiftKey && e.key === '4')
        ];

        if (forbiddenKeys.some(key => key === true || e.key === key)) {
            e.preventDefault();
            alert("⚠️ عذراً: تصوير الشاشة أو استخدام أدوات المطور غير مسموح به.");
        }
    });

    // ب- مراقبة التركيز (Blur/Focus)
    // عند محاولة فتح برنامج خارجي أو سحب أداة تصوير، الفيديو يتشفر
    window.addEventListener('blur', function() {
        applyProtection(true);
    });
    
    window.addEventListener('focus', function() {
        applyProtection(false);
    });

    // ج- مراقبة تبديل التابات
    document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'hidden') {
            applyProtection(true);
        } else {
            applyProtection(false);
        }
    });

    // 4. جلب المحاضرات
    db.collection("lessons").orderBy("createdAt", "desc").onSnapshot(snap => {
        const grid = document.getElementById('lessonsGrid');
        grid.innerHTML = "";
        
        if (snap.empty) {
            grid.innerHTML = "<p style='text-align:center; width:100%'>لا توجد محاضرات متاحة حالياً.</p>";
            return;
        }

        snap.forEach(doc => {
            const lesson = doc.data();
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<i class="fas fa-play-circle"></i><div style="font-size:14px; font-weight:bold; margin-top:10px;">${lesson.title}</div>`;
            
            card.onclick = function() {
                const videoArea = document.getElementById('videoArea');
                const player = document.getElementById('player');
                videoArea.style.display = "block";
                player.innerHTML = lesson.url; 
                
                const iframe = player.querySelector('iframe');
                if(iframe) {
                    iframe.style.width = "100%";
                    iframe.style.height = "100%";
                    iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            grid.appendChild(card);
        });
    });

    document.addEventListener('dragstart', (e) => e.preventDefault());
</script>

</body>
</html>
