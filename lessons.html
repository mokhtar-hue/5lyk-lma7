<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>المحاضرات المؤمنة | منصة المستشار</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        
        /* منع تحديد النصوص نهائياً */
        * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; }
        
        .back-btn { background: var(--card); color: white; border: 1px solid var(--primary); padding: 8px 15px; border-radius: 10px; cursor: pointer; margin-bottom: 15px; }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 850px;
            margin: 0 auto 25px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 15px;
            border: 3px solid var(--primary);
            overflow: hidden;
            display: none; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #watermark {
            position: absolute;
            z-index: 999;
            color: rgba(255, 255, 255, 0.25);
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            transition: all 1.2s linear;
            background: rgba(0,0,0,0.1);
            padding: 3px 7px;
            border-radius: 5px;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; text-align: center; cursor: pointer; border: 1px solid #334155; transition: 0.3s; }
        .card:hover { transform: scale(1.03); border-color: var(--primary); }
        .card i { font-size: 35px; color: var(--primary); margin-bottom: 10px; }

        /* حماية الطباعة وتصوير الشاشة ببرامج معينة */
        @media print { body { display: none !important; } }
    </style>
</head>
<body oncontextmenu="return false;">

    <button class="back-btn" onclick="location.href='home.html'"><i class="fas fa-chevron-right"></i> العودة للرئيسية</button>

    <h3 style="text-align:center; margin-bottom: 20px;">🎥 محاضراتك التعليمية (محمي)</h3>

    <div id="videoArea" class="video-wrapper">
        <div id="watermark">...</div>
        <div id="player" style="width:100%; height:100%;"></div>
    </div>

    <div id="lessonsGrid" class="grid">
        <p style="text-align:center; width:100%">جاري تحميل المحاضرات المؤمنة...</p>
    </div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const studentName = localStorage.getItem("userName") || "طالب مستجد";
    const studentEmail = localStorage.getItem("userEmail") || "ID_Protected";
    const watermark = document.getElementById('watermark');
    watermark.innerText = `${studentName} | ${studentEmail}`;

    // تحريك العلامة المائية بشكل عشوائي "سريع" لتشتيت محاولات التسجيل
    function moveWatermark() {
        const x = Math.random() * 75;
        const y = Math.random() * 80;
        watermark.style.top = y + "%";
        watermark.style.left = x + "%";
    }
    setInterval(moveWatermark, 2000);

    // دالة الطرد والعقاب
    function securityBlock() {
        alert("⚠️ محاولة غير مصرح بها! التقاط الشاشة أو التسجيل ممنوع تماماً. تم تسجيل خروجك لحماية حقوق المستشار.");
        localStorage.removeItem("isLoggedIn");
        location.href = 'login.html';
    }

    // 1. منع اختصارات لوحة المفاتيح (Screenshot, PrintScreen, Inspect)
    document.addEventListener('keydown', function(e) {
        if (
            e.key === "PrintScreen" || e.keyCode === 44 || 
            (e.ctrlKey && e.key === "p") || // الطباعة
            (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "S" || e.key === "C" || e.key === "J")) || // التفتيش
            (e.ctrlKey && e.key === "u") || // رؤية المصدر
            (e.metaKey && e.shiftKey && e.key === "s") // ماك
        ) {
            e.preventDefault();
            securityBlock();
        }
    });

    // 2. مراقبة أدوات المطور (فتح الـ Console)
    let devtools = function() {};
    devtools.toString = function() {
        securityBlock();
        return "!!!";
    }
    console.log("%c", devtools);

    // 3. مراقبة التركيز (لو الطالب فتح برنامج خارجي زي OBS أو Camtasia)
    window.addEventListener('blur', function() {
        // إيقاف الفيديو مؤقتاً أو التنبيه عند الخروج من التاب
        const iframe = document.querySelector('iframe');
        if(iframe) {
            iframe.style.opacity = "0.1"; // تعتيم الفيديو عند محاولة التسجيل الخارجي
        }
    });
    window.addEventListener('focus', function() {
        const iframe = document.querySelector('iframe');
        if(iframe) { iframe.style.opacity = "1"; }
    });

    // جلب الفيديوهات
    db.collection("lessons").orderBy("createdAt", "desc").onSnapshot(snap => {
        const grid = document.getElementById('lessonsGrid');
        grid.innerHTML = "";
        
        snap.forEach(doc => {
            const lesson = doc.data();
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<i class="fas fa-play-circle"></i><div style="font-size:14px; font-weight:bold; margin-top:10px;">${lesson.title}</div>`;
            
            card.onclick = function() {
                document.getElementById('videoArea').style.display = "block";
                const player = document.getElementById('player');
                player.innerHTML = lesson.url; 
                
                const iframe = player.querySelector('iframe');
                if(iframe) {
                    iframe.style.width = "100%";
                    iframe.style.height = "100%";
                    // نظام Sandbox لمنع الانتقال لليوتيوب
                    iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            grid.appendChild(card);
        });
    });
</script>

</body>
</html>
