<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>المحاضرات المؤمنة | منصة المستشار</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; }
        
        * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; overflow-x: hidden; }
        
        .back-btn { background: var(--card); color: white; border: 1px solid var(--primary); padding: 8px 15px; border-radius: 10px; cursor: pointer; margin-bottom: 15px; transition: 0.3s; }

        /* الحاوية المحصنة */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto 30px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 20px;
            border: 4px solid #334155;
            overflow: hidden;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* طبقة حماية تمنع النقر على أطراف الفيديو (لوجو يوتيوب والروابط) */
        .video-protection-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            cursor: default;
            /* تسمح فقط بالنقرات في المنتصف للتشغيل */
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 0%, 15% 15%, 15% 85%, 85% 85%, 85% 15%, 15% 15%);
            background: rgba(0,0,0,0.01);
        }

        #player iframe { width: 100%; height: 100%; border: none; }

        /* العلامة المائية */
        #watermark {
            position: absolute;
            z-index: 9999;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
            white-space: nowrap;
            background: rgba(0,0,0,0.2);
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.8s ease-in-out;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .card { background: var(--card); padding: 25px; border-radius: 18px; text-align: center; cursor: pointer; border: 1px solid #334155; transition: 0.4s; }
        .card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .card i { font-size: 40px; color: var(--primary); margin-bottom: 15px; }

        @media print { body { display: none !important; } }
    </style>
</head>
<body oncontextmenu="return false;">

    <button class="back-btn" onclick="location.href='home.html'"><i class="fas fa-arrow-right"></i> العودة للرئيسية</button>

    <h2 style="text-align:center; margin-bottom: 25px;">🎥 محاضراتي التعليمية</h2>

    <div id="videoArea" class="video-container">
        <div id="watermark">...</div>
        <div class="video-protection-layer"></div>
        <div id="player"></div>
    </div>

    <div id="lessonsGrid" class="grid">
        <p style="text-align:center; width: 100%;">جاري تأمين الاتصال بالسحابة...</p>
    </div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const studentName = localStorage.getItem("userName") || "طالب غير مسجل";
    const studentEmail = localStorage.getItem("userEmail") || "Unregistered";
    const watermark = document.getElementById('watermark');
    watermark.innerText = `${studentName} | ${studentEmail}`;

    // تحريك العلامة المائية بشكل عشوائي ومستمر
    function moveWatermark() {
        const x = Math.random() * 80; 
        const y = Math.random() * 90; 
        watermark.style.top = y + "%";
        watermark.style.left = x + "%";
    }
    setInterval(moveWatermark, 2500);

    // وظيفة العقاب (إعادة تسجيل الدخول)
    function punishUser() {
        alert("⚠️ تنبيه أمني: تم رصد محاولة التقاط شاشة أو تسجيل فيديو. لا تحاول سرقة المحتوى لضمان استمرار حسابك.");
        localStorage.removeItem("isLoggedIn"); // نفترض أن هذا متغير الدخول
        location.href = "login.html"; // توجيه لصفحة تسجيل الدخول
    }

    // رصد محاولات لقطة الشاشة والتسجيل
    document.addEventListener('keydown', function(e) {
        // منع PrintScreen و Win+Shift+S و اختصارات التفتيش
        if (e.key === "PrintScreen" || e.keyCode === 44) {
            punishUser();
        }
        if (
            e.key === "F12" || 
            (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "C" || e.key === "J")) ||
            (e.ctrlKey && e.key === "u") ||
            (e.metaKey && e.shiftKey && e.key === "s") // Mac screenshot
        ) {
            e.preventDefault();
            punishUser();
        }
    });

    // رصد خسارة التركيز (Blur) اللي بتحصل غالباً لما برنامج تسجيل يفتح
    window.addEventListener('blur', function() {
        // اختياري: يمكنك وضع لوجيك هنا لو عاوز تفرمله لو خرج بره التاب
    });

    // تحميل المحاضرات من Firebase
    db.collection("lessons").orderBy("createdAt", "desc").onSnapshot(snap => {
        const grid = document.getElementById('lessonsGrid');
        grid.innerHTML = "";
        
        snap.forEach(doc => {
            const lesson = doc.data();
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<i class="fas fa-play"></i><div style="font-weight:bold; margin-top:10px;">${lesson.title}</div>`;
            
            card.onclick = function() {
                document.getElementById('videoArea').style.display = "block";
                const player = document.getElementById('player');
                
                // تنظيف الرابط وإضافة بارامترات الحماية القصوى
                let videoUrl = lesson.url; 
                // نعدل الـ iframe لإخفاء كل ما يخص يوتيوب
                if(videoUrl.includes('youtube.com/embed/')) {
                    const separator = videoUrl.includes('?') ? '&' : '?';
                    videoUrl = videoUrl.replace('src="', 'src="' + videoUrl); // تصحيح لو الرابط جاي كامل
                    // إضافة بارامترات المنع: disablekb (تعطيل الكيبورد)، rel=0 (عدم عرض فيديوهات أخرى)، modestbranding (إخفاء اللوجو)
                    videoUrl = videoUrl.replace('"', separator + 'rel=0&modestbranding=1&showinfo=0&controls=1&disablekb=1&iv_load_policy=3"');
                }

                player.innerHTML = videoUrl; 
                const iframe = player.querySelector('iframe');
                if(iframe) {
                    iframe.style.width = "100%";
                    iframe.style.height = "100%";
                    // منع إرسال بيانات الخروج
                    iframe.setAttribute('sandbox', 'allow-forms allow-scripts allow-same-origin');
                }
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            grid.appendChild(card);
        });
    });

    // تعطيل كليك يمين نهائياً
    document.addEventListener('contextmenu', event => event.preventDefault());
</script>

</body>
</html>
