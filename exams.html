<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المستشار | بوابة الامتحانات</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --accent: #22c55e; --danger: #ef4444; --info: #3b82f6; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #f1f5f9; margin: 0; overflow-x: hidden; }
        
        /* Navbar */
        .navbar { display: flex; justify-content: space-between; padding: 12px 5%; background: var(--card); align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #334155; }
        .nav-right { display: flex; gap: 10px; }
        
        .btn { padding: 10px 18px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; font-family: 'Cairo'; transition: 0.3s; display: flex; align-items: center; gap: 8px; font-size: 14px; text-decoration: none; }
        .btn-home { background: #475569; color: white; }
        .btn-dash { background: rgba(99,102,241,0.2); color: var(--primary); border: 1px solid var(--primary); }
        
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }

        /* Dashboard */
        .exam-item { 
            background: var(--card); padding: 20px; border-radius: 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid #334155; margin-bottom: 15px;
        }
        .exam-item.locked { border-right: 5px solid var(--accent); opacity: 0.85; }

        /* Quiz & Review Areas */
        #quizArea, #reviewArea { display: none; background: var(--card); padding: 30px; border-radius: 25px; border: 1px solid #334155; animation: fadeIn 0.5s; }
        
        .q-text { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #fff; line-height: 1.6; }
        
        /* Options & Textarea */
        .opt-btn { 
            background: rgba(255,255,255,0.03); border: 2px solid #334155; padding: 15px; 
            border-radius: 15px; cursor: pointer; transition: 0.2s; text-align: right; color: #cbd5e1; margin-bottom: 10px; width: 100%; font-family: 'Cairo'; font-size: 16px;
        }
        .opt-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        .essay-input {
            width: 100%; height: 150px; background: rgba(0,0,0,0.2); border: 2px solid #334155;
            color: white; border-radius: 15px; padding: 15px; font-family: 'Cairo'; font-size: 16px;
            resize: vertical; box-sizing: border-box; outline: none; transition: 0.3s;
        }
        .essay-input:focus { border-color: var(--primary); background: rgba(0,0,0,0.4); }

        /* Review Colors */
        .rev-card { background: rgba(255,255,255,0.02); padding: 20px; border-radius: 15px; margin-bottom: 15px; border-right: 4px solid #334155; }
        .rev-correct { border-right-color: var(--accent); background: rgba(34, 197, 94, 0.05); }
        .rev-wrong { border-right-color: var(--danger); background: rgba(239, 68, 68, 0.05); }
        .rev-essay { border-right-color: var(--info); background: rgba(59, 130, 246, 0.05); }
        .ans-label { font-size: 14px; font-weight: bold; display: block; margin-top: 10px; }

        .progress-bar { height: 6px; background: var(--primary); position: fixed; top: 0; left: 0; transition: 0.4s; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="progress-bar" id="progressBar" style="width: 0%"></div>

<nav class="navbar">
    <div class="nav-right">
        <a href="home.html" class="btn btn-home"><i class="fas fa-home"></i> الرئيسية</a>
        <a href="student-dash.html" class="btn btn-dash"><i class="fas fa-chart-pie"></i> لوحة النتائج</a>
    </div>
    <div id="timerDisplay" style="font-weight:900; color:#fbbf24;">00:00</div>
</nav>

<div class="container">
    <div id="dashboard">
        <h2 style="margin-bottom: 5px;">أهلاً يا <span id="studentNameLabel">مستشار</span> 🚀</h2>
        <p style="color: #94a3b8; margin-bottom: 25px;">اختر اختباراً لتبدأ التحدي. تذكر أنه لا يمكنك إعادة الاختبار بعد التسليم.</p>
        <div id="examsList">جاري تحميل الامتحانات المتاحة...</div>
    </div>

    <div id="quizArea">
        <div style="display:flex; justify-content:space-between; color:#94a3b8; margin-bottom:15px; font-weight:bold;">
            <span id="qCount">السؤال 1</span>
            <span id="qPoints" style="color: var(--primary);"></span>
        </div>
        <div id="qBody" class="q-text"></div>
        <div id="answersContainer"></div>
        
        <div style="display:flex; justify-content:space-between; margin-top:30px;">
            <button class="btn btn-home" onclick="prevQ()">السابق</button>
            <button class="btn" id="nextBtn" onclick="nextQ()" style="background:var(--primary); color:white;">التالي</button>
            <button class="btn" id="finishBtn" onclick="submitExam()" style="background:var(--accent); color:white; display:none;"><i class="fas fa-check-double"></i> إنهاء وتسليم</button>
        </div>
    </div>

    <div id="reviewArea">
        <div style="text-align:center; margin-bottom:30px;">
            <h2 id="resultTitle">نتيجة الاختبار</h2>
            <div id="scoreCircle" style="font-size:45px; font-weight:900; color:var(--accent)">0/0</div>
            <p style="color: #94a3b8; font-size: 14px;">* الأسئلة المقالية لا تدخل في المجموع التلقائي حتى يصححها المعلم.</p>
        </div>
        <div id="reviewList"></div>
        <button class="btn btn-dash" style="width:100%; margin-top:20px; justify-content:center;" onclick="location.reload()"><i class="fas fa-arrow-right"></i> العودة لقائمة الامتحانات</button>
    </div>
</div>

<script>
    // إعدادات Firebase (لا تغيرها)
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // بيانات الطالب
    const userEmail = localStorage.getItem("userEmail") || "test@test.com";
    const userName = localStorage.getItem("userName") || "طالب مميز";
    document.getElementById('studentNameLabel').innerText = userName.split(' ')[0];

    let questions = [];
    let currentIdx = 0;
    let studentAnswers = [];
    let currentQuiz = null;
    let timerInterval;
    let timeLeft = 0;

    // 1. تحميل الاختبارات وفحص ما تم حله
    async function loadExams() {
        const examsSnap = await db.collection("quizzes").orderBy("createdAt", "desc").get();
        const resultsSnap = await db.collection("results").where("studentEmail", "==", userEmail).get();
        
        // جلب معرفات الامتحانات التي تم حلها
        const takenIds = resultsSnap.docs.map(d => d.data().quizId);

        const list = document.getElementById('examsList');
        list.innerHTML = "";

        if (examsSnap.empty) {
            list.innerHTML = "<p style='color:#94a3b8; text-align:center;'>لا توجد اختبارات متاحة حالياً.</p>";
            return;
        }

        examsSnap.forEach(doc => {
            const q = doc.data();
            const isTaken = takenIds.includes(doc.id);
            list.innerHTML += `
                <div class="exam-item ${isTaken ? 'locked' : ''}">
                    <div>
                        <h3 style="margin:0; font-size:18px;">${q.title}</h3>
                        <small style="color:#94a3b8">${q.questions.length} سؤال • ${q.duration} دقيقة</small>
                    </div>
                    ${isTaken ? 
                        `<button class="btn" style="background:#1e293b; color:var(--accent); border:1px solid var(--accent)" onclick="viewOldResult('${doc.id}')"><i class="fas fa-eye"></i> النتيجة</button>` : 
                        `<button class="btn" style="background:var(--primary); color:white" onclick="startExam('${doc.id}')"><i class="fas fa-play"></i> ابدأ الآن</button>`
                    }
                </div>`;
        });
    }
    loadExams();

    // 2. بدء الامتحان
    async function startExam(id) {
        const doc = await db.collection("quizzes").doc(id).get();
        currentQuiz = { ...doc.data(), id: doc.id };
        questions = currentQuiz.questions;
        
        // تهيئة مصفوفة الإجابات
        studentAnswers = new Array(questions.length).fill(null);
        currentIdx = 0;
        timeLeft = currentQuiz.duration * 60;

        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('quizArea').style.display = 'block';
        
        startTimer();
        renderQuestion();
    }

    // 3. عرض السؤال (يدعم الاختياري والمقالي)
    function renderQuestion() {
        const q = questions[currentIdx];
        document.getElementById('qCount').innerText = `السؤال ${currentIdx + 1} من ${questions.length}`;
        document.getElementById('qPoints').innerText = `(${q.points || 1} درجات)`;
        document.getElementById('qBody').innerText = q.question;
        
        const container = document.getElementById('answersContainer');
        container.innerHTML = "";

        // فحص نوع السؤال: هل هو اختياري أم مقالي؟
        const isEssay = !q.options || q.options.length === 0 || q.type === 'essay';

        if (isEssay) {
            // عرض حقل نصي للمقالي
            const textarea = document.createElement('textarea');
            textarea.className = 'essay-input';
            textarea.placeholder = "اكتب إجابتك المقالية بالتفصيل هنا...";
            textarea.value = studentAnswers[currentIdx] || "";
            textarea.oninput = (e) => { studentAnswers[currentIdx] = e.target.value; };
            container.appendChild(textarea);
        } else {
            // عرض أزرار الاختيارات
            q.options.forEach((opt, i) => {
                const b = document.createElement('div');
                b.className = `opt-btn ${studentAnswers[currentIdx] === i ? 'active' : ''}`;
                b.innerText = opt;
                b.onclick = () => { studentAnswers[currentIdx] = i; renderQuestion(); };
                container.appendChild(b);
            });
        }

        // تحديث شريط التقدم وأزرار التنقل
        document.getElementById('progressBar').style.width = ((currentIdx + 1) / questions.length) * 100 + "%";
        const isLast = currentIdx === questions.length - 1;
        document.getElementById('nextBtn').style.display = isLast ? 'none' : 'block';
        document.getElementById('finishBtn').style.display = isLast ? 'block' : 'none';
    }

    function nextQ() { if(currentIdx < questions.length -1) { currentIdx++; renderQuestion(); } }
    function prevQ() { if(currentIdx > 0) { currentIdx--; renderQuestion(); } }

    // 4. المؤقت الزمني
    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            if(timeLeft <= 0) submitExam(); // تسليم إجباري عند انتهاء الوقت
        }, 1000);
    }

    // 5. تسليم الامتحان وحفظ النتيجة في القاعدة
    async function submitExam() {
        if(!confirm("هل أنت متأكد من تسليم الامتحان؟ لا يمكنك التعديل بعد التسليم.")) return;
        
        clearInterval(timerInterval);
        document.getElementById('finishBtn').innerText = "جاري التسليم...";
        document.getElementById('finishBtn').disabled = true;

        let score = 0;
        let totalMCQPoints = 0;

        const analysis = questions.map((q, i) => {
            const isEssay = !q.options || q.options.length === 0 || q.type === 'essay';
            const points = parseInt(q.points || 1);
            
            if (isEssay) {
                // معالجة المقالي
                return {
                    question: q.question,
                    isEssay: true,
                    studentAns: studentAnswers[i] || "لم يتم كتابة إجابة",
                    correctAns: "إجابة مقالية",
                    isCorrect: null, // سيتم تصحيحها لاحقاً
                    points: points
                };
            } else {
                // معالجة الاختياري
                totalMCQPoints += points;
                const isCorrect = (studentAnswers[i] === parseInt(q.correctIndex));
                if(isCorrect) score += points;
                
                return {
                    question: q.question,
                    isEssay: false,
                    studentAns: studentAnswers[i] !== null ? q.options[studentAnswers[i]] : "لم يتم الحل",
                    correctAns: q.options[q.correctIndex],
                    isCorrect: isCorrect,
                    points: points
                };
            }
        });

        const resultData = {
            studentEmail: userEmail,
            studentName: userName,
            quizId: currentQuiz.id,
            examTitle: currentQuiz.title,
            score: score,
            totalMCQPoints: totalMCQPoints, // المجموع للأسئلة الاختيارية فقط
            analysis: analysis,
            submittedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        // الرفع لـ Firebase
        await db.collection("results").add(resultData);
        showReviewPanel(score, totalMCQPoints, analysis);
    }

    // 6. لوحة المراجعة وعرض التقرير
    function showReviewPanel(score, totalMCQPoints, analysis) {
        document.getElementById('quizArea').style.display = 'none';
        document.getElementById('reviewArea').style.display = 'block';
        
        // عرض الدرجة (مجموع الاختياري فقط حالياً)
        document.getElementById('scoreCircle').innerText = `${score} / ${totalMCQPoints}`;
        
        const list = document.getElementById('reviewList');
        list.innerHTML = "";

        analysis.forEach((res, i) => {
            if (res.isEssay) {
                // قالب الإجابة المقالية
                list.innerHTML += `
                    <div class="rev-card rev-essay">
                        <strong>س${i+1} [مقالي]: ${res.question}</strong>
                        <span class="ans-label" style="color:var(--info)">
                            إجابتك: ${res.studentAns}
                        </span>
                        <span style="display:block; margin-top:8px; font-size:12px; color:#94a3b8;">
                            <i class="fas fa-clock"></i> هذه الإجابة في انتظار تصحيح المستشار.
                        </span>
                    </div>`;
            } else {
                // قالب الإجابة الاختيارية
                list.innerHTML += `
                    <div class="rev-card ${res.isCorrect ? 'rev-correct' : 'rev-wrong'}">
                        <strong>س${i+1}: ${res.question}</strong>
                        <span class="ans-label" style="color:${res.isCorrect ? 'var(--accent)' : 'var(--danger)'}">
                            إجابتك: ${res.studentAns} ${res.isCorrect ? '<i class="fas fa-check"></i>' : '<i class="fas fa-times"></i>'}
                        </span>
                        ${!res.isCorrect ? `<span class="ans-label" style="color:var(--accent)">الإجابة الصحيحة: ${res.correctAns}</span>` : ''}
                    </div>`;
            }
        });
    }

    // 7. عرض نتيجة قديمة تم حلها مسبقاً
    async function viewOldResult(quizId) {
        const snap = await db.collection("results")
            .where("studentEmail", "==", userEmail)
            .where("quizId", "==", quizId)
            .get();
        
        if(!snap.empty) {
            const data = snap.docs[0].data();
            document.getElementById('dashboard').style.display = 'none';
            showReviewPanel(data.score, data.totalMCQPoints || '?', data.analysis);
        }
    }
</script>
</body>
</html>
