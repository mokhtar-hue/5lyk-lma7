<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاختبارات الذكية | المستشار</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --accent: #22c55e; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #f1f5f9; margin: 0; overflow-x: hidden; }
        
        /* شريط التقدم العلوي */
        .progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 6px; background: #334155; z-index: 1000; }
        #progressBar { height: 100%; background: var(--primary); width: 0%; transition: 0.3s; box-shadow: 0 0 10px var(--primary); }

        .navbar { display: flex; justify-content: space-between; padding: 15px 5%; background: var(--card); align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .user-chip { background: rgba(99,102,241,0.1); padding: 5px 15px; border-radius: 20px; border: 1px solid var(--primary); font-size: 14px; }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }

        /* كرت الامتحان */
        .quiz-card { background: var(--card); padding: 40px; border-radius: 30px; border: 1px solid #334155; position: relative; display: none; }
        .question-header { display: flex; justify-content: space-between; margin-bottom: 25px; align-items: center; }
        .q-text { font-size: 22px; font-weight: 700; line-height: 1.6; }
        
        .options-grid { display: grid; gap: 15px; margin-top: 25px; }
        .opt-btn { 
            background: rgba(255,255,255,0.03); border: 2px solid #334155; padding: 18px; 
            border-radius: 15px; cursor: pointer; transition: 0.2s; text-align: right; color: #cbd5e1; font-size: 16px;
        }
        .opt-btn:hover { background: rgba(99,102,241,0.1); border-color: var(--primary); }
        .opt-btn.active { background: var(--primary); border-color: var(--primary); color: white; transform: scale(1.02); }

        .timer-box { font-size: 24px; font-weight: 900; color: #fbbf24; display: flex; align-items: center; gap: 10px; }
        
        .footer-nav { display: flex; justify-content: space-between; margin-top: 30px; }
        .btn { padding: 12px 30px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-next { background: var(--primary); color: white; }
        .btn-finish { background: var(--accent); color: white; display: none; }

        /* واجهة لوحة الإنجازات المدمجة */
        #dashboard { display: block; }
        .exam-item { 
            background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 15px; 
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155;
        }
    </style>
</head>
<body>

<div class="progress-container"><div id="progressBar"></div></div>

<nav class="navbar">
    <div class="timer-box" id="timerDisplay"><i class="fas fa-clock"></i> 00:00</div>
    <div class="user-chip" id="userBadge"><i class="fas fa-user-graduate"></i> جاري التعرف عليك..</div>
</nav>

<div class="container">
    <div id="dashboard">
        <h2 style="margin-bottom: 5px;">أهلاً بك يا بطل 🚀</h2>
        <p style="color: #94a3b8; margin-bottom: 30px;">اختر اختباراً لتبدأ التحدي أو راجع نتائجك السابقة.</p>
        
        <div id="examsGrid">
            </div>
    </div>

    <div id="quizArea" class="quiz-card">
        <div class="question-header">
            <span class="badge" id="qCounter">السؤال 1 من 10</span>
            <span id="qPoints" style="color: var(--accent);">+5 درجات</span>
        </div>
        <div class="q-text" id="qBody">جاري تحميل السؤال...</div>
        
        <div class="options-grid" id="optionsArea"></div>

        <div class="footer-nav">
            <button class="btn" style="background:#475569; color:white" onclick="prevQ()">السابق</button>
            <button class="btn btn-next" id="nextBtn" onclick="nextQ()">التالي</button>
            <button class="btn btn-finish" id="finishBtn" onclick="submitExam()">تسجيل الإجابات وإنهاء الاختبار</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 1. التعرف التلقائي على الطالب
    const userEmail = localStorage.getItem("userEmail");
    const userName = localStorage.getItem("userName") || "طالب مستجد";

    if(!userEmail) {
        alert("لم يتم العثور على بياناتك، سيتم توجيهك لتسجيل الدخول.");
        window.location.href = "login.html";
    } else {
        document.getElementById('userBadge').innerHTML = `<i class="fas fa-user-check"></i> ${userName}`;
        loadAvailableExams();
    }

    let currentQuiz = null;
    let questions = [];
    let currentIdx = 0;
    let answers = [];
    let timeLeft = 0;
    let timerInterval;

    // 2. تحميل الامتحانات المتاحة
    async function loadAvailableExams() {
        const snap = await db.collection("quizzes").orderBy("createdAt", "desc").get();
        const grid = document.getElementById('examsGrid');
        grid.innerHTML = "";
        
        snap.forEach(doc => {
            const data = doc.data();
            grid.innerHTML += `
                <div class="exam-item">
                    <div>
                        <h4 style="margin:0">${data.title}</h4>
                        <small style="color:#94a3b8">${data.questions.length} سؤال • ${data.duration} دقيقة</small>
                    </div>
                    <button class="btn btn-next" onclick="startExam('${doc.id}')">ابدأ الآن</button>
                </div>`;
        });
    }

    // 3. بدء الامتحان
    async function startExam(id) {
        const doc = await db.collection("quizzes").doc(id).get();
        currentQuiz = doc.data();
        questions = currentQuiz.questions;
        answers = new Array(questions.length).fill(null);
        timeLeft = currentQuiz.duration * 60;
        
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('quizArea').style.display = 'block';
        
        startTimer();
        renderQuestion();
    }

    function renderQuestion() {
        const q = questions[currentIdx];
        document.getElementById('qCounter').innerText = `سؤال ${currentIdx + 1} من ${questions.length}`;
        document.getElementById('qBody').innerText = q.question;
        document.getElementById('qPoints').innerText = `+${q.points} درجة`;
        
        const area = document.getElementById('optionsArea');
        area.innerHTML = "";
        
        q.options.forEach((opt, i) => {
            const btn = document.createElement('div');
            btn.className = `opt-btn ${answers[currentIdx] === i ? 'active' : ''}`;
            btn.innerText = opt;
            btn.onclick = () => {
                answers[currentIdx] = i;
                renderQuestion();
            };
            area.appendChild(btn);
        });

        // تحديث شريط التقدم
        document.getElementById('progressBar').style.width = ((currentIdx + 1) / questions.length) * 100 + "%";
        
        // تبديل الأزرار في آخر سؤال
        if(currentIdx === questions.length - 1) {
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('finishBtn').style.display = 'block';
        } else {
            document.getElementById('nextBtn').style.display = 'block';
            document.getElementById('finishBtn').style.display = 'none';
        }
    }

    function nextQ() { if(currentIdx < questions.length - 1) { currentIdx++; renderQuestion(); } }
    function prevQ() { if(currentIdx > 0) { currentIdx--; renderQuestion(); } }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timerDisplay').innerHTML = `<i class="fas fa-clock"></i> ${m}:${s < 10 ? '0' : ''}${s}`;
            if(timeLeft <= 0) submitExam();
        }, 1000);
    }

    async function submitExam() {
        if(answers.includes(null) && timeLeft > 0) {
            if(!confirm("لسه فيه أسئلة ما اتحلتش، متأكد إنك عاوز تسلم؟")) return;
        }

        clearInterval(timerInterval);
        let score = 0;
        let total = 0;

        questions.forEach((q, i) => {
            total += q.points;
            if(answers[i] === q.correctIndex) score += q.points;
        });

        await db.collection("results").add({
            studentEmail: userEmail,
            studentName: userName,
            examTitle: currentQuiz.title,
            score: score,
            total: total,
            submittedAt: new Date()
        });

        alert(`تم التسليم بنجاح! درجتك: ${score} من ${total}`);
        location.reload(); // هيرجعه تلقائياً للوحة الإنجازات
    }

    // منع الخروج بالخطأ
    window.onbeforeunload = function() {
        if(currentQuiz) return "هل أنت متأكد من مغادرة الامتحان؟ سيتم فقدان تقدمك!";
    };
</script>
</body>
</html>
