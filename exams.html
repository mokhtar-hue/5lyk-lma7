<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة الاختبارات | الطالب</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: white; padding: 20px; }
        .header-dash { display: flex; justify-content: space-between; background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .quiz-box { background: var(--card); padding: 30px; border-radius: 25px; border: 2px solid #334155; }
        .option { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin: 10px 0; cursor: pointer; border: 1px solid transparent; }
        .option.selected { border-color: var(--primary); background: rgba(99,102,241,0.2); }
        #timer { font-size: 24px; font-weight: 900; color: #fbbf24; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header-dash">
    <div>مرحباً: <b id="stdName">..</b></div>
    <div id="timer">00:00</div>
    <button class="btn" onclick="location.href='student-dash.html'">لوحة درجاتي 📊</button>
</div>

<div id="quizArea" class="quiz-box">
    <h2 id="qTitle">اختر الامتحان من القائمة</h2>
    <div id="examList"></div>
    <div id="questionView" style="display:none;">
        <h3 id="qText"></h3>
        <div id="options"></div>
        <div style="display:flex; justify-content: space-between; margin-top:20px;">
            <button class="btn" id="prevBtn" onclick="changeQ(-1)">السابق</button>
            <button class="btn" id="nextBtn" onclick="changeQ(1)">التالي</button>
        </div>
        <button class="btn" style="width:100%; margin-top:20px; background:#22c55e;" onclick="finishExam()">تسجيل وإرسال الإجابات 🏁</button>
    </div>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const studentName = localStorage.getItem("userName") || "طالب";
    const studentEmail = localStorage.getItem("userEmail");
    document.getElementById('stdName').innerText = studentName;

    let currentExam = null;
    let currentIdx = 0;
    let userAnswers = [];
    let timeLeft = 0;
    let timerInterval;

    // جلب الامتحانات المتاحة
    db.collection("quizzes").onSnapshot(snap => {
        const list = document.getElementById('examList');
        list.innerHTML = "";
        snap.forEach(doc => {
            const ex = doc.data();
            list.innerHTML += `<button class="btn" style="margin:5px" onclick="loadExam('${doc.id}')">${ex.title}</button>`;
        });
    });

    async function loadExam(id) {
        const doc = await db.collection("quizzes").doc(id).get();
        currentExam = {id: doc.id, ...doc.data()};
        
        document.getElementById('examList').style.display = 'none';
        document.getElementById('questionView').style.display = 'block';
        document.getElementById('qTitle').innerText = currentExam.title;
        
        userAnswers = new Array(currentExam.questions.length).fill(null);
        timeLeft = currentExam.duration * 60;
        startTimer();
        showQuestion();
    }

    function showQuestion() {
        const q = currentExam.questions[currentIdx];
        document.getElementById('qText').innerText = `سؤال ${currentIdx+1}: ${q.question}`;
        const optsDiv = document.getElementById('options');
        optsDiv.innerHTML = "";
        
        q.options.forEach((opt, i) => {
            const d = document.createElement('div');
            d.className = `option ${userAnswers[currentIdx] === i ? 'selected' : ''}`;
            d.innerText = `${String.fromCharCode(97 + i).toUpperCase()}) ${opt}`;
            d.onclick = () => { userAnswers[currentIdx] = i; showQuestion(); };
            optsDiv.appendChild(d);
        });
    }

    function changeQ(dir) {
        currentIdx += dir;
        if(currentIdx < 0) currentIdx = 0;
        if(currentIdx >= currentExam.questions.length) currentIdx = currentExam.questions.length -1;
        showQuestion();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if(timeLeft <= 0) finishExam();
        }, 1000);
    }

    async function finishExam() {
        if(userAnswers.includes(null) && timeLeft > 0) {
            if(!confirm("لم تحل جميع الأسئلة، هل تريد التسليم؟")) return;
        }

        clearInterval(timerInterval);
        let score = 0;
        let totalPoints = 0;

        currentExam.questions.forEach((q, i) => {
            totalPoints += q.points;
            if(userAnswers[i] === q.correctIndex) score += q.points;
        });

        const finalData = {
            studentName: studentName,
            studentEmail: studentEmail,
            examTitle: currentExam.title,
            score: score,
            total: totalPoints,
            status: currentExam.showResult === 'yes' ? 'تم التصحيح' : 'قيد المراجعة',
            submittedAt: new Date()
        };

        await db.collection("results").add(finalData);
        alert(currentExam.showResult === 'yes' ? `انتهى الامتحان! درجتك: ${score}/${totalPoints}` : "تم استلام إجاباتك بنجاح، انتظر ظهور الدرجة.");
        location.href = "home.html";
    }
</script>
</body>
</html>
