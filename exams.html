<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المستشار | بوابة الطالب</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --accent: #22c55e; --danger: #ef4444; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #f1f5f9; margin: 0; overflow-x: hidden; }
        
        .progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 5px; background: #334155; z-index: 2000; }
        #progressBar { height: 100%; background: var(--primary); width: 0%; transition: 0.3s; }

        .navbar { display: flex; justify-content: space-between; padding: 12px 5%; background: var(--card); align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #334155; }
        .nav-right { display: flex; gap: 10px; }
        
        .btn { padding: 10px 20px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; font-family: 'Cairo'; transition: 0.3s; display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .btn-home { background: #475569; color: white; } /* زر الرجوع للموقع الرئيسي */
        .btn-dash { background: rgba(99,102,241,0.2); color: var(--primary); border: 1px solid var(--primary); } /* زر الداشبورد داخل المنصة */
        
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }

        /* لوحة التحكم */
        #dashboard { display: block; animation: fadeIn 0.4s ease; }
        .exam-item { 
            background: var(--card); padding: 20 index.htmlpx; border-radius: 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid #334155; margin-bottom: 15px; transition: 0.3s;
        }
        .exam-item.locked { opacity: 0.7; border-color: #475569; background: #161e2d; }

        /* منطقة الاختبار */
        #quizArea { display: none; background: var(--card); padding: 30px; border-radius: 25px; border: 1px solid #334155; }
        .q-text { font-size: 22px; font-weight: 700; margin-bottom: 25px; }
        
        .opt-btn { 
            background: rgba(255,255,255,0.03); border: 2px solid #334155; padding: 15px; 
            border-radius: 15px; cursor: pointer; transition: 0.2s; text-align: right; color: #cbd5e1; margin-bottom: 10px;
        }
        .opt-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .footer-nav { display: flex; justify-content: space-between; margin-top: 30px; border-top: 1px solid #334155; padding-top: 20px; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="progress-container"><div id="progressBar"></div></div>

<nav class="navbar">
    <div class="nav-right">
        <button class="btn btn-home" onclick="window.location.href='index.html'">
            <i class="fas fa-external-link-alt"></i> الموقع الرئيسي
        </button>
        <button class="btn btn-dash" id="backToListBtn" onclick="exitToDashboard()" style="display:none;">
            <i class="fas fa-list"></i> قائمة الامتحانات
        </button>
    </div>
    <div id="timerDisplay" style="font-weight:900; color:#fbbf24; font-size:18px;">00:00</div>
</nav>

<div class="container">
    <div id="dashboard">
        <h2 id="welcomeMsg">أهلاً بك يا مستشار 🚀</h2>
        <p style="color: #94a3b8; margin-bottom: 25px;">اختر اختبارك بعناية، لا يمكنك الإعادة بعد البدء.</p>
        <div id="examsList">جاري تحميل الاختبارات المتاحة...</div>
    </div>

    <div id="quizArea">
        <div style="display:flex; justify-content:space-between; color:#94a3b8; margin-bottom:10px;">
            <span id="qCount">السؤال 1</span>
            <span id="qPoints">5 درجات</span>
        </div>
        <div class="q-text" id="qBody">...</div>
        <div id="answersContainer"></div>

        <div class="footer-nav">
            <button class="btn btn-home" onclick="prevQ()">السابق</button>
            <button class="btn btn-dash" id="nextBtn" onclick="nextQ()" style="background:var(--primary); color:white;">التالي</button>
            <button class="btn" id="finishBtn" onclick="submitExam()" style="background:var(--accent); color:white; display:none;">إنهاء وتسجيل</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", 
        authDomain: "zomaapp-744fc.firebaseapp.com", 
        projectId: "zomaapp-744fc" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const userEmail = localStorage.getItem("userEmail") || "test@test.com";
    const userName = localStorage.getItem("userName") || "حازم سالم";
    document.getElementById('welcomeMsg').innerText = `أهلاً بك يا ${userName.split(' ')[0]} 🚀`;

    let currentQuiz = null;
    let questions = [];
    let currentIdx = 0;
    let studentAnswers = [];
    let timerInterval;
    let timeLeft = 0;

    // 1. تحميل الامتحانات مع فحص "هل تم الحل مسبقاً؟"
    async function loadExams() {
        const examsSnap = await db.collection("quizzes").orderBy("createdAt", "desc").get();
        const resultsSnap = await db.collection("results").where("studentEmail", "==", userEmail).get();
        
        // خريطة بالاختبارات اللي الطالب خلصها فعلياً
        const takenExams = resultsSnap.docs.map(doc => doc.data().quizId);

        const list = document.getElementById('examsList');
        list.innerHTML = "";

        examsSnap.forEach(doc => {
            const q = doc.data();
            const isTaken = takenExams.includes(doc.id);
            
            list.innerHTML += `
                <div class="exam-item ${isTaken ? 'locked' : ''}">
                    <div>
                        <h3 style="margin:0">${q.title}</h3>
                        <small style="color:#94a3b8">${q.questions.length} سؤال • ${q.duration} دقيقة</small>
                    </div>
                    ${isTaken ? 
                        '<span style="color:var(--accent); font-weight:bold;"><i class="fas fa-check-circle"></i> تم التسليم</span>' : 
                        `<button class="btn" style="background:var(--primary); color:white" onclick="startExam('${doc.id}')">ابدأ الآن</button>`
                    }
                </div>`;
        });
    }
    loadExams();

    // 2. بدء الامتحان
    async function startExam(id) {
        const doc = await db.collection("quizzes").doc(id).get();
        currentQuiz = { ...doc.data(), id: doc.id };
        questions = currentQuiz.questions;
        studentAnswers = new Array(questions.length).fill("");
        currentIdx = 0;
        timeLeft = currentQuiz.duration * 60;

        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('quizArea').style.display = 'block';
        document.getElementById('backToListBtn').style.display = 'flex'; // إظهار زر الداشبورد
        
        startTimer();
        renderQuestion();
    }

    // 3. عرض السؤال
    function renderQuestion() {
        const q = questions[currentIdx];
        document.getElementById('qCount').innerText = `السؤال ${currentIdx + 1} من ${questions.length}`;
        document.getElementById('qPoints').innerText = `${q.points} درجات`;
        document.getElementById('qBody').innerText = q.question;
        
        const container = document.getElementById('answersContainer');
        container.innerHTML = "";

        if(q.options && q.options.length > 0) {
            q.options.forEach((opt, i) => {
                const b = document.createElement('div');
                b.className = `opt-btn ${studentAnswers[currentIdx] === i ? 'active' : ''}`;
                b.innerText = opt;
                b.onclick = () => { studentAnswers[currentIdx] = i; renderQuestion(); };
                container.appendChild(b);
            });
        } else {
            const area = document.createElement('textarea');
            area.style.width = "100%"; area.style.height = "100px"; area.style.background = "#000";
            area.style.color = "#fff"; area.style.borderRadius = "10px"; area.style.padding = "10px";
            area.value = studentAnswers[currentIdx];
            area.oninput = (e) => { studentAnswers[currentIdx] = e.target.value; };
            container.appendChild(area);
        }

        document.getElementById('progressBar').style.width = ((currentIdx + 1) / questions.length) * 100 + "%";
        const last = currentIdx === questions.length - 1;
        document.getElementById('nextBtn').style.display = last ? 'none' : 'block';
        document.getElementById('finishBtn').style.display = last ? 'block' : 'none';
    }

    function nextQ() { if(currentIdx < questions.length -1) { currentIdx++; renderQuestion(); } }
    function prevQ() { if(currentIdx > 0) { currentIdx--; renderQuestion(); } }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            if(timeLeft <= 0) submitExam();
        }, 1000);
    }

    // الخروج للداشبورد
    function exitToDashboard() {
        if(confirm("هل تريد العودة للقائمة؟ لن يتم حفظ تقدمك الحالي.")) {
            clearInterval(timerInterval);
            document.getElementById('quizArea').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('backToListBtn').style.display = 'none';
            document.getElementById('progressBar').style.width = "0%";
            loadExams();
        }
    }

    // 4. تسليم النتائج
    async function submitExam() {
        clearInterval(timerInterval);
        const results = questions.map((q, i) => ({
            question: q.question,
            studentAnswer: studentAnswers[i],
            isCorrect: q.options ? (studentAnswers[i] === q.correctIndex) : null
        }));

        await db.collection("results").add({
            studentEmail: userEmail,
            studentName: userName,
            quizId: currentQuiz.id,
            examTitle: currentQuiz.title,
            answers: results,
            submittedAt: new Date()
        });

        alert("تم تسجيل النتيجة بنجاح!");
        location.reload(); // إعادة التحميل لتحديث القفل على الامتحانات
    }
</script>
</body>
</html>
