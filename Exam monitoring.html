<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>المستشار | مركز المراقبة الحية</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


<style>

/* =====================================================
   VARIABLES
===================================================== */

:root{

    --bg:#070b14;

    --panel:#111827;

    --panel2:#182235;

    --border:#263449;

    --primary:#3b82f6;

    --primary2:#60a5fa;

    --success:#10b981;

    --danger:#ef4444;

    --warning:#f59e0b;

    --text:#f8fafc;

    --muted:#94a3b8;

}


/* =====================================================
   GLOBAL
===================================================== */

*{

    box-sizing:border-box;

}


html{

    scroll-behavior:smooth;

}


body{

    margin:0;

    padding:20px;

    min-height:100vh;

    font-family:'Cairo',sans-serif;

    color:var(--text);

    background:

        radial-gradient(
            circle at top right,
            rgba(59,130,246,.12),
            transparent 35%
        ),

        radial-gradient(
            circle at bottom left,
            rgba(16,185,129,.06),
            transparent 35%
        ),

        var(--bg);

}


/* =====================================================
   MAIN
===================================================== */

.page{

    max-width:1450px;

    margin:auto;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    background:rgba(17,24,39,.94);

    border:1px solid var(--border);

    border-radius:20px;

    padding:20px 25px;

    margin-bottom:20px;

    box-shadow:

        0 20px 50px rgba(0,0,0,.25);

}


.brand{

    display:flex;

    align-items:center;

    gap:14px;

}


.brand-icon{

    width:55px;

    height:55px;

    border-radius:16px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:25px;

    background:

        linear-gradient(
            135deg,
            #2563eb,
            #3b82f6
        );

    box-shadow:

        0 10px 30px rgba(59,130,246,.25);

}


.brand h1{

    margin:0;

    font-size:23px;

    font-weight:900;

}


.brand p{

    margin:3px 0 0;

    color:var(--muted);

    font-size:13px;

}


.controls{

    display:flex;

    align-items:center;

    gap:10px;

    flex-wrap:wrap;

}


select{

    min-width:330px;

    padding:13px 15px;

    border-radius:12px;

    border:1px solid #334155;

    outline:none;

    background:#0b1220;

    color:white;

    font-family:'Cairo';

    font-size:15px;

}


select:focus{

    border-color:var(--primary);

}


button{

    font-family:'Cairo';

    border:none;

    cursor:pointer;

    transition:.2s;

}


.btn{

    min-height:46px;

    padding:10px 18px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    font-weight:800;

}


.btn:hover{

    transform:translateY(-2px);

}


.btn-danger{

    background:var(--danger);

    color:white;

}


.btn-success{

    background:var(--success);

    color:white;

}


/* =====================================================
   EXAM INFO
===================================================== */

.exam-info{

    display:none;

    background:rgba(17,24,39,.94);

    border:1px solid var(--border);

    border-radius:18px;

    padding:15px 20px;

    margin-bottom:20px;

}


.exam-info.show{

    display:flex;

}


.exam-info-inner{

    width:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

}


.exam-name{

    font-size:18px;

    font-weight:900;

}


.exam-status{

    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:7px 13px;

    border-radius:20px;

    font-size:13px;

    font-weight:800;

}


.status-open{

    background:rgba(16,185,129,.12);

    color:#34d399;

    border:1px solid rgba(16,185,129,.4);

}


.status-closed{

    background:rgba(239,68,68,.12);

    color:#f87171;

    border:1px solid rgba(239,68,68,.4);

}


/* =====================================================
   STATS
===================================================== */

.stats-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:18px;

    margin-bottom:20px;

}


.stat-card{

    position:relative;

    overflow:hidden;

    background:rgba(17,24,39,.94);

    border:1px solid var(--border);

    border-radius:18px;

    padding:22px;

    text-align:center;

}


.stat-card::after{

    content:"";

    position:absolute;

    width:100px;

    height:100px;

    border-radius:50%;

    right:-40px;

    bottom:-50px;

    background:currentColor;

    opacity:.04;

}


.stat-icon{

    width:45px;

    height:45px;

    border-radius:12px;

    margin:0 auto 10px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:20px;

}


.stat-title{

    color:var(--muted);

    font-size:14px;

    font-weight:700;

}


.stat-num{

    margin:5px 0 0;

    font-size:38px;

    font-weight:900;

}


.blue{

    color:var(--primary);

}


.green{

    color:var(--success);

}


.red{

    color:var(--danger);

}


.blue .stat-icon{

    background:rgba(59,130,246,.12);

}


.green .stat-icon{

    background:rgba(16,185,129,.12);

}


.red .stat-icon{

    background:rgba(239,68,68,.12);

}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:15px;

}


.search-box{

    position:relative;

    flex:1;

}


.search-box i{

    position:absolute;

    right:15px;

    top:50%;

    transform:translateY(-50%);

    color:var(--muted);

}


.search-box input{

    width:100%;

    height:45px;

    padding:0 45px 0 15px;

    border-radius:12px;

    border:1px solid var(--border);

    outline:none;

    background:var(--panel);

    color:white;

    font-family:'Cairo';

}


.search-box input:focus{

    border-color:var(--primary);

}


.refresh-info{

    color:var(--muted);

    font-size:12px;

    white-space:nowrap;

}


/* =====================================================
   TABLE CARD
===================================================== */

.table-card{

    background:rgba(17,24,39,.94);

    border:1px solid var(--border);

    border-radius:18px;

    overflow:hidden;

    box-shadow:

        0 20px 50px rgba(0,0,0,.2);

}


.table-head{

    padding:18px 20px;

    border-bottom:1px solid var(--border);

    display:flex;

    justify-content:space-between;

    align-items:center;

}


.table-head h2{

    margin:0;

    font-size:18px;

}


.live-indicator{

    display:flex;

    align-items:center;

    gap:7px;

    color:#34d399;

    font-size:13px;

    font-weight:800;

}


.live-dot{

    width:9px;

    height:9px;

    border-radius:50%;

    background:#10b981;

    box-shadow:

        0 0 0 5px rgba(16,185,129,.1);

}


.table-wrap{

    overflow-x:auto;

}


table{

    width:100%;

    border-collapse:collapse;

    min-width:850px;

}


th,
td{

    padding:15px;

    text-align:center;

    border-bottom:1px solid var(--border);

}


th{

    background:#0b1220;

    color:#cbd5e1;

    font-size:13px;

}


td{

    font-size:14px;

}


tbody tr{

    transition:.2s;

}


tbody tr:hover{

    background:rgba(255,255,255,.025);

}


.student-name{

    font-weight:900;

    color:white;

}


.username{

    direction:ltr;

    color:#cbd5e1;

}


.time{

    color:#cbd5e1;

    font-size:13px;

}


/* =====================================================
   BADGES
===================================================== */

.badge{

    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:6px 12px;

    border-radius:20px;

    font-size:12px;

    font-weight:800;

}


.badge-testing{

    color:#60a5fa;

    background:rgba(59,130,246,.12);

    border:1px solid rgba(59,130,246,.4);

}


.badge-submitted{

    color:#34d399;

    background:rgba(16,185,129,.12);

    border:1px solid rgba(16,185,129,.4);

}


.badge-kicked{

    color:#f87171;

    background:rgba(239,68,68,.12);

    border:1px solid rgba(239,68,68,.4);

}


/* =====================================================
   ACTION
===================================================== */

.kick-btn{

    background:rgba(239,68,68,.12);

    color:#f87171;

    border:1px solid rgba(239,68,68,.35);

    padding:7px 13px;

    border-radius:9px;

    font-size:12px;

    font-weight:800;

}


.kick-btn:hover{

    background:var(--danger);

    color:white;

}


.finished-text{

    color:var(--muted);

    font-size:12px;

}


/* =====================================================
   EMPTY
===================================================== */

.empty-state{

    padding:60px 20px;

    text-align:center;

    color:var(--muted);

}


.empty-state i{

    display:block;

    font-size:50px;

    margin-bottom:15px;

    opacity:.4;

}


.empty-state h3{

    margin:0 0 5px;

    color:#cbd5e1;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    padding:50px;

    text-align:center;

    color:var(--muted);

}


.loading i{

    font-size:30px;

    margin-bottom:10px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

    .header{

        flex-direction:column;

        align-items:stretch;

    }


    .controls{

        flex-direction:column;

    }


    select{

        width:100%;

        min-width:0;

    }


    .controls .btn{

        width:100%;

    }


    .stats-grid{

        grid-template-columns:
            1fr;

    }


    .toolbar{

        flex-direction:column;

        align-items:stretch;

    }


    .refresh-info{

        text-align:center;

    }


    .exam-info-inner{

        flex-direction:column;

        align-items:flex-start;

    }

}


@media(max-width:500px){

    body{

        padding:10px;

    }


    .brand h1{

        font-size:19px;

    }


    .brand-icon{

        width:48px;

        height:48px;

    }


    .stat-num{

        font-size:32px;

    }

}

</style>

</head>


<body>


<div class="page">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="brand">

        <div class="brand-icon">

            <i class="fas fa-satellite-dish"></i>

        </div>

        <div>

            <h1>
                رادار المراقبة الحية
            </h1>

            <p>
                مركز مراقبة الاختبارات - المستشار
            </p>

        </div>

    </div>


    <div class="controls">

        <select id="examSelect">

            <option value="">
                جاري تحميل الاختبارات...
            </option>

        </select>


        <button
            id="toggleBtn"
            class="btn btn-danger"
            onclick="toggleExamState()"
            style="display:none;">

            <i class="fas fa-lock"></i>

            غلق الاختبار

        </button>

    </div>

</div>



<!-- =====================================================
     EXAM INFO
===================================================== -->

<div
    class="exam-info"
    id="examInfo">

    <div class="exam-info-inner">

        <div>

            <div class="exam-name"
                 id="examName">

                --

            </div>

        </div>


        <div
            class="exam-status"
            id="examStatusBadge">

            --

        </div>

    </div>

</div>



<!-- =====================================================
     STATISTICS
===================================================== -->

<div class="stats-grid">


    <div class="stat-card blue">

        <div class="stat-icon">

            <i class="fas fa-user-clock"></i>

        </div>

        <div class="stat-title">

            يمتحنون الآن

        </div>

        <div
            class="stat-num"
            id="statTesting">

            0

        </div>

    </div>



    <div class="stat-card green">

        <div class="stat-icon">

            <i class="fas fa-circle-check"></i>

        </div>

        <div class="stat-title">

            أنهوا وسلموا

        </div>

        <div
            class="stat-num"
            id="statFinished">

            0

        </div>

    </div>



    <div class="stat-card red">

        <div class="stat-icon">

            <i class="fas fa-user-slash"></i>

        </div>

        <div class="stat-title">

            تم طردهم

        </div>

        <div
            class="stat-num"
            id="statKicked">

            0

        </div>

    </div>

</div>



<!-- =====================================================
     TOOLBAR
===================================================== -->

<div class="toolbar">


    <div class="search-box">

        <i class="fas fa-search"></i>

        <input
            type="text"
            id="searchInput"
            placeholder="ابحث باسم الطالب أو الكود...">

    </div>


    <div
        class="refresh-info"
        id="refreshInfo">

        اختر اختباراً للبدء

    </div>

</div>



<!-- =====================================================
     TABLE
===================================================== -->

<div class="table-card">


    <div class="table-head">

        <h2>

            <i class="fas fa-users-viewfinder"></i>

            الطلاب

        </h2>


        <div class="live-indicator">

            <span class="live-dot"></span>

            مراقبة مباشرة

        </div>

    </div>



    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>
                        #
                    </th>

                    <th>
                        اسم الطالب
                    </th>

                    <th>
                        الكود / اليوزر
                    </th>

                    <th>
                        وقت الدخول
                    </th>

                    <th>
                        الحالة
                    </th>

                    <th>
                        الإجراء
                    </th>

                </tr>

            </thead>


            <tbody id="liveBody">

                <tr>

                    <td colspan="6">

                        <div class="empty-state">

                            <i class="fas fa-radar"></i>

                            <h3>
                                لم يتم اختيار اختبار
                            </h3>

                            <div>
                                اختر اختباراً من القائمة لبدء المراقبة
                            </div>

                        </div>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


</div>



<script>


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws",

    authDomain:
        "zomaapp-744fc.firebaseapp.com",

    projectId:
        "zomaapp-744fc"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();



/* =====================================================
   VARIABLES
===================================================== */

let currentExamId = null;

let currentExamData = null;

let liveUnsubscribe = null;

let examUnsubscribe = null;

let examsUnsubscribe = null;

let examStatus = "open";

let allSessions = [];



/* =====================================================
   ELEMENTS
===================================================== */

const examSelect =
    document.getElementById(
        "examSelect"
    );


const liveBody =
    document.getElementById(
        "liveBody"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );



/* =====================================================
   INITIALIZE
===================================================== */

window.addEventListener(
    "load",
    () => {

        loadExams();

    }
);



/* =====================================================
   LOAD EXAMS
===================================================== */

function loadExams(){

    if(examsUnsubscribe){

        examsUnsubscribe();

    }


    examsUnsubscribe =
        db
        .collection("quizzes2")
        .onSnapshot(

            snapshot => {

                const previous =
                    examSelect.value;


                examSelect.innerHTML = `

                    <option value="">

                        اختر الاختبار للمراقبة...

                    </option>

                `;


                const exams = [];


                snapshot.forEach(
                    doc => {

                        exams.push({

                            id:
                                doc.id,

                            data:
                                doc.data()

                        });

                    }
                );


                /*
                   ترتيب الاختبارات حسب createdAt
                */

                exams.sort(
                    (a,b) => {

                        const ta =
                            getTimestampMillis(
                                a.data.createdAt
                            );


                        const tb =
                            getTimestampMillis(
                                b.data.createdAt
                            );


                        return tb - ta;

                    }
                );


                exams.forEach(
                    exam => {

                        const d =
                            exam.data;


                        const title =
                            d.title ||
                            "اختبار بدون اسم";


                        const status =
                            d.status === "closed"
                                ? "🔴 مغلق"
                                : "🟢 مفتوح";


                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            exam.id;


                        option.textContent =
                            `${status} | ${title}`;


                        examSelect.appendChild(
                            option
                        );

                    }
                );


                /*
                   إعادة الاختيار السابق
                */

                if(previous){

                    const exists =
                        [...examSelect.options]
                            .some(
                                o =>
                                    o.value ===
                                    previous
                            );


                    if(exists){

                        examSelect.value =
                            previous;

                    }

                }


                /*
                   لو الاختبار الحالي لم يعد موجوداً
                */

                if(
                    currentExamId &&
                    !exams.some(
                        e =>
                            e.id ===
                            currentExamId
                    )
                ){

                    resetMonitoring();

                }

            },

            error => {

                console.error(
                    "Exams error:",
                    error
                );


                showFirestoreError(
                    error
                );

            }
        );


    examSelect.onchange =
        switchExam;

}



/* =====================================================
   SWITCH EXAM
===================================================== */

function switchExam(){

    const selected =
        examSelect.value;


    currentExamId =
        selected || null;


    cleanupListeners();


    allSessions = [];


    resetStats();


    if(!currentExamId){

        document.getElementById(
            "toggleBtn"
        ).style.display =
            "none";


        document.getElementById(
            "examInfo"
        ).classList.remove(
            "show"
        );


        showEmpty(
            "لم يتم اختيار اختبار",
            "اختر اختباراً من القائمة لبدء المراقبة",
            "fa-radar"
        );


        document.getElementById(
            "refreshInfo"
        ).innerText =
            "اختر اختباراً للبدء";


        return;

    }


    document.getElementById(
        "toggleBtn"
    ).style.display =
        "flex";


    /*
       مراقبة بيانات الاختبار
    */

    watchExam();


    /*
       مراقبة الطلاب
    */

    startLiveMonitoring();

}



/* =====================================================
   WATCH EXAM
===================================================== */

function watchExam(){

    examUnsubscribe =
        db
        .collection("quizzes2")
        .doc(currentExamId)
        .onSnapshot(

            doc => {

                if(!doc.exists){

                    resetMonitoring();

                    return;

                }


                currentExamData =
                    doc.data();


                examStatus =
                    currentExamData.status ===
                    "closed"

                        ? "closed"

                        : "open";


                updateExamHeader();

            },

            error => {

                console.error(
                    "Exam listener error:",
                    error
                );


                showFirestoreError(
                    error
                );

            }
        );

}



/* =====================================================
   UPDATE EXAM HEADER
===================================================== */

function updateExamHeader(){

    const info =
        document.getElementById(
            "examInfo"
        );


    const name =
        document.getElementById(
            "examName"
        );


    const badge =
        document.getElementById(
            "examStatusBadge"
        );


    const toggle =
        document.getElementById(
            "toggleBtn"
        );


    info.classList.add(
        "show"
    );


    name.innerText =
        currentExamData.title ||
        "اختبار بدون اسم";


    if(examStatus === "open"){

        badge.className =
            "exam-status status-open";


        badge.innerHTML =
            `<i class="fas fa-circle"></i>
             الاختبار مفتوح`;


        toggle.className =
            "btn btn-danger";


        toggle.innerHTML =
            `<i class="fas fa-lock"></i>
             غلق الاختبار`;

    }

    else{

        badge.className =
            "exam-status status-closed";


        badge.innerHTML =
            `<i class="fas fa-lock"></i>
             الاختبار مغلق`;


        toggle.className =
            "btn btn-success";


        toggle.innerHTML =
            `<i class="fas fa-lock-open"></i>
             إعادة فتح الاختبار`;

    }

}



/* =====================================================
   LIVE MONITORING
===================================================== */

function startLiveMonitoring(){

    if(!currentExamId)
        return;


    showLoading();


    /*
       لا نستخدم orderBy هنا
       لتجنب مشكلة Composite Index
    */

    liveUnsubscribe =
        db
        .collection("live_sessions2")
        .where(
            "quizId",
            "==",
            currentExamId
        )
        .onSnapshot(

            snapshot => {

                allSessions = [];


                snapshot.forEach(
                    doc => {

                        const data =
                            doc.data();


                        allSessions.push({

                            id:
                                doc.id,

                            ...data

                        });

                    }
                );


                /*
                   ترتيب الجلسات داخل JavaScript
                */

                allSessions.sort(
                    (a,b) => {

                        const ta =
                            getTimestampMillis(
                                a.startTime
                            );


                        const tb =
                            getTimestampMillis(
                                b.startTime
                            );


                        return tb - ta;

                    }
                );


                renderSessions();


                document.getElementById(
                    "refreshInfo"
                ).innerText =
                    `آخر تحديث مباشر: ${
                        new Date()
                        .toLocaleTimeString(
                            "ar-EG"
                        )
                    }`;

            },

            error => {

                console.error(
                    "Live sessions error:",
                    error
                );


                showFirestoreError(
                    error
                );

            }
        );

}



/* =====================================================
   RENDER SESSIONS
===================================================== */

function renderSessions(){

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        allSessions.filter(
            session => {

                const name =
                    String(
                        session.name || ""
                    ).toLowerCase();


                const username =
                    String(
                        session.username || ""
                    ).toLowerCase();


                return (

                    !search ||

                    name.includes(search) ||

                    username.includes(search)

                );

            }
        );


    /*
       الإحصائيات تحسب من كل الطلاب
       وليس نتائج البحث
    */

    let testing = 0;

    let finished = 0;

    let kicked = 0;


    allSessions.forEach(
        session => {

            if(
                session.status ===
                "testing"
            ){

                testing++;

            }

            else if(
                session.status ===
                "submitted"
            ){

                finished++;

            }

            else if(
                session.status ===
                "kicked"
            ){

                kicked++;

            }

        }
    );


    document.getElementById(
        "statTesting"
    ).innerText =
        testing;


    document.getElementById(
        "statFinished"
    ).innerText =
        finished;


    document.getElementById(
        "statKicked"
    ).innerText =
        kicked;


    /*
       لا توجد جلسات
    */

    if(
        allSessions.length === 0
    ){

        showEmpty(
            "لا يوجد طلاب حتى الآن",
            "لم يدخل أحد إلى هذا الاختبار",
            "fa-user-clock"
        );


        return;

    }


    /*
       لا توجد نتيجة للبحث
    */

    if(
        filtered.length === 0
    ){

        showEmpty(
            "لا توجد نتائج",
            "لم يتم العثور على طالب بهذا الاسم أو الكود",
            "fa-search"
        );


        return;

    }


    liveBody.innerHTML =
        "";


    filtered.forEach(
        (session,index) => {

            liveBody.appendChild(
                createSessionRow(
                    session,
                    index + 1
                )
            );

        }
    );

}



/* =====================================================
   CREATE ROW
===================================================== */

function createSessionRow(
    session,
    number
){

    const tr =
        document.createElement(
            "tr"
        );


    /*
       الاسم
    */

    const tdNumber =
        document.createElement(
            "td"
        );


    tdNumber.innerText =
        number;


    /*
       الطالب
    */

    const tdName =
        document.createElement(
            "td"
        );


    tdName.className =
        "student-name";


    tdName.innerText =
        session.name ||
        "بدون اسم";


    /*
       username
    */

    const tdUser =
        document.createElement(
            "td"
        );


    tdUser.className =
        "username";


    tdUser.innerText =
        session.username ||
        "-";


    /*
       الوقت
    */

    const tdTime =
        document.createElement(
            "td"
        );


    tdTime.className =
        "time";


    tdTime.innerHTML =

        `<i class="far fa-clock"></i>
         ${formatTimestamp(
             session.startTime
         )}`;


    /*
       الحالة
    */

    const tdStatus =
        document.createElement(
            "td"
        );


    const badge =
        document.createElement(
            "span"
        );


    if(
        session.status ===
        "testing"
    ){

        badge.className =
            "badge badge-testing";


        badge.innerHTML =
            `<i class="fas fa-circle"></i>
             يمتحن الآن`;

    }

    else if(
        session.status ===
        "submitted"
    ){

        badge.className =
            "badge badge-submitted";


        badge.innerHTML =
            `<i class="fas fa-check"></i>
             أنهى وسلم`;

    }

    else if(
        session.status ===
        "kicked"
    ){

        badge.className =
            "badge badge-kicked";


        badge.innerHTML =
            `<i class="fas fa-user-slash"></i>
             تم طرده`;

    }

    else{

        badge.className =
            "badge";


        badge.innerHTML =
            `<i class="fas fa-question"></i>
             ${session.status || "غير معروف"}`;

    }


    tdStatus.appendChild(
        badge
    );


    /*
       الإجراء
    */

    const tdAction =
        document.createElement(
            "td"
        );


    if(
        session.status ===
        "testing"
    ){

        const kick =
            document.createElement(
                "button"
            );


        kick.className =
            "kick-btn";


        kick.innerHTML =
            `<i class="fas fa-user-slash"></i>
             طرد وتسليم`;


        kick.onclick =
            () => kickStudent(
                session.id,
                session.name
            );


        tdAction.appendChild(
            kick
        );

    }

    else if(
        session.status ===
        "submitted"
    ){

        tdAction.innerHTML =
            `<span class="finished-text">
                <i class="fas fa-check-circle"></i>
                انتهى الاختبار
             </span>`;

    }

    else if(
        session.status ===
        "kicked"
    ){

        tdAction.innerHTML =
            `<span class="finished-text"
                   style="color:#f87171;">

                <i class="fas fa-user-slash"></i>

                تم الطرد

             </span>`;

    }


    tr.appendChild(
        tdNumber
    );


    tr.appendChild(
        tdName
    );


    tr.appendChild(
        tdUser
    );


    tr.appendChild(
        tdTime
    );


    tr.appendChild(
        tdStatus
    );


    tr.appendChild(
        tdAction
    );


    return tr;

}



/* =====================================================
   KICK STUDENT
===================================================== */

async function kickStudent(
    sessionId,
    studentName
){

    const result =
        await Swal.fire({

            title:
                "طرد الطالب؟",

            html:
                `سيتم إنهاء جلسة <b>${escapeHtml(studentName || "الطالب")}</b> فوراً وتسليم إجاباته الحالية.`,

            icon:
                "warning",

            showCancelButton:
                true,

            confirmButtonColor:
                "#ef4444",

            cancelButtonColor:
                "#475569",

            confirmButtonText:
                "نعم، طرد وتسليم",

            cancelButtonText:
                "إلغاء"

        });


    if(!result.isConfirmed)
        return;


    try{

        await db
            .collection(
                "live_sessions2"
            )
            .doc(sessionId)
            .update({

                status:
                    "kicked",

                kickedAt:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            });


        await Swal.fire({

            title:
                "تم الطرد",

            text:
                "تم إرسال أمر إنهاء الجلسة للطالب.",

            icon:
                "success",

            confirmButtonText:
                "حسناً"

        });


    }

    catch(error){

        console.error(
            error
        );


        Swal.fire({

            title:
                "تعذر تنفيذ العملية",

            text:
                getFirebaseErrorMessage(
                    error
                ),

            icon:
                "error"

        });

    }

}

                    ? "نعم، غلق الاختبار"

/* =====================================================
   TIMESTAMP
===================================================== */

function getTimestampMillis(
    timestamp
){

    if(!timestamp)
        return 0;


    /*
       Firestore Timestamp
    */

    if(
        typeof timestamp.toMillis ===
        "function"
    ){

        return timestamp.toMillis();

    }


    /*
       JS Date
    */

    if(
        timestamp instanceof Date
    ){

        return timestamp.getTime();

    }


    /*
       seconds
    */

    if(
        typeof timestamp.seconds ===
        "number"
    ){

        return timestamp.seconds *
               1000;

    }


    /*
       string / number
    */

    const date =
        new Date(
            timestamp
        );


    return isNaN(
        date.getTime()
    )

        ? 0

        : date.getTime();

}



/* =====================================================
   FORMAT TIMESTAMP
===================================================== */

function formatTimestamp(
    timestamp
){

    const millis =
        getTimestampMillis(
            timestamp
        );


    if(!millis){

        return "غير محدد";

    }


    const date =
        new Date(
            millis
        );


    return date.toLocaleTimeString(
        "ar-EG",
        {

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit"

        }
    );

}



/* =====================================================
   FIREBASE ERROR
===================================================== */

function getFirebaseErrorMessage(
    error
){

    if(!error)
        return "خطأ غير معروف";


    if(
        error.code ===
        "permission-denied"
    ){

        return "ليس لديك صلاحية الوصول إلى بيانات Firestore.";

    }


    if(
        error.code ===
        "failed-precondition"
    ){

        return "هناك إعداد مطلوب في Firestore أو فهرس غير متوفر.";

    }


    if(
        error.code ===
        "unavailable"
    ){

        return "خدمة Firebase غير متاحة حالياً. تحقق من الإنترنت.";

    }


    return error.message ||
           "حدث خطأ غير معروف";

}



/* =====================================================
   FIRESTORE ERROR UI
===================================================== */

function showFirestoreError(
    error
){

    console.error(
        error
    );


    liveBody.innerHTML = `

        <tr>

            <td colspan="6">

                <div class="empty-state">

                    <i class="fas fa-triangle-exclamation"
                       style="color:#ef4444;opacity:1;"></i>

                    <h3 style="color:#f87171;">

                        تعذر قراءة البيانات

                    </h3>

                    <div>

                        ${escapeHtml(
                            getFirebaseErrorMessage(
                                error
                            )
                        )}

                    </div>

                </div>

            </td>

        </tr>

    `;

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
