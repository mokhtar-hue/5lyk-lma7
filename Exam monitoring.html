<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المستشار | مركز المراقبة الحية</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #0f172a; --panel: #1e293b; --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --text: #f8fafc; }
        body { font-family: 'Cairo', sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 15px 30px; border-radius: 15px; border: 1px solid #334155; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 24px; color: var(--primary); }
        
        .controls { display: flex; gap: 15px; align-items: center; }
        select { padding: 10px; border-radius: 8px; font-family: 'Cairo'; background: var(--dark); color: white; border: 1px solid #475569; outline: none; font-size: 16px; min-width: 250px; }
        button { padding: 10px 20px; border-radius: 8px; font-family: 'Cairo'; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-toggle { background: var(--danger); color: white; }
        .btn-toggle.closed { background: var(--success); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: var(--panel); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #334155; }
        .stat-card h3 { margin: 0 0 10px 0; color: #94a3b8; font-size: 16px; }
        .stat-card .num { font-size: 36px; font-weight: 900; margin: 0; }
        .stat-card.c-blue .num { color: var(--primary); }
        .stat-card.c-green .num { color: var(--success); }
        .stat-card.c-red .num { color: var(--danger); }

        table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 15px; overflow: hidden; }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #334155; }
        th { background: rgba(0,0,0,0.2); color: #cbd5e1; font-weight: bold; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .b-testing { background: rgba(59, 130, 246, 0.2); color: var(--primary); border: 1px solid var(--primary); }
        .b-submitted { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
        .b-kicked { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        
        .btn-kick { background: var(--danger); color: white; padding: 6px 12px; font-size: 12px; margin: auto; }
        .btn-kick:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="header">
    <h1><i class="fas fa-satellite-dish"></i> رادار المراقبة الحية</h1>
    <div class="controls">
        <select id="examSelect" onchange="switchExam()">
            <option value="">جاري تحميل الاختبارات...</option>
        </select>
        <button id="toggleBtn" class="btn-toggle" onclick="toggleExamState()" style="display:none;">
            <i class="fas fa-lock"></i> غلق الاختبار
        </button>
    </div>
</div>

<div class="stats-grid">
    <div class="stat-card c-blue">
        <h3>يمتحنون الآن (نشط)</h3>
        <p class="num" id="statTesting">0</p>
    </div>
    <div class="stat-card c-green">
        <h3>أنهوا وسلموا (مكتمل)</h3>
        <p class="num" id="statFinished">0</p>
    </div>
    <div class="stat-card c-red">
        <h3>تم طردهم/غش (مرفوض)</h3>
        <p class="num" id="statKicked">0</p>
    </div>
</div>

<table id="liveTable">
    <thead>
        <tr>
            <th>اسم الطالب</th>
            <th>الكود (اليوزر)</th>
            <th>وقت الدخول</th>
            <th>الحالة</th>
            <th>إجراءات المراقب</th>
        </tr>
    </thead>
    <tbody id="liveBody">
        <tr><td colspan="5" style="color:#94a3b8;">الرجاء اختيار اختبار من القائمة العلوية لبدء المراقبة</td></tr>
    </tbody>
</table>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCMoBEhaxmm8qEl6rti_ybAL-my9bDC5Ws", authDomain: "zomaapp-744fc.firebaseapp.com", projectId: "zomaapp-744fc" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentExamId = null;
    let liveUnsubscribe = null;
    let examUnsubscribe = null;
    let examStatus = 'open';

    // 1. جلب قائمة الاختبارات
    async function loadExamsDrop() {
        db.collection("quizzes2").orderBy("createdAt", "desc").onSnapshot(snap => {
            const sel = document.getElementById('examSelect');
            const currentVal = sel.value;
            sel.innerHTML = "<option value=''>اختر الاختبار للمراقبة...</option>";
            snap.forEach(doc => {
                const d = doc.data();
                const statusTxt = d.status === 'open' ? '🟢 مفتوح' : '🔴 مغلق';
                sel.innerHTML += `<option value="${doc.id}">${statusTxt} | ${d.title}</option>`;
            });
            if(currentVal) sel.value = currentVal;
        });
    }
    window.onload = loadExamsDrop;

    // 2. عند اختيار اختبار
    function switchExam() {
        currentExamId = document.getElementById('examSelect').value;
        const toggleBtn = document.getElementById('toggleBtn');
        
        if(!currentExamId) {
            toggleBtn.style.display = 'none';
            document.getElementById('liveBody').innerHTML = '<tr><td colspan="5">الرجاء اختيار اختبار</td></tr>';
            if(liveUnsubscribe) liveUnsubscribe();
            if(examUnsubscribe) examUnsubscribe();
            resetStats();
            return;
        }

        toggleBtn.style.display = 'flex';
        
        // مراقبة حالة الاختبار نفسه (مفتوح/مغلق) لتحديث الزر
        if(examUnsubscribe) examUnsubscribe();
        examUnsubscribe = db.collection("quizzes2").doc(currentExamId).onSnapshot(doc => {
            if(doc.exists) {
                examStatus = doc.data().status;
                if(examStatus === 'open') {
                    toggleBtn.className = 'btn-toggle'; toggleBtn.innerHTML = '<i class="fas fa-lock"></i> غلق الاختبار';
                } else {
                    toggleBtn.className = 'btn-toggle closed'; toggleBtn.innerHTML = '<i class="fas fa-lock-open"></i> إعادة فتح الاختبار';
                }
            }
        });

        // بدء المراقبة الحية للطلاب
        startLiveMonitoring();
    }

    // 3. مراقبة جدول الجلسات الحية
    function startLiveMonitoring() {
        if(liveUnsubscribe) liveUnsubscribe();
        
        liveUnsubscribe = db.collection("live_sessions2")
            .where("quizId", "==", currentExamId)
            .orderBy("startTime", "desc")
            .onSnapshot(snap => {
                const tbody = document.getElementById('liveBody');
                tbody.innerHTML = "";
                
                let countTesting = 0, countFinished = 0, countKicked = 0;

                if(snap.empty) {
                    tbody.innerHTML = '<tr><td colspan="5" style="color:#94a3b8;">لم يدخل أحد إلى هذا الاختبار حتى الآن</td></tr>';
                }

                snap.forEach(doc => {
                    const d = doc.data();
                    let badgeCls = '', badgeTxt = '', actionBtn = '';
                    
                    if(d.status === 'testing') {
                        countTesting++; badgeCls = 'b-testing'; badgeTxt = 'يمتحن الآن';
                        actionBtn = `<button class="btn-kick" onclick="kickStudent('${doc.id}')"><i class="fas fa-sign-out-alt"></i> طرد وتسليم</button>`;
                    } else if(d.status === 'submitted') {
                        countFinished++; badgeCls = 'b-submitted'; badgeTxt = 'أنهى وسلم';
                        actionBtn = '<span style="color:#94a3b8;font-size:12px;">انتهى</span>';
                    } else if(d.status === 'kicked') {
                        countKicked++; badgeCls = 'b-kicked'; badgeTxt = 'تم طرده';
                        actionBtn = '<span style="color:#ef4444;font-size:12px;">مطرود</span>';
                    }

                    const timeStr = d.startTime ? new Date(d.startTime.toDate()).toLocaleTimeString('ar-EG') : 'غير محدد';

                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight:bold;">${d.name}</td>
                            <td>${d.username}</td>
                            <td><i class="far fa-clock"></i> ${timeStr}</td>
                            <td><span class="badge ${badgeCls}">${badgeTxt}</span></td>
                            <td>${actionBtn}</td>
                        </tr>
                    `;
                });

                document.getElementById('statTesting').innerText = countTesting;
                document.getElementById('statFinished').innerText = countFinished;
                document.getElementById('statKicked').innerText = countKicked;
            });
    }

    // 4. طرد الطالب
    async function kickStudent(sessionId) {
        Swal.fire({
            title: 'هل أنت متأكد؟',
            text: "سيتم إغلاق شاشة الاختبار لدى الطالب فوراً وتسليم إجاباته الحالية واعتباره محاولة غش!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#475569',
            confirmButtonText: 'نعم، اطرد الطالب',
            cancelButtonText: 'إلغاء'
        }).then(async (result) => {
            if (result.isConfirmed) {
                await db.collection("live_sessions2").doc(sessionId).update({ status: "kicked" });
                Swal.fire('تم الطرد!', 'تم إرسال أمر الطرد والتسليم للطالب.', 'success');
            }
        });
    }

    // 5. غلق / فتح الاختبار
    async function toggleExamState() {
        if(!currentExamId) return;
        const newStatus = examStatus === 'open' ? 'closed' : 'open';
        const msg = newStatus === 'closed' ? "هل تريد غلق الاختبار؟ لن يتمكن طلاب جدد من الدخول." : "هل تريد إعادة فتح الاختبار للطلاب؟";
        
        if(confirm(msg)) {
            await db.collection("quizzes2").doc(currentExamId).update({ status: newStatus });
        }
    }

    function resetStats() {
        document.getElementById('statTesting').innerText = '0';
        document.getElementById('statFinished').innerText = '0';
        document.getElementById('statKicked').innerText = '0';
    }
</script>
</body>
</html>
