<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستعرض المستشار الفولاذي 🛡️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --bg: #020617; --card: #1e293b; --danger: #ef4444; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: white; margin: 0; overflow: hidden; user-select: none; }
        
        .viewer-wrapper { display: flex; flex-direction: column; height: 100vh; }
        .nav-header { height: 65px; background: var(--card); display: flex; justify-content: space-between; align-items: center; padding: 0 25px; border-bottom: 2px solid var(--primary); z-index: 1000; }
        
        #pdfViewport { position: relative; flex: 1; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        #pdfIframe { width: 100%; height: 100%; border: none; transition: 0.3s transform ease; transform-origin: top center; pointer-events: all; }

        /* طبقة العلامات المائية المكررة (الشبكة) */
        #watermarkGrid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 500;
            pointer-events: none; /* تسمح بالضغط والتمرير من تحتها */
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 1fr);
            opacity: 0.25; /* درجة الشفافية للون الأسود */
        }

        .watermark-item {
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(-25deg);
            color: #000; /* اللون أسود كما طلبت */
            font-size: 3.5vw;
            font-weight: 900;
            white-space: nowrap;
            text-align: center;
            line-height: 1.1;
        }

        /* التاريخ المذيل الثابت في زوايا الشاشة */
        .fixed-footer-mark {
            position: absolute;
            bottom: 15px;
            left: 20px;
            z-index: 600;
            color: rgba(0,0,0,0.4);
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
        }

        /* درع حماية الأزرار */
        .shield-top { position: absolute; top: 0; left: 0; width: 100%; height: 65px; z-index: 700; cursor: not-allowed; }

        .tools { display: flex; gap: 15px; }
        .btn-tool { background: var(--primary); color: white; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; }
        .btn-back { background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; text-decoration: none; }

        /* شاشة الحماية السوداء */
        #blackout { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 9999; display: none; 
            flex-direction: column; align-items: center; justify-content: center; 
            text-align: center; padding: 20px; 
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="blackout">
    <i class="fas fa-user-lock fa-5x" style="color: var(--danger); margin-bottom: 20px;"></i>
    <h1 style="color: var(--danger)">تم رصد محاولة تصوير!</h1>
    <p>تم حظر المحتوى فوراً لحماية حقوق المستشار.</p>
    <button class="btn-tool" onclick="location.reload()" style="margin-top:20px;">إعادة تنشيط المستعرض</button>
</div>

<div class="viewer-wrapper">
    <div class="nav-header">
        <button class="btn-back" onclick="window.close()"><i class="fas fa-times"></i> إغلاق</button>
        <h3 id="pdfTitle" style="margin:0;">جاري التحميل...</h3>
        <div class="tools">
            <button class="btn-tool" onclick="zoomPDF(0.2)"><i class="fas fa-search-plus"></i></button>
            <button class="btn-tool" onclick="zoomPDF(-0.2)"><i class="fas fa-search-minus"></i></button>
        </div>
    </div>

    <div id="pdfViewport">
        <div class="shield-top"></div>
        
        <div id="watermarkGrid">
            </div>

        <div class="fixed-footer-mark" id="fixedDate"></div>
        
        <iframe id="pdfIframe" src=""></iframe>
    </div>
</div>

<script>
    let zoomLevel = 1;
    const studentMail = localStorage.getItem("userEmail") || "PROTECTED_USER";
    const rawLink = localStorage.getItem('currentPdfLink') || "";
    const pdfTitle = localStorage.getItem('currentPdfTitle') || "مذكرة المستشار";

    function init() {
        document.getElementById('pdfTitle').innerText = pdfTitle;
        
        // 1. توليد شبكة العلامات المائية (8 علامات تغطي الشاشة)
        const grid = document.getElementById('watermarkGrid');
        for (let i = 0; i < 8; i++) {
            const item = document.createElement('div');
            item.className = 'watermark-item';
            item.innerHTML = `<div>${studentMail}<br><span style="font-size:0.5em">حقوق المستشار محفوظة</span></div>`;
            grid.appendChild(item);
        }

        // 2. ضبط التاريخ المذيل الثابت
        const now = new Date();
        const dateStr = "تاريخ الدخول: " + now.toLocaleDateString('ar-EG') + " | " + now.getHours() + ":" + now.getMinutes();
        document.getElementById('fixedDate').innerText = dateStr;
        
        let finalUrl = rawLink;
        if(rawLink.includes('drive.google.com')) {
            finalUrl = rawLink.replace(/\/view.*|\/edit.*/, '/preview');
        }
        document.getElementById('pdfIframe').src = finalUrl;
    }

    function zoomPDF(val) {
        zoomLevel += val;
        if(zoomLevel < 0.7) zoomLevel = 0.7;
        if(zoomLevel > 2.5) zoomLevel = 2.5;
        
        const iframe = document.getElementById('pdfIframe');
        iframe.style.transform = `scale(${zoomLevel})`;
        iframe.style.width = (100 / zoomLevel) + "%";
        iframe.style.height = (100 / zoomLevel) + "%";
    }

    // --- نظام الحماية الذكي ---
    function triggerSecurity() {
        document.getElementById('blackout').style.display = "flex";
        navigator.clipboard.writeText('محاولة تصوير فاشلة 🛡️');
    }

    // رصد زر تصوير الشاشة وتسويد الشاشة فوراً
    window.addEventListener('keyup', (e) => {
        if (e.key === 'PrintScreen' || e.key === 'Snapshot') {
            triggerSecurity();
        }
    });

    // التسويد عند الخروج من النافذة
    window.addEventListener('blur', () => {
        triggerSecurity();
    });

    window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && ['s', 'p', 'u', 'c', 'shift'].includes(e.key.toLowerCase())) {
            e.preventDefault();
            triggerSecurity();
        }
        if(e.keyCode == 123) { e.preventDefault(); triggerSecurity(); }
    });

    init();
</script>
</body>
</html>
