<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستعرض المستشار الفولاذي 🛡️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --bg: #020617; --card: #1e293b; --danger: #ef4444; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: white; margin: 0; overflow: hidden; user-select: none; }
        
        .viewer-wrapper { display: flex; flex-direction: column; height: 100vh; }
        .nav-header { height: 65px; background: var(--card); display: flex; justify-content: space-between; align-items: center; padding: 0 25px; border-bottom: 2px solid var(--primary); z-index: 1000; }
        
        #pdfViewport { position: relative; flex: 1; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        /* جعل الـ iframe والطبقات قابلة للتمرير معاً */
        #scrollContainer { width: 100%; height: 100%; overflow-y: auto; position: relative; }
        
        #pdfIframe { width: 100%; height: 5000px; border: none; transition: 0.3s transform ease; transform-origin: top center; pointer-events: all; }

        /* العلامة المائية المتكررة على كل الصفحات باللون الأسود */
        #watermarkLayer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 500;
            /* إنشاء خلفية متكررة تحتوي على اليوزر */
            background-repeat: repeat;
            opacity: 0.15; /* شفافية موزونة للقراءة */
        }

        /* التاريخ المذيل الثابت في أسفل الشاشة */
        #footerDate {
            position: fixed; bottom: 10px; right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 15px; border-radius: 20px;
            font-size: 14px; z-index: 1001;
            border: 1px solid var(--primary);
            color: #fff;
        }

        /* درع حماية الأزرار */
        .shield-top { position: absolute; top: 0; left: 0; width: 100%; height: 65px; z-index: 600; cursor: not-allowed; }

        .tools { display: flex; gap: 15px; }
        .btn-tool { background: var(--primary); color: white; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; }
        .btn-back { background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; text-decoration: none; }

        #blackout { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 9999; display: none; 
            flex-direction: column; align-items: center; justify-content: center; 
            text-align: center; padding: 20px; 
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="blackout">
    <i class="fas fa-user-lock fa-5x" style="color: var(--danger); margin-bottom: 20px;"></i>
    <h1 style="color: var(--danger)">تم رصد محاولة تصوير!</h1>
    <p>تم إغلاق المحتوى فوراً لحماية حقوق المستشار.</p>
    <button class="btn-tool" onclick="location.reload()" style="margin-top:20px;">إعادة فتح المذكرة</button>
</div>

<div id="footerDate">جاري تحديث التاريخ...</div>

<div class="viewer-wrapper">
    <div class="nav-header">
        <button class="btn-back" onclick="window.close()"><i class="fas fa-times"></i> إغلاق</button>
        <h3 id="pdfTitle" style="margin:0;">تحميل المذكرة...</h3>
        <div class="tools">
            <button class="btn-tool" onclick="zoomPDF(0.2)"><i class="fas fa-search-plus"></i></button>
            <button class="btn-tool" onclick="zoomPDF(-0.2)"><i class="fas fa-search-minus"></i></button>
        </div>
    </div>

    <div id="pdfViewport">
        <div class="shield-top"></div>
        
        <div id="scrollContainer">
            <div id="watermarkLayer"></div>
            <iframe id="pdfIframe" src=""></iframe>
        </div>
    </div>
</div>

<script>
    let zoomLevel = 1;
    const studentMail = localStorage.getItem("userEmail") || "PROTECTED_USER";
    const rawLink = localStorage.getItem('currentPdfLink') || "";
    const pdfTitle = localStorage.getItem('currentPdfTitle') || "مذكرة المستشار";

    function init() {
        document.getElementById('pdfTitle').innerText = pdfTitle;
        
        // 1. توليد العلامة المائية المتكررة (سوداء)
        generateRepeatingWatermark();

        // 2. ضبط التاريخ الثابت في الأسفل
        const now = new Date();
        document.getElementById('footerDate').innerText = "توقيت الوصول: " + now.toLocaleString('ar-EG');
        
        let finalUrl = rawLink;
        if(rawLink.includes('drive.google.com')) {
            finalUrl = rawLink.replace(/\/view.*|\/edit.*/, '/preview');
        }
        document.getElementById('pdfIframe').src = finalUrl;
    }

    function generateRepeatingWatermark() {
        const canvas = document.createElement('canvas');
        canvas.width = 500;
        canvas.height = 400;
        const ctx = canvas.getContext('2d');
        
        // ضبط ستايل النص (أسود)
        ctx.fillStyle = "black"; 
        ctx.font = "bold 30px Cairo";
        ctx.textAlign = "center";
        
        // تدوير النص
        ctx.translate(250, 200);
        ctx.rotate(-30 * Math.PI / 180);
        
        // رسم اليوزر
        ctx.fillText(studentMail, 0, 0);
        ctx.font = "15px Cairo";
        ctx.fillText("حقوق المستشار محفوظة 🛡️", 0, 40);
        
        // تحويل الكانفاس لصورة متكررة
        const dataUrl = canvas.toDataURL();
        document.getElementById('watermarkLayer').style.backgroundImage = `url(${dataUrl})`;
    }

    function zoomPDF(val) {
        zoomLevel += val;
        if(zoomLevel < 0.7) zoomLevel = 0.7;
        if(zoomLevel > 2.5) zoomLevel = 2.5;
        
        const iframe = document.getElementById('pdfIframe');
        const watermark = document.getElementById('watermarkLayer');
        
        iframe.style.transform = `scale(${zoomLevel})`;
        // الحفاظ على تطابق حجم العلامة المائية مع الملف عند الزووم
        watermark.style.transform = `scale(${zoomLevel})`;
        watermark.style.transformOrigin = "top center";
    }

    // --- نظام الحماية الصارم ---

    function triggerSecurity() {
        document.getElementById('blackout').style.display = "flex";
        navigator.clipboard.writeText('⚠️ محاولة سرقة محتوى مرصودة');
    }

    window.addEventListener('keyup', (e) => {
        if (e.key === 'PrintScreen' || e.key === 'Snapshot') triggerSecurity();
    });

    window.addEventListener('blur', () => triggerSecurity());

    window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && ['p','s','u','c','j'].includes(e.key.toLowerCase())) {
            e.preventDefault();
            triggerSecurity();
        }
        if(e.keyCode == 123) { e.preventDefault(); triggerSecurity(); }
    });

    init();
</script>
</body>
</html>
